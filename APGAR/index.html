<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Apgar Simulator – Blue Slider + Respiration</title>
<style>
  body{
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:#f6f8fb;
    color:#111;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
  }
  h1{margin-bottom:8px}
  .stage{
    position:relative;
    width:min(90vw,440px);
    background:#fff;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
    overflow:hidden;
  }
  #baby{
    width:100%;
    height:auto;
    display:block;
  }
  .overlay{
    position:absolute;
    inset:0;
    pointer-events:none;
    mix-blend-mode:multiply;
    transition:background .2s linear;
    -webkit-mask-image:url('baby2.png');
    mask-image:url('baby2.png');
    -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
    -webkit-mask-size:100% 100%;mask-size:100% 100%;
    -webkit-mask-position:center center;mask-position:center center;
  }
  .controls{
    width:min(90vw,440px);
    background:#fff;
    border:1px solid #e4e7ec;
    border-radius:12px;
    margin-top:16px;
    padding:12px;
    box-shadow:0 1px 4px rgba(0,0,0,.05);
  }
  input[type=range]{width:100%;accent-color:#388bff}
  .labelrow{
    display:flex;
    justify-content:space-between;
    margin-top:4px;
    font-size:14px;
  }
</style>
</head>
<body>

<h1>🩺 Apgar Color + Respiration Demo</h1>

<div class="stage">
  <img id="baby" src="baby2.png" alt="training manikin">
  <div id="overlay" class="overlay"></div>
</div>

<div class="controls">
  <label for="slider">Cyanosis Level</label>
  <input type="range" id="slider" min="0" max="100" value="0">
  <div class="labelrow"><span>0 = Normal Pink</span><span>100 = Central Cyanosis</span></div>

  <label style="margin-top:12px;display:block">
    <input type="checkbox" id="respToggle" checked> Enable Respiration Animation
  </label>
</div>

<script>
const baby=document.getElementById('baby');
const overlay=document.getElementById('overlay');
const slider=document.getElementById('slider');
const respToggle=document.getElementById('respToggle');

/* --- Cyanosis gradient --- */
function updateBlue(v){
  // 0–30 = acrocyanosis (hands/feet)
  // 30–100 = spreads toward core
  if(v<=30){
    const a=v/40;
    overlay.style.background =
      `radial-gradient(22% 20% at 18% 88%, rgba(90,150,255,${a}) 0%, transparent 60%),`+
      `radial-gradient(22% 20% at 82% 88%, rgba(90,150,255,${a}) 0%, transparent 60%)`;
  }else{
    const a=.4+(v-30)/100;
    overlay.style.background =
      `radial-gradient(circle at 50% 60%, rgba(90,150,255,${a}), transparent 75%)`;
  }
}
slider.addEventListener('input',e=>updateBlue(Number(e.target.value)));
updateBlue(0);

/* --- Respiration bulge --- */
let t=0;
function animate(now){
  const dt=now-t; t=now;
  const on=respToggle.checked;
  const freq=on?1.5:0;
  const amp=on?0.015:0;
  const scale=1+amp*Math.sin(now/1000*2*Math.PI*freq);
  baby.style.transform=`scale(${scale.toFixed(3)})`;
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);
</script>

</body>
</html>
