<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Apgar Simulator</title>
<style>
  body {
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: #fafafb;
    padding: 10px;
    text-align: center;
  }
  .stage {
    position: relative;
    display: inline-block;
    width: min(90vw, 420px);
  }
  #babyBase {
    width: 100%;
    border-radius: 8px;
    display: block;
  }
  /* overlays */
  .overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  #overlayFull {
    background: linear-gradient(#7ab1ff88, #6fa8ff66);
    mix-blend-mode: multiply;
  }
  #overlayHandsFeet {
    background: radial-gradient(circle at 20% 80%, #6fa8ff88 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, #6fa8ff88 0%, transparent 40%);
    mix-blend-mode: multiply;
  }
  .controls {
    margin-top: 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }
  button {
    padding: 8px 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    background: white;
    cursor: pointer;
  }
</style>
</head>
<body>

<h2>🍼 Apgar Simulator</h2>

<div class="stage">
  <img id="babyBase" src="baby.png" alt="training manikin" />
  <div id="overlayFull" class="overlay"></div>
  <div id="overlayHandsFeet" class="overlay"></div>
</div>

<div class="controls">
  <button onclick="setAppearance(0)">Appearance 0 (Central Cyanosis)</button>
  <button onclick="setAppearance(1)">Appearance 1 (Acrocyanosis)</button>
  <button onclick="setAppearance(2)">Appearance 2 (Pink)</button>
</div>

<div class="controls">
  <button onclick="toggleBreathing()">Toggle Breathing</button>
  <button onclick="blinkNow()">Blink</button>
</div>

<script>
const overlayFull = document.getElementById('overlayFull');
const overlayHandsFeet = document.getElementById('overlayHandsFeet');
const babyBase = document.getElementById('babyBase');

function setAppearance(score) {
  overlayFull.style.opacity = 0;
  overlayHandsFeet.style.opacity = 0;

  if (score === 0) {
    overlayFull.style.opacity = 1;
  } else if (score === 1) {
    overlayHandsFeet.style.opacity = 1;
  }
}

/* ========== Simple Breathing Animation ========== */
let breathing = true;
let phase = 0;
function animateBreathing() {
  if (breathing) {
    phase += 0.03;
    const scale = 1 + Math.sin(phase) * 0.01;
    babyBase.style.transform = `scale(${scale})`;
  }
  requestAnimationFrame(animateBreathing);
}
requestAnimationFrame(animateBreathing);

function toggleBreathing() {
  breathing = !breathing;
  if (!breathing) babyBase.style.transform = 'scale(1)';
}

/* ========== Simple Blink Animation ========== */
function blinkNow() {
  babyBase.style.filter = 'brightness(0.7)';
  setTimeout(() => babyBase.style.filter = 'brightness(1)', 120);
}

/* Default state */
setAppearance(2);
</script>

</body>
</html>
