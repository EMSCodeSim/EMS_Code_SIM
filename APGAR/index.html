<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Apgar – Fading Blue Circle + Respiration</title>
<style>
  body{
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:#f6f8fb; color:#111;
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  h1{margin:6px 0 10px}
  .stage{
    position:relative; width:min(90vw,440px); background:#fff; border:1px solid #e4e7ec;
    border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,.08); overflow:hidden;
  }
  #baby{width:100%; height:auto; display:block;}
  /* Overlay masked to baby only */
  .overlay{
    position:absolute; inset:0; pointer-events:none; mix-blend-mode:multiply;
    -webkit-mask-image:url('baby2.png'); mask-image:url('baby2.png');
    -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
    -webkit-mask-size:100% 100%; mask-size:100% 100%;
    -webkit-mask-position:center center; mask-position:center center;
    transition:background .2s linear;
  }
  .controls{
    width:min(90vw,440px); margin-top:14px; background:#fff; border:1px solid #e4e7ec;
    border-radius:12px; padding:12px; box-shadow:0 1px 4px rgba(0,0,0,.05);
  }
  input[type=range]{width:100%; accent-color:#388bff}
  .row{display:flex; justify-content:space-between; font-size:14px; margin-top:4px}
  label{display:block; margin-top:10px}
</style>
</head>
<body>

<h1>🩺 Cyanosis Fade Demo</h1>

<div class="stage">
  <img id="baby" src="baby2.png" alt="training manikin">
  <div id="overlay" class="overlay"></div>
</div>

<div class="controls">
  <strong>Cyanosis Level</strong>
  <input type="range" id="slider" min="0" max="100" value="0">
  <div class="row"><span>0 = Pink</span><span>100 = Central Cyanosis</span></div>

  <label><input type="checkbox" id="respToggle" checked> Enable respiration chest bulge</label>
</div>

<script>
const baby   = document.getElementById('baby');
const overlay= document.getElementById('overlay');
const slider = document.getElementById('slider');
const respOn = document.getElementById('respToggle');

/* --- Fading blue circle --- */
function updateBlue(v){
  // Circle centered slightly higher (50% x, 40% y)
  // Smooth fading gradient toward center
  const inner = Math.max(3, 70 - v * 0.66); // % radius of clear center
  const fadeStart = inner - 10; // adds smooth gradient zone
  const alpha = 0.8;
  overlay.style.background =
    `radial-gradient(circle at 50% 40%, rgba(90,150,255,${alpha}) ${fadeStart}%, rgba(90,150,255,${alpha*0.7}) ${inner}%, transparent ${inner+25}%)`;
}
slider.addEventListener('input', e=>updateBlue(+e.target.value));
updateBlue(0);

/* --- Respiration: gentle scale animation --- */
let t0=performance.now();
function loop(now){
  const freq = respOn.checked ? 1.5 : 0;
  const amp  = respOn.checked ? 0.012 : 0;
  const s = 1 + amp * Math.sin((now - t0)/1000 * 2*Math.PI*freq);
  baby.style.transform = `scale(${s.toFixed(3)})`;
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>

</body>
</html>
