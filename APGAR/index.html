<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Apgar Color Fade Simulator</title>
<style>
  body{
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:#f5f7fa;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
  }
  h1{margin-bottom:6px}
  p{margin-top:0;color:#555;font-size:14px;text-align:center}
  .stage{
    position:relative;
    width:min(90vw,420px);
    background:#fff;
    border:1px solid #ddd;
    border-radius:12px;
    box-shadow:0 2px 6px rgba(0,0,0,.08);
    overflow:hidden;
  }
  #baby{
    display:block;
    width:100%;
    height:auto;
  }
  .overlay{
    position:absolute;
    inset:0;
    pointer-events:none;
    transition:background 0.2s linear;
  }
  .controls{
    width:min(90vw,420px);
    margin-top:16px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  input[type=range]{
    width:100%;
    margin-top:8px;
    accent-color:#4b9cff;
  }
  #val{
    font-weight:600;
    margin-top:4px;
  }
</style>
</head>
<body>

<h1>🩺 Apgar Color Fade Demo</h1>
<p>Move the slider to simulate cyanosis progression<br>(0 = pink, 100 = blue core)</p>

<div class="stage">
  <img id="baby" src="manikin_extended.png" alt="training manikin">
  <div id="overlay" class="overlay"></div>
</div>

<div class="controls">
  <input type="range" id="slider" min="0" max="100" value="0" />
  <div id="val">Pink / Normal</div>
</div>

<script>
const overlay = document.getElementById('overlay');
const slider  = document.getElementById('slider');
const valTxt  = document.getElementById('val');

function updateOverlay(v){
  // 0–30: acrocyanosis (hands/feet)
  // 30–70: spreading cyanosis toward core
  // 70–100: full central cyanosis
  const blue = 'rgba(90,160,255,';
  if(v<=30){
    // Hands & feet
    const a = (v/30)*0.8;
    overlay.style.background =
      `radial-gradient(25% 22% at 20% 90%, ${blue}${a}) 0%, transparent 60%),`+
      `radial-gradient(25% 22% at 80% 90%, ${blue}${a}) 0%, transparent 60%)`;
    overlay.style.backgroundBlendMode = 'multiply';
    valTxt.textContent = 'Acrocyanosis (Blue hands/feet)';
  }else if(v<=70){
    const a = 0.4 + (v-30)/100; // increasing coverage
    overlay.style.background =
      `radial-gradient(circle at 50% 60%, ${blue}${a}), transparent 80%)`;
    overlay.style.backgroundBlendMode = 'multiply';
    valTxt.textContent = 'Cyanosis spreading toward core';
  }else{
    const a = 0.6 + (v-70)/80;
    overlay.style.background =
      `linear-gradient(${blue}${a}), ${blue}${a})`;
    overlay.style.backgroundBlendMode = 'multiply';
    valTxt.textContent = 'Central Cyanosis (Full blue)';
  }
}

slider.addEventListener('input', e=>{
  updateOverlay(Number(e.target.value));
});

updateOverlay(0);
</script>

</body>
</html>
