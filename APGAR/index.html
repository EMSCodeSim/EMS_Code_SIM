<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Apgar – Closing Blue Circle + Respiration</title>
<style>
  body{
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:#f6f8fb; color:#111;
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  h1{margin:6px 0 10px}
  .stage{
    position:relative; width:min(90vw,440px); background:#fff; border:1px solid #e4e7ec;
    border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,.08); overflow:hidden;
  }
  #baby{width:100%; height:auto; display:block;}
  /* Overlay is masked to the baby silhouette so the room/bg never tints */
  .overlay{
    position:absolute; inset:0; pointer-events:none; mix-blend-mode:multiply;
    -webkit-mask-image:url('baby2.png'); mask-image:url('baby2.png');
    -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
    -webkit-mask-size:100% 100%; mask-size:100% 100%;
    -webkit-mask-position:center center; mask-position:center center;
    transition:background .15s linear;
  }
  .controls{
    width:min(90vw,440px); margin-top:14px; background:#fff; border:1px solid #e4e7ec;
    border-radius:12px; padding:12px; box-shadow:0 1px 4px rgba(0,0,0,.05);
  }
  input[type=range]{width:100%; accent-color:#388bff}
  .row{display:flex; justify-content:space-between; font-size:14px; margin-top:4px}
  label{display:block; margin-top:10px}
</style>
</head>
<body>

<h1>🩺 Cyanosis “Closing Circle” Demo</h1>

<div class="stage">
  <img id="baby" src="baby2.png" alt="training manikin">
  <div id="overlay" class="overlay"></div>
</div>

<div class="controls">
  <strong>Cyanosis Level</strong>
  <input type="range" id="slider" min="0" max="100" value="0">
  <div class="row"><span>0 = Pink / clear center</span><span>100 = Blue reaches center</span></div>

  <label><input type="checkbox" id="respToggle" checked> Enable respiration chest bulge</label>
</div>

<script>
const baby   = document.getElementById('baby');
const overlay= document.getElementById('overlay');
const slider = document.getElementById('slider');
const respOn = document.getElementById('respToggle');

/* Closing blue circle:
   - A radial gradient with a transparent inner stop (“hole”) and blue outside
   - Centered near mid-chest (50% x, 60% y). Adjust if needed for your image. */
function updateBlue(v){
  // Map slider 0..100 to inner-hole radius (%) from large -> tiny
  const inner = Math.max(4, 70 - v * 0.66); // 70% at v=0, ~4% at v=100
  const alpha = 0.70; // blue strength
  overlay.style.background =
    `radial-gradient(circle at 50% 60%, transparent ${inner}%, rgba(90,150,255,${alpha}) ${inner}%, rgba(90,150,255,${alpha}) 100%)`;
}
slider.addEventListener('input', e=>updateBlue(+e.target.value));
updateBlue(0);

/* Respiration: gentle chest/whole-image bulge */
let t0=performance.now();
function loop(now){
  const freq = respOn.checked ? 1.6 : 0;        // breaths/sec
  const amp  = respOn.checked ? 0.014 : 0;      // scale amplitude
  const s = 1 + amp * Math.sin((now - t0)/1000 * 2*Math.PI*freq);
  baby.style.transform = `scale(${s.toFixed(3)})`;
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>

</body>
</html>
