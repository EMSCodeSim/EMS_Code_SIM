<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Apgar Training Simulator</title>
<style>
body{
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  background:#f5f7fa;color:#111;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
}
h1{margin:6px 0 10px}
.stage{
  position:relative;width:min(90vw,440px);background:#fff;border:1px solid #e4e7ec;
  border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);overflow:hidden;
}
#baby{width:100%;height:auto;display:block;transform-origin:center 35%;}
.overlay{
  position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;
  -webkit-mask-image:url('baby2.png');mask-image:url('baby2.png');
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  -webkit-mask-size:100% 100%;mask-size:100% 100%;
  transition:background .3s linear;
}
.controls,.tests{
  width:min(90vw,440px);background:#fff;border:1px solid #e4e7ec;border-radius:12px;
  padding:12px;box-shadow:0 1px 4px rgba(0,0,0,.05);margin-top:12px;
}
input[type=range]{width:100%;accent-color:#388bff}
.row{display:flex;justify-content:space-between;font-size:14px;margin-top:4px}
.btn{padding:8px 10px;border:1px solid #ccc;border-radius:8px;cursor:pointer;background:#fff;font-size:14px}
.btn:hover{border-color:#2563eb;color:#2563eb}
</style>
</head>
<body>

<h1>🩺 Apgar Training Simulator</h1>

<div class="stage">
  <img id="baby" src="baby2.png" alt="training manikin">
  <div id="overlay" class="overlay"></div>
</div>

<div class="controls">
  <strong>Appearance (Color)</strong>
  <input type="range" id="slider" min="0" max="100" value="0">
  <div class="row"><span>0 = Pink / Normal</span><span>100 = Dark Blue / Cyanotic</span></div>
</div>

<div class="tests">
  <strong>Test Apgar Components</strong><br>
  <button class="btn" id="testAppearance">Test Appearance</button>
  <button class="btn" id="testPulse">Test Pulse</button>
  <button class="btn" id="testResp">Test Respiration</button>
  <button class="btn" id="testActivity" disabled>Test Activity (coming soon)</button>
</div>

<script>
/* --- Elements --- */
const baby=document.getElementById('baby');
const overlay=document.getElementById('overlay');
const slider=document.getElementById('slider');

/* --- Audio pulse setup --- */
let ctx,osc,gain;
function initAudio(){
  if(ctx) return;
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  osc=ctx.createOscillator();gain=ctx.createGain();
  osc.type='square';osc.connect(gain).connect(ctx.destination);
  gain.gain.value=0;osc.start();
}
window.addEventListener('click',initAudio,{once:true});

/* --- Vital state variables --- */
let heartRate=120;     // beats per minute
let respRate=40;       // breaths per minute
let breathAmp=0.012;   // breathing amplitude
let cyanosis=0;        // 0–100 from slider
let time=performance.now();

/* --- Update blue overlay + vitals with slider --- */
function updateBlue(v){
  cyanosis=v;
  // heart and respiration slow with cyanosis
  heartRate = 120 - (v*0.8);      // down to ~40 at 100%
  respRate  = 40  - (v*0.25);     // down to ~15 at 100%
  breathAmp = 0.012 - (v*0.00007); // weaker chest motion
  // elliptical gradient: outer→inner fade, darker center at 100%
  const alpha=0.9;
  const outerBlue=`rgba(20,60,180,${alpha})`;
  const innerBlue=`rgba(10,30,100,${alpha})`;
  const start=Math.max(0,85 - v*0.8); // hands turn early
  overlay.style.background=
    `radial-gradient(ellipse 85% 70% at 50% 38%, ${innerBlue} ${100-v*0.7}%, ${outerBlue} 100%)`;
}
slider.addEventListener('input',e=>updateBlue(+e.target.value));
updateBlue(0);

/* --- Respiration + Pulse animation --- */
let pulseTimer=0;
function animate(now){
  const dt=(now-time)/1000;time=now;

  // breathing (chest only)
  const freq=respRate/60;
  const s=1+breathAmp*Math.sin(now/1000*2*Math.PI*freq);
  baby.style.transform=`scaleY(${s.toFixed(3)})`;

  // pulse sound
  if(ctx && gain){
    const beatInt=60/heartRate;
    pulseTimer+=dt;
    if(pulseTimer>=beatInt){
      pulseTimer=0;
      gain.gain.setValueAtTime(0.2,ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.1);
      osc.frequency.setValueAtTime(140,ctx.currentTime);
    }
  }
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

/* --- Test buttons --- */
document.getElementById('testAppearance').onclick=()=>{
  slider.value=slider.value<100?100:0;
  updateBlue(+slider.value);
};
document.getElementById('testPulse').onclick=()=>{
  alert(`Pulse Test:\nCurrent Heart Rate: ${Math.round(heartRate)} bpm\n(Cyanosis ${cyanosis}%)`);
};
document.getElementById('testResp').onclick=()=>{
  alert(`Respiration Test:\nRate: ${Math.round(respRate)} bpm\nChest Motion Amplitude: ${breathAmp.toFixed(3)}`);
};
</script>
</body>
</html>
