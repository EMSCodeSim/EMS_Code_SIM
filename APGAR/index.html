<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Apgar Training Simulator</title>
<style>
body{
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  background:#f5f7fa;color:#111;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
}
h1{margin:6px 0 10px}
.stage{
  position:relative;width:min(90vw,440px);background:#fff;border:1px solid #e4e7ec;
  border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);overflow:hidden;
}
#baby{width:100%;height:auto;display:block;transform-origin:center 35%;}
.overlay{
  position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;
  -webkit-mask-image:url('baby2.png');mask-image:url('baby2.png');
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  -webkit-mask-size:100% 100%;mask-size:100% 100%;
  transition:background .25s linear;
}
.controls{
  width:min(90vw,440px);background:#fff;border:1px solid #e4e7ec;border-radius:12px;
  padding:12px;box-shadow:0 1px 4px rgba(0,0,0,.05);margin-top:12px;
}
input[type=range]{width:100%;accent-color:#388bff}
.row{display:flex;justify-content:space-between;font-size:14px;margin-top:4px}
.apgar-table{width:min(90vw,440px);margin-top:14px;border-collapse:collapse;font-size:14px;background:#fff;
  border:1px solid #e4e7ec;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.05);}
.apgar-table th,.apgar-table td{padding:6px 4px;text-align:center;border-bottom:1px solid #e4e7ec}
.apgar-table th:first-child,.apgar-table td:first-child{text-align:left;padding-left:8px}
.btn{
  padding:4px 8px;border:1px solid #ccc;border-radius:6px;cursor:pointer;background:#fff;font-size:13px
}
.btn[data-active="1"]{border-color:#2563eb;color:#2563eb;font-weight:600}
.score-row{font-weight:700;background:#f1f5fb}
</style>
</head>
<body>

<h1>🩺 Apgar Training Simulator</h1>

<div class="stage">
  <img id="baby" src="baby2.png" alt="training manikin">
  <div id="overlay" class="overlay"></div>
</div>

<div class="controls">
  <strong>Appearance (Color)</strong>
  <input type="range" id="slider" min="0" max="100" value="0">
  <div class="row"><span>0 = Pink / Normal</span><span>100 = Full Cyanosis</span></div>
</div>

<table class="apgar-table" id="apgarTable">
  <thead>
    <tr><th>Category</th><th>0</th><th>1</th><th>2</th></tr>
  </thead>
  <tbody>
    <tr data-cat="appearance"><td>Appearance</td>
      <td><button class="btn" data-val="0">0</button></td>
      <td><button class="btn" data-val="1">1</button></td>
      <td><button class="btn" data-val="2" data-active="1">2</button></td>
    </tr>
    <tr data-cat="pulse"><td>Pulse</td>
      <td><button class="btn" data-val="0">0</button></td>
      <td><button class="btn" data-val="1">1</button></td>
      <td><button class="btn" data-val="2" data-active="1">2</button></td>
    </tr>
    <tr data-cat="grimace"><td>Grimace</td>
      <td><button class="btn" data-val="0">0</button></td>
      <td><button class="btn" data-val="1">1</button></td>
      <td><button class="btn" data-val="2" data-active="1">2</button></td>
    </tr>
    <tr data-cat="activity"><td>Activity</td>
      <td><button class="btn" data-val="0">0</button></td>
      <td><button class="btn" data-val="1">1</button></td>
      <td><button class="btn" data-val="2" data-active="1">2</button></td>
    </tr>
    <tr data-cat="respiration"><td>Respiration</td>
      <td><button class="btn" data-val="0">0</button></td>
      <td><button class="btn" data-val="1">1</button></td>
      <td><button class="btn" data-val="2" data-active="1">2</button></td>
    </tr>
  </tbody>
  <tfoot>
    <tr class="score-row"><td>Total</td><td colspan="3" id="totalScore">10 / 10</td></tr>
  </tfoot>
</table>

<script>
/* === Elements === */
const baby=document.getElementById('baby');
const overlay=document.getElementById('overlay');
const slider=document.getElementById('slider');
const totalScore=document.getElementById('totalScore');

/* === APGAR logic === */
const apgar={appearance:2,pulse:2,grimace:2,activity:2,respiration:2};
function setScore(cat,val){
  apgar[cat]=Number(val);
  const row=document.querySelector(`tr[data-cat="${cat}"]`);
  row.querySelectorAll('.btn').forEach(b=>{
    b.dataset.active=(b.dataset.val===val)?'1':'0';
  });
  updateTotal();
}
function updateTotal(){
  const total=Object.values(apgar).reduce((a,b)=>a+b,0);
  totalScore.textContent=`${total} / 10`;
}
document.querySelectorAll('.apgar-table .btn').forEach(btn=>{
  btn.addEventListener('click',()=>setScore(btn.closest('tr').dataset.cat,btn.dataset.val));
});

/* === Audio pulse === */
let ctx,osc,gain;
function initAudio(){
  if(ctx)return;
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  osc=ctx.createOscillator();gain=ctx.createGain();
  osc.type='square';osc.connect(gain).connect(ctx.destination);
  gain.gain.value=0;osc.start();
}
window.addEventListener('click',initAudio,{once:true});

/* === Vitals & color === */
let heartRate=140,respRate=50,breathAmp=0.012,time=performance.now();
function updateVitals(v){
  // HR 140 → 40, RR 50 → 10 with cyanosis
  heartRate=140-(v*1.0);
  respRate =50-(v*0.4);
  breathAmp=0.012-(v*0.00006);
  if(v<33)setScore('appearance','2');
  else if(v<66)setScore('appearance','1');
  else setScore('appearance','0');
}
function updateBlue(v){
  updateVitals(v);
  // full-body fade, lighter blue overall
  const outer=`rgba(70,140,255,${0.65})`;
  const inner=`rgba(40,100,230,${0.75})`;
  const start=Math.max(0,88 - v*0.9);
  overlay.style.background=
    `radial-gradient(ellipse 90% 72% at 50% 38%, transparent ${start}%, ${outer} 80%, ${inner} 100%)`;
}
slider.addEventListener('input',e=>updateBlue(+e.target.value));
updateBlue(0);

/* === Animation: chest-only breathing + pulse === */
let pulseTimer=0;
function loop(now){
  const dt=(now-time)/1000;time=now;
  const freq=respRate/60;
  const s=1+breathAmp*Math.sin(now/1000*2*Math.PI*freq);
  baby.style.transform=`translateY(0px) scaleY(${s.toFixed(3)})`; // chest motion only

  if(ctx&&gain){
    const beatInt=60/heartRate;
    pulseTimer+=dt;
    if(pulseTimer>=beatInt){
      pulseTimer=0;
      gain.gain.setValueAtTime(0.15,ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.08);
      osc.frequency.setValueAtTime(150,ctx.currentTime);
    }
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
