[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify-functions-dist"

[[headers]]
  for = "/build-info.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/vitals/visual-patient.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/vitals/scenario-launcher.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Scenario code is deliberately revalidated on every navigation. The simulator
# is split across several cooperating files, so serving a stale definition or
# runtime beside a newer patient page can break only one scenario while the
# rest of the site still appears healthy.
[[headers]]
  for = "/vitals/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/vitals/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/vitals/scenario-learning-upgrade.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/vitals/horse-crush-bootstrap.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/vitals/scenario-launcher.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/vitals/scenario-learning-upgrade.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/vitals/horse-crush-scenario.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/vitals/mobile-simulator-upgrade.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "/vitals/assessment-workspace.html"
  to = "/vitals/visual-patient.html"
  status = 301

[[redirects]]
  from = "/styles/assessment-workspace.html"
  to = "/vitals/visual-patient.html"
  status = 301

[[redirects]]
  from = "/visual-patient.html"
  to = "/vitals/visual-patient.html"
  status = 301
  force = true

[[redirects]]
  from = "/visual-patient"
  to = "/vitals/visual-patient.html"
  status = 301
  force = true

[[redirects]]
  from = "/scenario-launcher.html"
  to = "/vitals/scenario-launcher.html"
  status = 301
  force = true

[[redirects]]
  from = "/scenario-launcher"
  to = "/vitals/scenario-launcher.html"
  status = 301
  force = true
