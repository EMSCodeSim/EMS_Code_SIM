<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
<title id="title">ABC primary assessment body map</title><desc id="desc">A patient silhouette with callouts showing airway at the mouth and neck, breathing at the chest, and circulation at the pulse, skin, and bleeding sites.</desc>
<defs><linearGradient id="person" x1="0" x2="1"><stop stop-color="#d7e7f4"/><stop offset="1" stop-color="#9fc3db"/></linearGradient></defs>
<rect width="1000" height="620" rx="30" fill="#f4f8fc"/>
<circle cx="500" cy="110" r="62" fill="url(#person)" stroke="#527c98" stroke-width="4"/><path d="M500 172v216M500 220l-125 120M500 220l125 120M500 388l-88 164M500 388l88 164" fill="none" stroke="url(#person)" stroke-width="65" stroke-linecap="round"/>
<circle cx="500" cy="128" r="17" fill="#0b78df"/><path d="M500 145v65" stroke="#0b78df" stroke-width="14" stroke-linecap="round"/><circle cx="500" cy="290" r="76" fill="none" stroke="#159b76" stroke-width="10" stroke-dasharray="16 10"/><path d="M470 245c-34 0-48 35-40 76 5 26 20 39 43 34 20-4 25-20 25-48v-45c-8-10-17-16-28-17zM530 245c34 0 48 35 40 76-5 26-20 39-43 34-20-4-25-20-25-48v-45c8-10 17-16 28-17z" fill="#61d9b6" opacity=".9"/><circle cx="575" cy="340" r="22" fill="#e43b4a"/><circle cx="375" cy="342" r="15" fill="#e43b4a"/><circle cx="412" cy="552" r="15" fill="#e43b4a"/>
<g font-family="Arial"><rect x="45" y="60" width="310" height="145" rx="18" fill="white" stroke="#8dcdf7" stroke-width="3"/><text x="72" y="100" font-size="33" font-weight="900" fill="#0b78df">A — AIRWAY</text><text x="72" y="137" font-size="20" fill="#324b5d">Can air move?</text><text x="72" y="168" font-size="20" fill="#324b5d">Listen for obstruction sounds.</text><path d="M355 135h105" stroke="#0b78df" stroke-width="5" stroke-linecap="round"/></g>
<g font-family="Arial"><rect x="645" y="195" width="310" height="155" rx="18" fill="white" stroke="#86dbc1" stroke-width="3"/><text x="672" y="237" font-size="33" font-weight="900" fill="#159b76">B — BREATHING</text><text x="672" y="274" font-size="20" fill="#324b5d">Rate, depth, effort, sounds.</text><text x="672" y="305" font-size="20" fill="#324b5d">Is ventilation adequate?</text><path d="M645 278h-77" stroke="#159b76" stroke-width="5" stroke-linecap="round"/></g>
<g font-family="Arial"><rect x="45" y="405" width="330" height="160" rx="18" fill="white" stroke="#f19ba4" stroke-width="3"/><text x="72" y="447" font-size="31" font-weight="900" fill="#d53140">C — CIRCULATION</text><text x="72" y="484" font-size="20" fill="#324b5d">Pulse, skin, perfusion.</text><text x="72" y="515" font-size="20" fill="#324b5d">Control major bleeding.</text><path d="M375 477h78" stroke="#d53140" stroke-width="5" stroke-linecap="round"/></g>
<text x="790" y="500" font-family="Arial" font-size="24" font-weight="800" fill="#425e73">Then reassess:</text><text x="790" y="538" font-family="Arial" font-size="21" fill="#425e73">Did the patient improve?</text>
</svg>
