<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
<title id="title">Six learning lanes of EMT education</title><desc id="desc">Diagram comparing lecture, skills lab, clinical, field, written testing, and practical testing.</desc>
<rect width="1200" height="580" rx="26" fill="#f7fbfe"/>
<text x="60" y="72" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#0b2239">Six common parts of EMT education</text>
<text x="60" y="110" font-family="Arial,sans-serif" font-size="19" fill="#4d6475">Learn each term before using it in a schedule or school scenario.</text>
<g font-family="Arial,sans-serif">
<g transform="translate(70 160)"><rect width="330" height="150" rx="18" fill="#fff" stroke="#d7e8f2"/><circle cx="50" cy="50" r="28" fill="#dceff9"/><text x="50" y="57" text-anchor="middle" font-size="20" font-weight="700" fill="#0b2239">1</text><text x="95" y="45" font-size="24" font-weight="700" fill="#0b2239">Classroom</text><text x="95" y="74" font-size="17" fill="#4d6475">Concepts, discussion, reading,</text><text x="95" y="98" font-size="17" fill="#4d6475">demonstration, and review</text></g>
<g transform="translate(435 160)"><rect width="330" height="150" rx="18" fill="#fff" stroke="#d7e8f2"/><circle cx="50" cy="50" r="28" fill="#ffe9d6"/><text x="50" y="57" text-anchor="middle" font-size="20" font-weight="700" fill="#0b2239">2</text><text x="95" y="45" font-size="24" font-weight="700" fill="#0b2239">Skills lab</text><text x="95" y="74" font-size="17" fill="#4d6475">Hands-on practice, checklists,</text><text x="95" y="98" font-size="17" fill="#4d6475">equipment, and feedback</text></g>
<g transform="translate(800 160)"><rect width="330" height="150" rx="18" fill="#fff" stroke="#d7e8f2"/><circle cx="50" cy="50" r="28" fill="#e6f3ef"/><text x="50" y="57" text-anchor="middle" font-size="20" font-weight="700" fill="#0b2239">3</text><text x="95" y="45" font-size="24" font-weight="700" fill="#0b2239">Clinical</text><text x="95" y="74" font-size="17" fill="#4d6475">Supervised learning in an</text><text x="95" y="98" font-size="17" fill="#4d6475">approved healthcare setting</text></g>
<g transform="translate(70 350)"><rect width="330" height="150" rx="18" fill="#fff" stroke="#d7e8f2"/><circle cx="50" cy="50" r="28" fill="#e8eef9"/><text x="50" y="57" text-anchor="middle" font-size="20" font-weight="700" fill="#0b2239">4</text><text x="95" y="45" font-size="24" font-weight="700" fill="#0b2239">Field</text><text x="95" y="74" font-size="17" fill="#4d6475">Supervised time with an EMS</text><text x="95" y="98" font-size="17" fill="#4d6475">crew under program rules</text></g>
<g transform="translate(435 350)"><rect width="330" height="150" rx="18" fill="#fff" stroke="#d7e8f2"/><circle cx="50" cy="50" r="28" fill="#f2e8fb"/><text x="50" y="57" text-anchor="middle" font-size="20" font-weight="700" fill="#0b2239">5</text><text x="95" y="45" font-size="24" font-weight="700" fill="#0b2239">Written test</text><text x="95" y="74" font-size="17" fill="#4d6475">Knowledge, application, and</text><text x="95" y="98" font-size="17" fill="#4d6475">decision-making questions</text></g>
<g transform="translate(800 350)"><rect width="330" height="150" rx="18" fill="#fff" stroke="#d7e8f2"/><circle cx="50" cy="50" r="28" fill="#f7f1df"/><text x="50" y="57" text-anchor="middle" font-size="20" font-weight="700" fill="#0b2239">6</text><text x="95" y="45" font-size="24" font-weight="700" fill="#0b2239">Practical test</text><text x="95" y="74" font-size="17" fill="#4d6475">Observed performance using</text><text x="95" y="98" font-size="17" fill="#4d6475">defined safety and skill criteria</text></g>
</g></svg>