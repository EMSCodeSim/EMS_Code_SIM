<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">EMS team roles illustration</title>
<desc id="desc">Infographic showing several roles in the EMS system arranged around the EMT.</desc>
<rect width="1200" height="520" rx="26" fill="#f7fbfe"/>
<text x="60" y="70" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#0b2239">Who is part of the EMS system?</text>
<text x="60" y="108" font-family="Arial, sans-serif" font-size="19" fill="#4d6475">A new EMT should understand the larger team, not only the patient compartment.</text>
<g font-family="Arial, sans-serif" text-anchor="middle">
  <g transform="translate(200 270)"><circle r="74" fill="#ffffff" stroke="#d7e8f2" stroke-width="4"/><text y="-8" font-size="24" font-weight="700" fill="#0b2239">Dispatcher</text><text y="22" font-size="16" fill="#4d6475">Receives the call and</text><text y="44" font-size="16" fill="#4d6475">sends the response</text></g>
  <g transform="translate(430 270)"><circle r="74" fill="#ffffff" stroke="#d7e8f2" stroke-width="4"/><text y="-8" font-size="24" font-weight="700" fill="#0b2239">Fire / first response</text><text y="22" font-size="16" fill="#4d6475">May reach the scene</text><text y="44" font-size="16" fill="#4d6475">before transport units</text></g>
  <g transform="translate(600 260)"><circle r="92" fill="#dceff9" stroke="#2f84b8" stroke-width="6"/><text y="-12" font-size="30" font-weight="700" fill="#0b2239">EMT</text><text y="20" font-size="18" fill="#0b2239">Assessment, care,</text><text y="44" font-size="18" fill="#0b2239">transport, handoff, charting</text></g>
  <g transform="translate(780 270)"><circle r="74" fill="#ffffff" stroke="#d7e8f2" stroke-width="4"/><text y="-8" font-size="24" font-weight="700" fill="#0b2239">Paramedic</text><text y="22" font-size="16" fill="#4d6475">Advanced field care</text><text y="44" font-size="16" fill="#4d6475">in many systems</text></g>
  <g transform="translate(1010 270)"><circle r="74" fill="#ffffff" stroke="#d7e8f2" stroke-width="4"/><text y="-8" font-size="24" font-weight="700" fill="#0b2239">Hospital team</text><text y="22" font-size="16" fill="#4d6475">Receives the patient</text><text y="44" font-size="16" fill="#4d6475">after transport</text></g>
</g>
<path d="M272 270 H506" stroke="#2f84b8" stroke-width="4" stroke-dasharray="10 10"/><path d="M692 270 H706" stroke="#2f84b8" stroke-width="4" stroke-dasharray="10 10"/><path d="M854 270 H936" stroke="#2f84b8" stroke-width="4" stroke-dasharray="10 10"/>
<rect x="330" y="410" width="540" height="70" rx="18" fill="#ffffff" stroke="#d7e8f2"/>
<text x="600" y="452" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0b2239" text-anchor="middle">Medical direction, educators, and quality-improvement staff support the system too.</text>
</svg>
