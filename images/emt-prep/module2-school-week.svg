<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Two-week EMT school schedule</title><desc id="desc">Illustrated calendar showing classroom, skills lab, study, testing, clinical preparation, work, and sleep.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef8fd"/><stop offset="1" stop-color="#f9fbfc"/></linearGradient></defs>
<rect width="1200" height="700" rx="28" fill="url(#bg)"/>
<text x="60" y="78" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#0b2239">What EMT school is really like</text>
<text x="60" y="118" font-family="Arial,sans-serif" font-size="20" fill="#4d6475">Several learning lanes and life responsibilities can overlap during the same week.</text>
<g font-family="Arial,sans-serif">
<rect x="60" y="160" width="1080" height="430" rx="22" fill="#fff" stroke="#d7e8f2"/>
<g fill="#0b2239" font-size="18" font-weight="700" text-anchor="middle">
<text x="165" y="205">Monday</text><text x="315" y="205">Tuesday</text><text x="465" y="205">Wednesday</text><text x="615" y="205">Thursday</text><text x="765" y="205">Friday</text><text x="915" y="205">Saturday</text><text x="1065" y="205">Sunday</text>
</g>
<g stroke="#d7e8f2"><path d="M240 175V565"/><path d="M390 175V565"/><path d="M540 175V565"/><path d="M690 175V565"/><path d="M840 175V565"/><path d="M990 175V565"/></g>
<g font-size="17" font-family="Arial,sans-serif" text-anchor="middle">
<rect x="95" y="235" width="140" height="72" rx="14" fill="#dceff9"/><text x="165" y="266" fill="#0b2239" font-weight="700">Lecture</text><text x="165" y="291" fill="#4d6475">6–10 PM</text>
<rect x="245" y="335" width="140" height="72" rx="14" fill="#edf6ee"/><text x="315" y="366" fill="#0b2239" font-weight="700">Reading</text><text x="315" y="391" fill="#4d6475">+ recall</text>
<rect x="395" y="235" width="140" height="72" rx="14" fill="#ffe9d6"/><text x="465" y="266" fill="#0b2239" font-weight="700">Skills lab</text><text x="465" y="291" fill="#4d6475">hands-on</text>
<rect x="545" y="335" width="140" height="72" rx="14" fill="#edf6ee"/><text x="615" y="366" fill="#0b2239" font-weight="700">Quiz review</text><text x="615" y="391" fill="#4d6475">short blocks</text>
<rect x="695" y="235" width="140" height="72" rx="14" fill="#f2e8fb"/><text x="765" y="266" fill="#0b2239" font-weight="700">Written quiz</text><text x="765" y="291" fill="#4d6475">course check</text>
<rect x="845" y="235" width="140" height="72" rx="14" fill="#e6f3ef"/><text x="915" y="266" fill="#0b2239" font-weight="700">Clinical</text><text x="915" y="291" fill="#4d6475">6:30 AM</text>
<rect x="995" y="335" width="140" height="72" rx="14" fill="#f7f1df"/><text x="1065" y="366" fill="#0b2239" font-weight="700">Recover</text><text x="1065" y="391" fill="#4d6475">and plan</text>
</g>
<rect x="95" y="450" width="1040" height="80" rx="16" fill="#f8fafc" stroke="#d7e8f2"/>
<text x="125" y="484" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#0b2239">Outside the calendar:</text>
<text x="125" y="515" font-family="Arial,sans-serif" font-size="19" fill="#4d6475">work • commute • meals • family • uniforms • paperwork • sleep • backup transportation</text>
</g>
<rect x="60" y="615" width="1080" height="45" rx="14" fill="#0b2239"/>
<text x="600" y="645" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#fff">The workload simulator below helps you plan the whole week—not only class hours.</text>
</svg>