<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
<title id="title">Medical word parts</title><desc id="desc">Diagram showing prefix, root, and suffix with examples.</desc>
<rect width="900" height="560" rx="26" fill="#f8fbfd"/>
<text x="55" y="68" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0b2239">Break the word into parts</text>
<text x="55" y="106" font-family="Arial,sans-serif" font-size="19" fill="#4d6475">Define each part, then rebuild the complete meaning.</text>
<g font-family="Arial,sans-serif">
  <rect x="60" y="165" width="220" height="160" rx="18" fill="#dceff9" stroke="#8fc4df"/>
  <text x="170" y="210" text-anchor="middle" font-size="25" font-weight="700" fill="#0b2239">Prefix</text>
  <text x="170" y="250" text-anchor="middle" font-size="32" font-weight="700" fill="#2f84b8">tachy-</text>
  <text x="170" y="290" text-anchor="middle" font-size="19" fill="#4d6475">fast</text>
  <text x="315" y="255" font-size="34" font-weight="700" fill="#2f84b8">+</text>
  <rect x="355" y="165" width="220" height="160" rx="18" fill="#fff" stroke="#cfe3ef"/>
  <text x="465" y="210" text-anchor="middle" font-size="25" font-weight="700" fill="#0b2239">Root</text>
  <text x="465" y="250" text-anchor="middle" font-size="32" font-weight="700" fill="#2f84b8">cardi/o</text>
  <text x="465" y="290" text-anchor="middle" font-size="19" fill="#4d6475">heart</text>
  <text x="610" y="255" font-size="34" font-weight="700" fill="#2f84b8">+</text>
  <rect x="650" y="165" width="190" height="160" rx="18" fill="#eaf5ec" stroke="#a7d6b7"/>
  <text x="745" y="210" text-anchor="middle" font-size="25" font-weight="700" fill="#0b2239">Suffix</text>
  <text x="745" y="250" text-anchor="middle" font-size="32" font-weight="700" fill="#2f84b8">-ia</text>
  <text x="745" y="290" text-anchor="middle" font-size="19" fill="#4d6475">condition</text>
  <path d="M170 365 C260 430 630 430 745 365" fill="none" stroke="#2f84b8" stroke-width="5"/>
  <rect x="210" y="420" width="480" height="82" rx="18" fill="#fff" stroke="#cfe3ef"/>
  <text x="450" y="455" text-anchor="middle" font-size="27" font-weight="700" fill="#0b2239">tachycardia</text>
  <text x="450" y="485" text-anchor="middle" font-size="19" fill="#4d6475">an abnormally fast heart rate</text>
</g>
</svg>
