<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Medical terminology learning laboratory</title>
<desc id="desc">Overview showing word parts, anatomical directions, abbreviations, and plain-language translation.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef8fd"/><stop offset="1" stop-color="#f9fbfc"/></linearGradient></defs>
<rect width="1200" height="700" rx="28" fill="url(#bg)"/>
<text x="70" y="82" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#0b2239">Medical Terminology Laboratory</text>
<text x="70" y="123" font-family="Arial,sans-serif" font-size="20" fill="#4d6475">Learn the term first. Practice it next. Apply it only after it makes sense.</text>
<g font-family="Arial,sans-serif">
  <rect x="70" y="180" width="510" height="190" rx="22" fill="#fff" stroke="#cfe3ef"/>
  <text x="105" y="225" font-size="24" font-weight="700" fill="#0b2239">Build the word</text>
  <rect x="105" y="260" width="130" height="62" rx="12" fill="#dceff9"/><text x="170" y="299" text-anchor="middle" font-size="22" font-weight="700" fill="#0b2239">tachy-</text>
  <text x="255" y="299" font-size="28" font-weight="700" fill="#2f84b8">+</text>
  <rect x="300" y="260" width="150" height="62" rx="12" fill="#eaf5ec"/><text x="375" y="299" text-anchor="middle" font-size="22" font-weight="700" fill="#0b2239">-cardia</text>
  <text x="470" y="299" font-size="28" font-weight="700" fill="#2f84b8">=</text>
  <text x="105" y="350" font-size="20" fill="#4d6475">fast + heart-rate condition → fast heart rate</text>

  <rect x="620" y="180" width="510" height="190" rx="22" fill="#fff" stroke="#cfe3ef"/>
  <text x="655" y="225" font-size="24" font-weight="700" fill="#0b2239">Locate the finding</text>
  <line x1="895" y1="270" x2="895" y2="335" stroke="#2f84b8" stroke-width="8" stroke-linecap="round"/>
  <circle cx="895" cy="240" r="24" fill="#f2c8aa"/>
  <line x1="895" y1="295" x2="855" y2="325" stroke="#2f84b8" stroke-width="8" stroke-linecap="round"/>
  <line x1="895" y1="295" x2="935" y2="325" stroke="#2f84b8" stroke-width="8" stroke-linecap="round"/>
  <line x1="895" y1="335" x2="865" y2="360" stroke="#2f84b8" stroke-width="8" stroke-linecap="round"/>
  <line x1="895" y1="335" x2="925" y2="360" stroke="#2f84b8" stroke-width="8" stroke-linecap="round"/>
  <text x="660" y="295" font-size="19" fill="#4d6475">anterior</text><path d="M770 285 H835" stroke="#7aaad1" stroke-width="4" marker-end="url(#none)"/>
  <text x="965" y="295" font-size="19" fill="#4d6475">posterior</text>
  
  <rect x="70" y="410" width="510" height="190" rx="22" fill="#fff" stroke="#cfe3ef"/>
  <text x="105" y="455" font-size="24" font-weight="700" fill="#0b2239">Recognize safe short forms</text>
  <g font-size="22" font-weight="700" fill="#0b2239"><text x="115" y="505">BP</text><text x="230" y="505">HR</text><text x="345" y="505">RR</text><text x="465" y="505">SpO₂</text></g>
  <g font-size="15" fill="#4d6475"><text x="105" y="538">blood pressure</text><text x="220" y="538">heart rate</text><text x="325" y="538">respirations</text><text x="445" y="538">oxygen saturation</text></g>
  <text x="105" y="576" font-size="18" fill="#4d6475">Use only abbreviations accepted by the school or service.</text>

  <rect x="620" y="410" width="510" height="190" rx="22" fill="#fff" stroke="#cfe3ef"/>
  <text x="655" y="455" font-size="24" font-weight="700" fill="#0b2239">Translate clearly</text>
  <rect x="655" y="490" width="185" height="54" rx="12" fill="#dceff9"/><text x="747" y="523" text-anchor="middle" font-size="21" font-weight="700" fill="#0b2239">dyspnea</text>
  <text x="858" y="523" font-size="28" font-weight="700" fill="#2f84b8">→</text>
  <rect x="905" y="490" width="190" height="54" rx="12" fill="#eaf5ec"/><text x="1000" y="514" text-anchor="middle" font-size="17" font-weight="700" fill="#0b2239">trouble</text><text x="1000" y="534" text-anchor="middle" font-size="17" font-weight="700" fill="#0b2239">breathing</text>
  <text x="655" y="576" font-size="18" fill="#4d6475">Precise for clinicians. Clear and respectful for patients.</text>
</g>
</svg>
