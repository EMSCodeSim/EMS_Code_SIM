<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
<title id="title">Handoff illustration</title>
<desc id="desc">Illustration showing an EMS crew transferring patient care to hospital staff.</desc>
<rect width="1200" height="540" rx="26" fill="#f8fbfd"/>
<text x="60" y="70" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#0b2239">Transfer of care matters</text>
<text x="60" y="106" font-family="Arial, sans-serif" font-size="19" fill="#4d6475">A short, organized handoff helps the next clinician understand the patient quickly.</text>
<rect x="120" y="200" width="260" height="120" rx="20" fill="#ffffff" stroke="#d7e8f2"/>
<circle cx="200" cy="180" r="34" fill="#f6d1b3"/><rect x="165" y="212" width="70" height="90" rx="20" fill="#d85f5f"/>
<circle cx="300" cy="180" r="34" fill="#f6d1b3"/><rect x="265" y="212" width="70" height="90" rx="20" fill="#7aaad1"/>
<text x="160" y="350" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0b2239">EMS crew</text>
<path d="M390 250 C480 250, 520 250, 600 250" fill="none" stroke="#2f84b8" stroke-width="8" stroke-dasharray="12 12"/>
<rect x="600" y="180" width="180" height="120" rx="18" fill="#e8f3fa" stroke="#2f84b8" stroke-width="4"/>
<text x="690" y="226" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0b2239" text-anchor="middle">Brief report</text>
<text x="690" y="258" font-family="Arial, sans-serif" font-size="17" fill="#4d6475" text-anchor="middle">Concern</text>
<text x="690" y="281" font-family="Arial, sans-serif" font-size="17" fill="#4d6475" text-anchor="middle">Findings</text>
<text x="690" y="304" font-family="Arial, sans-serif" font-size="17" fill="#4d6475" text-anchor="middle">Care and response</text>
<path d="M780 250 C850 250, 920 250, 980 250" fill="none" stroke="#2f84b8" stroke-width="8" stroke-dasharray="12 12"/>
<rect x="960" y="200" width="120" height="120" rx="18" fill="#ffffff" stroke="#d7e8f2"/>
<circle cx="1020" cy="180" r="34" fill="#f6d1b3"/><rect x="985" y="212" width="70" height="90" rx="20" fill="#7bc69a"/>
<text x="1000" y="350" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0b2239">Hospital staff</text>
<rect x="120" y="400" width="960" height="80" rx="18" fill="#ffffff" stroke="#d7e8f2"/>
<text x="160" y="447" font-family="Arial, sans-serif" font-size="22" fill="#0b2239">A good handoff is organized and objective. It should tell the receiving team what matters most first.</text>
</svg>
