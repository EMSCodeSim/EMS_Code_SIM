name: EMS Scenario Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ems-scenario-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build and validate production site
        run: npm run build
      - name: Install Chromium for interaction tests
        run: npx playwright install --with-deps chromium
      - name: Run partner queue reliability test
        run: npx playwright test test/interaction/scenario-runtime-reliability.spec.js --project=desktop-chromium --grep "partner skills run one at a time" --max-failures=1
