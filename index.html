<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>EMS Code Sim — Train Smart</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="EMS & Fire training simulators: vitals, respiratory, neuro, burns, and more." />
  <link rel="icon" href="/favicon.ico" />

  <style>
    :root{
      --bg:#0b0f14; --card:#121823; --muted:#8ea0b3; --text:#eaf2ff;
      --blue:#0a84ff; --red:#ff3b30; --shadow:0 10px 30px rgba(0,0,0,.35);
      --ring:rgba(10,132,255,.45); --radius:18px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
      font-family: system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif}
    a{color:inherit;text-decoration:none}
    img{max-width:100%;height:auto}
    button,input,select,textarea{font-size:16px} /* prevent iOS zoom */
    html,body{-webkit-text-size-adjust:100%}

    /* Top bar */
    .topbar{
      position:sticky; top:0; z-index:20;
      backdrop-filter:saturate(120%) blur(6px);
      background: rgba(10,12,18,.7);
      border-bottom:1px solid rgba(255,255,255,.07);
    }
    .topnav{
      max-width:1100px; margin:0 auto; padding:10px 20px;
      display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    }
    .brandmini{display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:.4px;}
    .brandmini img{width:28px; height:28px; border-radius:8px; box-shadow:var(--shadow); background:#fff}
    .menu{display:flex; gap:8px; flex:1; flex-wrap:wrap}
    .menu button{
      background:transparent; color:var(--text); border:1px solid rgba(255,255,255,.12);
      padding:8px 12px; border-radius:10px; cursor:pointer; touch-action:manipulation;
    }
    .menu button:hover{border-color:rgba(255,255,255,.28)}
    .menu button:active{transform:translateY(1px)}

    /* Hero header */
    header.hero{
      position:relative; overflow:hidden;
      background:
        radial-gradient(1200px 600px at 15% -25%, rgba(10,132,255,.35), transparent 60%),
        radial-gradient(1200px 600px at 100% 0%, rgba(255,59,48,.28), transparent 60%),
        linear-gradient(160deg, #0d1b2a, #0b0f14 60%);
      padding: clamp(28px, 6vw, 56px) 20px;
      border-bottom:1px solid rgba(255,255,255,.06);
    }
    .hero-inner{max-width:1100px; margin:0 auto; display:flex; gap:18px; align-items:center}
    .hero-logo{width:96px; height:96px; border-radius:20px; overflow:hidden; flex:0 0 96px; box-shadow:var(--shadow); background:#fff; display:grid; place-items:center}
    .hero-logo img{width:100%; height:100%; object-fit:contain}
    .hero-text h1{margin:0 0 8px; font-size:clamp(22px, 3.6vw, 36px)}
    .hero-text p{margin:6px 0 0; font-size:clamp(14px, 2vw, 18px); color:#e9f1ff}

    /* Sections & cards */
    main{max-width:1100px; margin:24px auto 80px; padding:0 20px}
    section{margin-top:28px}
    section h2{margin:0 0 14px; color:#d7e6ff; font-size:clamp(18px, 2.6vw, 22px); display:flex; align-items:center; gap:10px}
    .grid{display:grid; gap:14px; grid-template-columns:repeat(auto-fit, minmax(220px,1fr))}
    .card{
      position:relative; border-radius:var(--radius); background:var(--card);
      border:1px solid rgba(255,255,255,.06); box-shadow:var(--shadow);
      overflow:hidden; transition:transform .15s ease, border-color .2s ease, box-shadow .2s ease;
    }
    .card:hover{ transform:translateY(-2px); border-color:rgba(10,132,255,.35); box-shadow:0 14px 38px rgba(0,0,0,.5) }
    .card button{
      appearance:none; background:none; border:0; color:inherit; width:100%;
      text-align:left; cursor:pointer; display:flex; gap:14px; align-items:center; padding:16px;
    }
    .icon{
      flex:0 0 46px; width:46px; height:46px; border-radius:12px; display:grid; place-items:center;
      background: rgba(10,132,255,.12); border:1px solid rgba(10,132,255,.35);
    }
    .icon.fire{ background: rgba(255,59,48,.12); border-color: rgba(255,59,48,.35)}
    .card h3{margin:0; font-size:16px}
    .card p{margin:6px 0 0; color:var(--muted); font-size:13px}
    .pill{position:absolute; top:10px; right:10px; font-size:11px; padding:4px 8px; border-radius:999px;
      background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.18); color:#cfe1ff}

    footer{
      max-width:1100px; margin:40px auto; padding:18px 20px; color:var(--muted); font-size:13px;
      border-top:1px solid rgba(255,255,255,.06); display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap;
    }

    @media (prefers-color-scheme: light){
      :root{--bg:#f6f9ff; --card:#ffffff; --text:#0e1726; --muted:#53657a}
      .topbar{background:rgba(255,255,255,.85)}
      .pill{background:rgba(0,0,0,.04); border-color:rgba(0,0,0,.08); color:#1a3555}
    }
  </style>

  <!-- GA4 (G-5QLPK4025C) + click tracking -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-5QLPK4025C"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-5QLPK4025C', { send_page_view: true });

    (function(){
      var GA_DEBUG = /(^|[?&])ga_debug=1(&|$)/.test(location.search);
      function ev(name, params){ try{ gtag('event', name, Object.assign(GA_DEBUG?{debug_mode:true}:{}, params||{})); }catch(e){} }
      document.addEventListener('click', function(e){
        var el = e.target.closest('[data-ga-event]'); if(!el) return;
        var name = el.getAttribute('data-ga-event') || ''; if(!name) return;
        var params = {}; var raw = el.getAttribute('data-ga-params'); if(raw){ try{ params = JSON.parse(raw);}catch(_){} }
        ev(name, params);
      });
      window.gaTrack = { nav:(label)=>ev('navigation',{label}) };
    })();
  </script>
</head>
<body>

  <!-- Sticky top navigation -->
  <div class="topbar">
    <div class="topnav">
      <div class="brandmini">
        <img src="/assets/ems-logo.webp" alt="EMS Code Sim logo" onerror="this.src='/assets/ems-logo.png'">
        <span>EMS Code Sim</span>
      </div>
      <div class="menu" role="navigation" aria-label="Primary">
        <button data-ga-event="navigation" data-ga-params='{"label":"Home"}' onclick="window.scrollTo({top:0,behavior:'smooth'})">Home</button>
        <button data-ga-event="navigation" data-ga-params='{"label":"Vitals"}' onclick="document.getElementById('vitals').scrollIntoView({behavior:'smooth'})">Vitals</button>
        <button data-ga-event="navigation" data-ga-params='{"label":"Respiratory"}' onclick="document.getElementById('resp').scrollIntoView({behavior:'smooth'})">Respiratory</button>
        <button data-ga-event="navigation" data-ga-params='{"label":"Neurological"}' onclick="document.getElementById('neuro').scrollIntoView({behavior:'smooth'})">Neurological</button>
        <button data-ga-event="navigation" data-ga-params='{"label":"Assessment"}' onclick="document.getElementById('assessment').scrollIntoView({behavior:'smooth'})">Assessment</button>
        <button data-ga-event="navigation" data-ga-params='{"label":"Skin & Meds"}' onclick="document.getElementById('skinmeds').scrollIntoView({behavior:'smooth'})">Skin & Meds</button>
        <button data-ga-event="navigation" data-ga-params='{"label":"Burns"}' onclick="document.getElementById('burns').scrollIntoView({behavior:'smooth'})">Burns</button>
      </div>
    </div>
  </div>

  <!-- Hero -->
  <header class="hero">
    <div class="hero-inner">
      <div class="hero-logo"><img src="/assets/ems-logo.webp" alt="EMS Code Sim" onerror="this.src='/assets/ems-logo.png'"></div>
      <div class="hero-text">
        <h1>EMS CODE SIM</h1>
        <p>You’ve mastered the book—now master the skills.</p>
      </div>
    </div>
  </header>

  <!-- Content -->
  <main>

    <!-- VITALS -->
    <section id="vitals" aria-labelledby="vitals-h">
      <h2 id="vitals-h">Vitals</h2>
      <div class="grid">
        <!-- Blood Pressure -->
        <article class="card"><span class="pill">EMS</span>
          <button data-ga-event="open_sim" data-ga-params='{"sim":"Blood Pressure"}'
                  onclick="location.href='/vitals/bp'" aria-label="Open Blood Pressure">
            <span class="icon">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M4 7h8a3 3 0 0 1 0 6H9v2h3a5 5 0 0 0 0-10H4v2zM3 9h4v6H3V9zm12 7h2a2 2 0 1 0 0-4h-2v4z"/></svg>
            </span>
            <div><h3>Blood Pressure</h3><p>Korotkoff sounds, realistic cuff flow.</p></div>
          </button>
        </article>

        <!-- Pulse Trainer -->
        <article class="card"><span class="pill">EMS</span>
          <button data-ga-event="open_sim" data-ga-params='{"sim":"Pulse Trainer"}'
                  onclick="location.href='/vitals/pulse'" aria-label="Open Pulse Trainer">
            <span class="icon">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M3 12h3l2-5 3 10 2-6h6v2h-4l-3 8-3-10-1 3H3v-2z"/></svg>
            </span>
            <div><h3>Pulse Trainer</h3><p>Randomized rates, tap/assess practice.</p></div>
          </button>
        </article>

        <!-- Pulse Oximeter -->
        <article class="card"><span class="pill">EMS</span>
          <button data-ga-event="open_sim" data-ga-params='{"sim":"Pulse Oximeter"}'
                  onclick="location.href='/vitals/pulse-ox'" aria-label="Open Pulse Oximeter">
            <span class="icon">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M5 6h14a2 2 0 0 1 2 2v6a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V8a2 2 0 0 1 2-2zm2 3h3v6H7V9zm7 0h3v3h-3V9z"/></svg>
            </span>
            <div><h3>Pulse Oximeter</h3><p>SpO₂/HR display with artifacts.</p></div>
          </button>
        </article>

        <!-- Blood Glucose -->
        <article class="card"><span class="pill">EMS</span>
          <button data-ga-event="open_sim" data-ga-params='{"sim":"Blood Glucose"}'
                  onclick="location.href='/vitals/bgl'" aria-label="Open Blood Glucose">
            <span class="icon">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M7 3h10v6H7V3zm-2 8h14v10H5V11zm9-6v2H10V5h4z"/></svg>
            </span>
            <div><h3>Blood Glucose</h3><p>Glucometer workflow & readings.</p></div>
          </button>
        </article>
      </div>
    </section>

    <!-- RESPIRATORY -->
    <section id="resp" aria-labelledby="resp-h">
      <h2 id="resp-h">Respiratory</h2>
      <div class="grid">
        <!-- Breath Sounds -->
        <article class="card"><span class="pill">EMS</span>
          <button data-ga-event="open_sim" data-ga-params='{"sim":"Breath Sounds"}'
                  onclick="location.href='/vitals/breath-sound-simulator'" aria-label="Open Breath Sound Simulator">
            <span class="icon">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M11 2v8L7 7C6 6 5 8 5 10v8H3v-8c0-4 2-7 5-7l3 2V2h2v3l3-2c3 0 5 3 5 7v8h-2v-8c0-2-1-4-2-3l-4 3V2h-2z"/></svg>
            </span>
            <div><h3>Breath Sound Simulator</h3><p>Hotspots with wheezes, rales, stridor.</p></div>
          </button>
        </article>

        <!-- Capnography -->
        <article class="card"><span class="pill">EMS</span>
          <button data-ga-event="open_sim" data-ga-params='{"sim":"Capnography"}'
                  onclick="location.href='/vitals/capno'" aria-label="Open Capnography">
            <span class="icon">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M3 6h18v2H3V6zm0 10h5l2-6 2 6 2-4h7v2h-5l-1 2h-4l-2-6-1 4H3v-2z"/></svg>
            </span>
            <div><h3>Capnography (ETCO₂)</h3><p>Waveforms: normal, asthma, CPR, hypovent.</p></div>
          </button>
        </article>
      </div>
    </section>

    <!-- NEURO -->
    <section id="neuro" aria-labelledby="neuro-h">
      <h2 id="neuro-h">Neurological</h2>
      <div class="grid">
        <!-- GCS -->
        <article class="card"><span class="pill">EMS</span>
          <button data-ga-event="open_sim" data-ga-params='{"sim":"GCS Trainer"}'
                  onclick="location.href='/vitals/gcs'" aria-label="Open GCS Trainer">
            <span class="icon">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a4 4 0 014 4v2h2v6h-2v4H8v-4H6V8h2V6a4 4 0 014-4z"/></svg>
            </span>
            <div><h3>GCS Trainer</h3><p>Eyes • Verbal • Motor with scoring.</p></div>
          </button>
        </article>

        <!-- AAOx4 -->
        <article class="card"><span class="pill">EMS</span>
          <button data-ga-event="open_sim" data-ga-params='{"sim":"AAOx4"}'
                  onclick="location.href='/vitals/aao'" aria-label="Open AAOx4">
            <span class="icon">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3a5 5 0 110 10A5 5 0 0112 3zm-6 16a6 6 0 0112 0v2H6v-2z"/></svg>
            </span>
            <div><h3>AAOx4 (LOC)</h3><p>Person • Place • Time • Event checks.</p></div>
          </button>
        </article>

        <!-- PERL -->
        <article class="card"><span class="pill">EMS</span>
          <button data-ga-event="open_sim" data-ga-params='{"sim":"PERL Pupils"}'
                  onclick="location.href='/vitals/pupil'" aria-label="Open PERL Pupils">
            <span class="icon">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4a8 8 0 100 16 8 8 0 000-16zm0 3a5 5 0 110 10A5 5 0 0112 7z"/></svg>
            </span>
            <div><h3>PERL (Pupils)</h3><p>Equal, round, reactive to light.</p></div>
          </button>
        </article>
      </div>
    </section>

    <!-- ASSESSMENT -->
    <section id="assessment" aria-labelledby="assessment-h">
      <h2 id="assessment-h">Assessment</h2>
      <div class="grid">
        <!-- Stroke -->
        <article class="card"><span class="pill">EMS</span>
          <button data-ga-event="open_sim" data-ga-params='{"sim":"Stroke Assessment"}'
                  onclick="location.href='/vitals/stroke'" aria-label="Open Stroke Assessment">
            <span class="icon">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M8 6a4 4 0 0 1 4-4 4 4 0 0 1 4 4h1a3 3 0 1 1 0 6h-1v2a3 3 0 1 1-6 0V9H8a3 3 0 1 1 0-6z"/></svg>
            </span>
            <div><h3>Stroke Assessment (BE-FAST)</h3><p>Face droop, arm drift, gaze & speech.</p></div>
          </button>
        </article>
      </div>
    </section>

    <!-- SKIN & BURNS -->
    <section id="skinmeds" aria-labelledby="skinmeds-h">
      <h2 id="skinmeds-h">Skin & Burns</h2>
      <div class="grid">
        <!-- Skin Signs -->
        <article class="card"><span class="pill">EMS</span>
          <button data-ga-event="open_sim" data-ga-params='{"sim":"Skin Signs"}'
                  onclick="location.href='/vitals/skin'" aria-label="Open Skin Signs">
            <span class="icon">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a3 3 0 110 6 3 3 0 010-6zM9 9h6l1 6-2 7h-4l-2-7 1-6z"/></svg>
            </span>
            <div><h3>Skin Signs</h3><p>Color, temperature, moisture.</p></div>
          </button>
        </article>

        <!-- Rule of Nines -->
        <article class="card"><span class="pill">EMS</span>
          <button data-ga-event="open_sim" data-ga-params='{"sim":"Rule of Nines"}'
                  onclick="location.href='/vitals/nines'" aria-label="Open Rule of Nines">
            <span class="icon fire">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2s4 4 4 8-2 6-4 8-4-3-4-6 2-6 4-10z"/></svg>
            </span>
            <div><h3>Rule of Nines</h3><p>Front/back regions with percent calculator.</p></div>
          </button>
        </article>
      </div>
    </section>

  </main>

  <footer>
    <div>© <span id="year"></span> EMS Code Sim</div>
    <div>Train smart • GA tracking enabled</div>
  </footer>

  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
