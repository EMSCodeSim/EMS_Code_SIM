<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EMS Simulator Index</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b1f2a;
      --panel: #0f2a39;
      --card: #123548;
      --ink: #eaf3f7;
      --muted: #94b7c6;
      --accent: #21c4d7;
      --accent-2: #2a9fb0;
      --ring: #39d1e1;
      --shadow: 0 10px 24px rgba(0,0,0,.25);
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif}
    header{padding:1.1rem 1.2rem;background:linear-gradient(90deg,#0f2a39,#102f40);position:sticky;top:0;z-index:5;border-bottom:1px solid rgba(255,255,255,.06)}
    h1{margin:0;font-size:1.1rem;letter-spacing:.5px}
    .wrap{max-width:1200px;margin:0 auto;padding:1rem;display:grid;gap:1rem}
    .toolbar{background:var(--panel);border-radius:14px;padding:.9rem;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow)}
    .search{flex:1;min-width:220px;display:flex;gap:.5rem;align-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:.55rem .75rem}
    .search input{flex:1;background:transparent;border:none;color:var(--ink);font-size:16px;outline:none}
    .pill{border:none;background:#1a3f53;color:var(--ink);padding:.5rem .7rem;border-radius:999px;cursor:pointer;font-weight:600}
    .pill.active{background:var(--accent);color:#02222a}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
    section.cat{background:var(--panel);border-radius:16px;padding:1rem;box-shadow:var(--shadow)}
    section.cat h2{margin:.2rem 0 .8rem;font-size:1rem;color:var(--accent)}
    .card{background:var(--card);border-radius:14px;padding:.9rem;display:flex;flex-direction:column;gap:.45rem;border:1px solid rgba(255,255,255,.06)}
    .card h3{margin:0;font-size:1rem;line-height:1.2}
    .meta{font-size:.8rem;color:var(--muted)}
    .go{margin-top:.4rem;display:inline-block;background:var(--accent);color:#02222a;border:none;border-radius:10px;padding:.5rem .7rem;text-decoration:none;font-weight:700;text-align:center}
    .go:hover{background:var(--ring)}
    footer{color:var(--muted);text-align:center;padding:1.2rem 1rem}
    .hide{display:none}
  </style>
</head>
<body>
  <header>
    <h1>EMS Simulators Index</h1>
  </header>

  <div class="wrap">
    <div class="toolbar">
      <div class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M21 21l-4.35-4.35M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input id="q" placeholder="Search simulators, e.g., vitals, airway, peds..." />
      </div>
      <div class="filters">
        <button class="pill" data-cat="Vitals">Vitals</button>
        <button class="pill" data-cat="Assessment">Assessment</button>
        <button class="pill" data-cat="Airway/Breathing">Airway/Breathing</button>
        <button class="pill" data-cat="Circulation/Fluids">Circulation/Fluids</button>
        <button class="pill" data-cat="Pharmacology">Pharmacology</button>
        <button class="pill" data-cat="Pediatrics/OB">Pediatrics/OB</button>
        <button class="pill" data-cat="Operations">Operations</button>
        <button class="pill" data-cat="Other">Other</button>
        <button class="pill active" data-cat="All">All</button>
      </div>
    </div>

    <!-- Example category section, repeat for each category -->
    <section class="cat" data-section="Vitals">
      <h2>Vitals</h2>
      <div class="grid">
        <article class="card" data-title="Blood Pressure Simulator" data-cat="Vitals">
          <h3>Blood Pressure Simulator</h3>
          <div class="meta">vitals/blood-pressure.html</div>
          <a class="go" href="vitals/blood-pressure.html">Open</a>
        </article>
        <!-- Add more Vitals simulators here -->
      </div>
    </section>

    <!-- Repeat the above section block for Assessment, Airway/Breathing, etc. -->

  </div>

  <footer>Generated index — edit categories/labels as needed.</footer>

  <script>
  const sections = Array.from(document.querySelectorAll('section.cat'));
  const pills = Array.from(document.querySelectorAll('.pill'));
  const q = document.getElementById('q');

  function applyFilters() {
    const active = pills.find(p=>p.classList.contains('active'));
    const cat = active ? active.dataset.cat : 'All';
    const term = q.value.trim().toLowerCase();
    sections.forEach(sec => {
      const inCat = (cat==='All') || (sec.dataset.section===cat);
      let visibleInSection = 0;
      sec.querySelectorAll('.card').forEach(card=>{
        const text = card.innerText.toLowerCase();
        const matchTerm = term==='' ? true : text.includes(term);
        const matchCat = (cat==='All') || (card.dataset.cat===cat);
        const show = matchTerm && matchCat;
        card.classList.toggle('hide', !show);
        if (show) visibleInSection++;
      });
      if (cat!=='All') {
        sec.classList.toggle('hide', sec.dataset.section!==cat);
      } else {
        sec.classList.toggle('hide', visibleInSection===0);
      }
    });
  }

  pills.forEach(p=>p.addEventListener('click', e=>{
    pills.forEach(x=>x.classList.remove('active'));
    p.classList.add('active');
    applyFilters();
  }));
  q.addEventListener('input', applyFilters);
  applyFilters();
  </script>
</body>
</html>
