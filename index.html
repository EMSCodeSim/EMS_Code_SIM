<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>APGAR Simulator | EMSCodeSim</title>
<link href="https://emscodesim.com/APGAR/" rel="canonical"/>
<meta content="Practice newborn APGAR scoring with an interactive EMS and neonatal assessment simulator." name="description"/>
<style>
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
    background:#f6f8fa;margin:0;padding:10px;
    display:flex;flex-direction:column;align-items:center;gap:10px;
  }
  h1{text-align:center;font-size:18px;margin:4px 0 8px;}
  .stage{
    position:relative;width:100%;max-width:420px;background:#fff;
    border-radius:12px;border:1px solid #ddd;overflow:hidden;
  }
  #baby{width:100%;height:auto;display:block;transform-origin:center 35%;}
  .overlay{
    position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;
    -webkit-mask-image:url('baby2.png');mask-image:url('baby2.png');
    -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
    -webkit-mask-size:100% 100%;mask-size:100% 100%;
  }
  #overlayPeripheral,#overlayCore{transition:opacity .25s linear, background .25s linear;}
  #overlayFace{
    transition:opacity .12s ease;opacity:0;
    background:radial-gradient(32% 16% at 50% 18%, rgba(255,100,100,.6) 0%, rgba(255,120,120,.35) 55%, transparent 75%);
  }
  #overlayBlink{
    transition:opacity .06s linear, clip-path .06s linear;
    opacity:0;
    background:radial-gradient(80% 8% at 50% 22%, rgba(30,30,30,.6) 0%, rgba(20,20,20,.45) 60%, transparent 85%);
    clip-path:inset(0 0 98% 0 round 20px);
  }
  .controls{
    width:100%;max-width:420px;background:#fff;border:1px solid #ddd;
    border-radius:12px;padding:10px;
  }
  input[type=range]{width:100%;accent-color:#2563eb;}
  .info{text-align:center;font-size:13px;color:#555;}
  table{width:100%;border-collapse:collapse;margin-top:10px;}
  th,td{border:1px solid #e4e7ec;padding:6px;text-align:center;font-size:14px;}
  th:first-child{text-align:left;}
  .btn{
    padding:6px 8px;margin:2px;border-radius:8px;border:1px solid #ccc;
    background:#fff;font-size:14px;cursor:pointer;
  }
  .btn[data-active="1"]{border-color:#2563eb;color:#2563eb;font-weight:600;}
  .score-row{background:#f1f5fb;font-weight:bold;}
  .modal{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);
    align-items:center;justify-content:center;z-index:100;
  }
  .panel{
    background:#fff;border-radius:12px;padding:16px;width:90%;max-width:400px;
  }
</style>
<link href="/styles/responsive.css" rel="stylesheet"/>
<link href="/styles/site-enhancements.css" rel="stylesheet"/>
<script defer="" src="/privacy-controls.js"></script>
<script defer="" src="/scripts/engagement-loop.js"></script>
<meta content="website" property="og:type"/><meta content="EMSCodeSim" property="og:site_name"/><meta content="APGAR Simulator | EMSCodeSim" property="og:title"/><meta content="Practice newborn APGAR scoring with an interactive EMS and neonatal assessment simulator." property="og:description"/><meta content="https://emscodesim.com/APGAR/" property="og:url"/><meta content="https://emscodesim.com/ems-logo.png" property="og:image"/>
</head>
<body>
<h1>🩺 Apgar Simulator</h1>
<div class="stage">
<img alt="Baby model" id="baby" src="baby2.png"/>
<div class="overlay" id="overlayPeripheral"></div>
<div class="overlay" id="overlayCore"></div>
<div class="overlay" id="overlayFace"></div>
<div class="overlay" id="overlayBlink"></div>
</div>
<div class="controls">
<label><b>Appearance (Color)</b></label>
<input id="slider" max="100" min="0" type="range" value="0"/>
<p class="info">0% = Normal • 50% = Blue limbs • 100% = Full blue</p>
</div>
<table id="apgarTable">
<tr><th>Category</th><th>Score</th></tr>
<tr>
<td><button class="btn" id="btnAppearance">Appearance</button></td>
<td data-cat="appearance">
<button class="btn" data-val="0">0</button>
<button class="btn" data-val="1">1</button>
<button class="btn" data-active="1" data-val="2">2</button>
<button class="btn" data-val="?">?</button>
</td>
</tr>
<tr>
<td><button class="btn" id="btnPulse">Pulse</button></td>
<td data-cat="pulse">
<button class="btn" data-val="0">0</button>
<button class="btn" data-val="1">1</button>
<button class="btn" data-active="1" data-val="2">2</button>
<button class="btn" data-val="?">?</button>
</td>
</tr>
<tr>
<td><button class="btn" id="btnGrimace">Grimace</button></td>
<td data-cat="grimace">
<button class="btn" data-val="0">0</button>
<button class="btn" data-val="1">1</button>
<button class="btn" data-active="1" data-val="2">2</button>
<button class="btn" data-val="?">?</button>
</td>
</tr>
<tr>
<td><button class="btn" id="btnActivity">Activity</button></td>
<td data-cat="activity">
<button class="btn" data-val="0">0</button>
<button class="btn" data-val="1">1</button>
<button class="btn" data-active="1" data-val="2">2</button>
<button class="btn" data-val="?">?</button>
</td>
</tr>
<tr>
<td><button class="btn" id="btnResp">Respiration</button></td>
<td data-cat="respiration">
<button class="btn" data-val="0">0</button>
<button class="btn" data-val="1">1</button>
<button class="btn" data-active="1" data-val="2">2</button>
<button class="btn" data-val="?">?</button>
</td>
</tr>
<tr class="score-row">
<td>Total</td><td><span id="totalScore">10</span>/10</td>
</tr>
</table>
<div class="modal" id="modal">
<div class="panel">
<h3 id="modalTitle"></h3>
<p id="modalBody"></p>
<button class="btn" id="modalClose">Close</button>
</div>
</div>
<script>
const baby=document.getElementById('baby');
const overlayPeripheral=document.getElementById('overlayPeripheral');
const overlayCore=document.getElementById('overlayCore');
const overlayFace=document.getElementById('overlayFace');
const overlayBlink=document.getElementById('overlayBlink');
const slider=document.getElementById('slider');
const totalScore=document.getElementById('totalScore');
const apgar={appearance:2,pulse:2,grimace:2,activity:2,respiration:2};

function setScore(cat,val){
  if(val==='?'){openInfo(cat);return;}
  apgar[cat]=Number(val);
  document.querySelectorAll(`[data-cat="${cat}"] .btn`).forEach(b=>{
    b.dataset.active=(b.dataset.val===String(val))?'1':'0';
  });
  updateTotal();
}
function updateTotal(){
  const total=Object.values(apgar).reduce((a,b)=>a+b,0);
  totalScore.textContent=total;
}
document.querySelectorAll('td[data-cat] .btn').forEach(btn=>{
  btn.addEventListener('click',()=>setScore(btn.closest('td').dataset.cat,btn.dataset.val));
});

let heartRate=140,respRate=50,breathAmp=0.022;
function updateVitals(sev){
  heartRate=150-sev*1.1;
  respRate=55-sev*0.45;
  breathAmp=0.022-sev*0.00009;
}
function updateBlue(v){
  updateVitals(v);
  const p=Math.min(v,50)/50;
  const a=(0.75*p).toFixed(3);
  overlayPeripheral.style.background=`
    radial-gradient(18% 18% at 22% 48%, rgba(40,100,230,${a}) 0%, transparent 70%),
    radial-gradient(18% 18% at 78% 48%, rgba(40,100,230,${a}) 0%, transparent 70%),
    radial-gradient(20% 20% at 28% 88%, rgba(40,100,230,${a}) 0%, transparent 70%),
    radial-gradient(20% 20% at 72% 88%, rgba(40,100,230,${a}) 0%, transparent 70%)`;
  overlayPeripheral.style.opacity=p;
  const q=v<=50?0:(v-50)/50;
  overlayCore.style.background=`rgba(40,100,230,${(0.65+0.3*q).toFixed(3)})`;
  overlayCore.style.opacity=q;
}
slider.addEventListener('input',e=>updateBlue(+e.target.value));
updateBlue(0);

// Audio context
let ctx;
function initAudio(){if(ctx)return;ctx=new(window.AudioContext||window.webkitAudioContext)();}
window.addEventListener('click',initAudio,{once:true});

// Heartbeat
function playHeartbeat(){
  if(!ctx)return;
  const bpm=heartRate,beatInt=60/bpm,t=ctx.currentTime;
  for(let i=0;i<4;i++){const start=t+i*(beatInt*2);scheduleBeat(start);}
}
function scheduleBeat(start){
  const o1=ctx.createOscillator(),g1=ctx.createGain();
  o1.type='sine';o1.frequency.setValueAtTime(60,start);
  g1.gain.setValueAtTime(0.15,start);
  g1.gain.exponentialRampToValueAtTime(0.001,start+0.09);
  o1.connect(g1).connect(ctx.destination);o1.start(start);o1.stop(start+0.1);
  const o2=ctx.createOscillator(),g2=ctx.createGain();
  o2.type='sine';o2.frequency.setValueAtTime(90,start+0.12);
  g2.gain.setValueAtTime(0.15,start+0.12);
  g2.gain.exponentialRampToValueAtTime(0.001,start+0.22);
  o2.connect(g2).connect(ctx.destination);o2.start(start+0.12);o2.stop(start+0.22);
}

// breathing
let time=performance.now();
function loop(now){
  const freq=(respRate/60);
  const breathPhase=(Math.sin(now/1000*2*Math.PI*freq)+1)/2;
  const curve=Math.pow(breathPhase,1.8);
  const chestRise=breathAmp*curve;
  baby.style.transform=`translateY(${-chestRise*60}px) scaleY(${1+chestRise})`;
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// whimper + grimace
function playWhimper(){
  if(!ctx)return;
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.type='triangle';
  o.frequency.setValueAtTime(500,ctx.currentTime);
  o.frequency.linearRampToValueAtTime(650,ctx.currentTime+0.15);
  g.gain.setValueAtTime(0.0001,ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.15,ctx.currentTime+0.05);
  g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.35);
  o.connect(g).connect(ctx.destination);
  o.start();o.stop(ctx.currentTime+0.4);
}
function grimaceFace(){
  overlayFace.style.opacity=0.8;
  setTimeout(()=>overlayFace.style.opacity=0,250);
  overlayBlink.style.opacity=1;
  overlayBlink.style.clipPath='inset(0 0 92% 0 round 20px)';
  setTimeout(()=>{overlayBlink.style.clipPath='inset(0 0 98% 0 round 20px)';overlayBlink.style.opacity=0;},120);
}

// animations
function animateAppearance(){
  let i=0;const seq=[0,20,40,60,80,100,80,60,40,20,0];
  const t=setInterval(()=>{slider.value=seq[i];updateBlue(seq[i]);i++;if(i>=seq.length)clearInterval(t);},120);
}
function animatePulse(){
  playHeartbeat();
  baby.style.transition="transform .05s";let on=false;let c=0;
  const flash=setInterval(()=>{
    baby.style.transform=`scale(${on?1:1.02})`;
    on=!on;c++;if(c>20){clearInterval(flash);baby.style.transform='scale(1)';}
  },200);
}
function animateGrimace(){
  grimaceFace();playWhimper();
  baby.style.transition="transform .15s";
  baby.style.transform="translateY(-5px) rotate(3deg)";
  setTimeout(()=>baby.style.transform="translateY(0) rotate(0)",200);
}
// *** Option B: Activity wiggle simulation ***
function animateActivity(level=2){
  let t=0;
  const amp = level===2 ? 2.5 : level===1 ? 1.2 : 0;
  const speed = level===2 ? 0.4 : 0.25;
  if(amp===0)return;
  const move=setInterval(()=>{
    baby.style.transform=`rotate(${Math.sin(t*speed)*amp}deg)`;
    t+=1;
    if(t>60){clearInterval(move);baby.style.transform='rotate(0deg)';}
  },16);
}
function animateResp(){breathAmp=0.04;setTimeout(()=>breathAmp=0.022,3000);}

// link buttons
btnAppearance.onclick=animateAppearance;
btnPulse.onclick=animatePulse;
btnGrimace.onclick=animateGrimace;
btnActivity.onclick=()=>animateActivity(2);
btnResp.onclick=animateResp;

// modal info
const modal=document.getElementById('modal');
const modalTitle=document.getElementById('modalTitle');
const modalBody=document.getElementById('modalBody');
const modalClose=document.getElementById('modalClose');
const info={
  appearance:"2 = Pink<br>1 = Blue extremities<br>0 = Blue body",
  pulse:"2 = ≥100 bpm<br>1 = <100 bpm<br>0 = Absent",
  grimace:"2 = Cries<br>1 = Grimace<br>0 = None",
  activity:"2 = Active motion<br>1 = Some flexion<br>0 = Flaccid",
  respiration:"2 = Strong cry<br>1 = Weak<br>0 = None"
};
function openInfo(cat){
  modalTitle.textContent=cat.charAt(0).toUpperCase()+cat.slice(1);
  modalBody.innerHTML=info[cat]||"";
  modal.style.display="flex";
}
modalClose.onclick=()=>modal.style.display="none";
modal.onclick=e=>{if(e.target===modal)modal.style.display="none";}
updateTotal();
</script>
</body>
</html>
