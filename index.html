<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>EMS Simulators — Index</title>
<style>
  :root{
    --bg:#0b1f2a; --panel:#0f2a39; --ink:#eaf3f7; --muted:#9fb8c5; --accent:#21c4d7;
    --card:#123548; --hover:#18465d;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif}
  header{padding:1rem 1.25rem;background:linear-gradient(90deg,#0f2a39,#102f40);border-bottom:1px solid rgba(255,255,255,.06)}
  header h1{margin:0;font-size:1.15rem}
  .wrap{max-width:900px;margin:0 auto;padding:1rem;display:grid;gap:1rem}
  .menu{background:var(--panel);border-radius:14px;padding:1rem}
  .menu h2{margin:.2rem 0 .6rem;font-size:1rem;color:var(--accent)}
  ul.links{list-style:none;margin:0;padding:0;display:grid;gap:.5rem}
  .link{
    display:block; background:var(--card); padding:.8rem 1rem; border-radius:10px;
    text-decoration:none; color:var(--ink); border:1px solid rgba(255,255,255,.06);
  }
  .link:hover{background:var(--hover); border-color:rgba(57,209,225,.3)}
  .search{
    display:flex; gap:.6rem; align-items:center; background:#123548b0; border:1px solid rgba(255,255,255,.08);
    border-radius:10px; padding:.6rem .75rem
  }
  .search input{flex:1; background:transparent; border:0; color:var(--ink); outline:0; font-size:16px}
  .hide{display:none}
  footer{color:var(--muted);text-align:center;padding:1rem .5rem}
</style>
</head>
<body>
<header>
  <h1>EMS Simulators — Index</h1>
</header>

<div class="wrap">
  <div class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M21 21l-4.35-4.35M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <input id="q" placeholder="Quick filter… (e.g., vitals, bp, stroke)" />
  </div>

  <!-- Main -->
  <section class="menu" data-section="Main">
    <h2>Main</h2>
    <ul class="links">
      <li><a class="link" data-title="med sim" href="https://emscodesim.com/med_sim">Medical Simulator</a></li>
    </ul>
  </section>

  <!-- Vitals -->
  <section class="menu" data-section="Vitals">
    <h2>Vitals</h2>
    <ul class="links">
      <li><a class="link" data-title="aao loc" href="https://emscodesim.com/vitals/aao">AAO (LOC)</a></li>
      <li><a class="link" data-title="blood glucose bgl" href="https://emscodesim.com/vitals/bgl">Blood Glucose</a></li>
      <li><a class="link" data-title="blood pressure bp" href="https://emscodesim.com/vitals/bp">Blood Pressure</a></li>
      <li><a class="link" data-title="breath sound simulator" href="https://emscodesim.com/vitals/breath-sound-simulator">Breath Sound Simulator</a></li>
      <li><a class="link" data-title="glasgow coma scale gcs" href="https://emscodesim.com/vitals/gcs">Glasgow Coma Scale (GCS)</a></li>
      <li><a class="link" data-title="rule of nines tbsa" href="https://emscodesim.com/vitals/nines">Rule of Nines (TBSA)</a></li>
      <li><a class="link" data-title="pulse" href="https://emscodesim.com/vitals/pulse">Pulse</a></li>
      <li><a class="link" data-title="pupil reaction perl" href="https://emscodesim.com/vitals/pupil">Pupil Reaction</a></li>
      <li><a class="link" data-title="skin appearance" href="https://emscodesim.com/vitals/skin">Skin Appearance</a></li>
      <li><a class="link" data-title="stroke assessment" href="https://emscodesim.com/vitals/stroke">Stroke Assessment</a></li>
    </ul>
  </section>
</div>

<footer>© EMS Training Simulators</footer>

<script>
  const q = document.getElementById('q');
  const sections = Array.from(document.querySelectorAll('section.menu'));
  function applyFilter(){
    const term = q.value.trim().toLowerCase();
    sections.forEach(sec=>{
      let visible = 0;
      sec.querySelectorAll('.link').forEach(a=>{
        const text = a.textContent.toLowerCase() + ' ' + (a.dataset.title||'');
        const show = term==='' ? true : text.includes(term);
        a.classList.toggle('hide', !show);
        if(show) visible++;
      });
      sec.classList.toggle('hide', visible===0);
    });
  }
  q.addEventListener('input', applyFilter);
  applyFilter();
</script>
</body>
</html>
