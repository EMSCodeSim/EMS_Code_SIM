<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>EMS CODE SIM</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <style>
    :root{
      --bg:#f7fafc;
      --card:#ffffff;
      --text:#0f172a;
      --muted:#334155;
      --accent:#007B8A; /* Blue/teal tone */
      --accent-light:#009db3;
      --ring: rgba(0,123,138,.35);
      --shadow: 0 10px 28px rgba(15,23,42,.12);
      --border: rgba(15,23,42,.10);
      --tile-grad: linear-gradient(180deg, #ffffff 0%, #f3f6fb 100%);
    }
    *{box-sizing:border-box}
    html,body{height:100%; touch-action: manipulation;}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background:var(--bg);
      color:var(--text);
      -webkit-tap-highlight-color: transparent;
    }

    .app{
      max-width: 640px;
      margin: 0 auto;
      padding: env(safe-area-inset-top) 18px env(safe-area-inset-bottom);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header{
      text-align:center;
      padding: 8px 0 0;
    }
    .title{
      margin: 0;
      font-weight: 800;
      font-size: 1.4rem;
    }
    .subtitle{
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 1rem;
    }

    .card{
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .grid{
      display: grid;
      gap: 12px;
      grid-template-columns: 1fr 1fr;
    }
    @media (max-width: 440px){
      .grid{ grid-template-columns: 1fr; }
    }

    .tool{
      display: flex;
      gap: 12px;
      align-items: flex-start;
      background: var(--tile-grad);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 6px 16px rgba(15,23,42,.08), inset 0 1px 0 rgba(255,255,255,.8);
    }
    .tool .icon{
      width: 36px; height: 36px; flex: 0 0 36px;
      display:flex; align-items:center; justify-content:center;
      border-radius: 10px;
      background: #e0f7fb;
      border: 1px solid rgba(0,123,138,.25);
    }
    .tool h3{
      margin: 0;
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--text);
    }
    .tool p{
      margin: 2px 0 10px 0;
      font-size: .92rem;
      color: var(--muted);
    }

    /* All buttons now blue */
    .btn{
      appearance: none;
      display: inline-block;
      width: 100%;
      text-align: center;
      text-decoration: none;
      border-radius: 12px;
      padding: 12px 14px;
      font-weight: 800;
      font-size: 1rem;
      border: 1px solid rgba(0,123,138,.55);
      color: #fff;
      background: linear-gradient(180deg, var(--accent-light) 0%, var(--accent) 100%);
      box-shadow: 0 6px 16px rgba(0,123,138,.25);
      transition: transform .04s ease, box-shadow .2s ease;
      -webkit-user-select: none; user-select: none;
    }
    .btn:active{ transform: translateY(1px) scale(.99); }
    .btn:focus-visible{ outline: 2px solid var(--ring); outline-offset: 2px; }

    footer{
      margin-top: auto;
      text-align: center;
      color: var(--muted);
      font-size: .85rem;
      padding: 8px 0 6px;
    }

    /* Bottom sheet menu */
    .sheet-backdrop{
      position: fixed; inset: 0;
      background: rgba(0,0,0,.28);
      display:none;
      z-index: 20;
    }
    .sheet{
      position: fixed; left: 0; right: 0; bottom: -100%;
      margin: 0 auto;
      max-width: 640px;
      background: var(--card);
      border: 1px solid var(--border);
      border-top-left-radius: 18px;
      border-top-right-radius: 18px;
      box-shadow: 0 -12px 28px rgba(15,23,42,.18);
      padding: 14px 14px 18px;
      z-index: 21;
      transition: bottom .22s ease;
    }
    .sheet.active{ bottom: 0; }
    .sheet-handle{
      width: 44px; height: 4px; border-radius: 999px; background: #e5e7eb;
      margin: 4px auto 10px;
    }
    .sheet-grid{
      display:grid; gap:10px;
      grid-template-columns: 1fr 1fr 1fr;
    }
    @media (max-width: 520px){
      .sheet-grid{ grid-template-columns: 1fr; }
    }
    .sheet-btn{
      display:flex; gap:10px; align-items:center; justify-content:space-between;
      border-radius:12px;
      padding:12px 14px;
      color: #fff;
      background: linear-gradient(180deg, var(--accent-light) 0%, var(--accent) 100%);
      text-decoration:none;
      font-weight:800;
      box-shadow: 0 6px 16px rgba(0,123,138,.25);
    }
    .sicon{
      width:28px; height:28px;
      display:inline-flex; align-items:center; justify-content:center;
      border-radius:8px; background:#e0f7fb;
      border:1px solid rgba(0,123,138,.25);
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1 class="title">EMS CODE SIM</h1>
      <p class="subtitle">Tap a tool to launch.</p>
    </header>

    <section class="card">
      <div class="grid">
        <!-- Other tools here -->

        <!-- Vitals menu -->
        <div class="tool" style="grid-column: 1 / -1;">
          <div class="icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
              <path d="M3.5 11c0-3 2.2-5 5-5 2.1 0 3.5 1.2 4.5 2.7C14 7.2 15.4 6 17.5 6c2.8 0 5 2 5 5 0 6.5-10.5 10.5-10.5 10.5S3.5 17.5 3.5 11Z" stroke="#0369a1" stroke-width="1.6"/>
              <path d="M4 11h4l2 4 2-8 2 4h6" stroke="#0369a1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div style="flex:1">
            <h3>Vitals</h3>
            <p>Blood pressure, pulse, breath sounds</p>
            <button id="openVitals" class="btn" type="button">Open Vitals Menu</button>
          </div>
        </div>
      </div>
    </section>

    <footer>&copy; 2025 EMS CODE SIM</footer>
  </div>

  <!-- Bottom sheet -->
  <div class="sheet-backdrop" id="backdrop" hidden></div>
  <div class="sheet" id="vitalsSheet">
    <div class="sheet-handle"></div>
    <div class="sheet-grid">
      <a class="sheet-btn" href="vitals/BP.html">Blood Pressure</a>
      <a class="sheet-btn" href="https://emscodesim.com/vitals/pulse">Pulse (Rate Trainer)</a>
      <a class="sheet-btn" href="vitals/breath-sound-simulator.html">Breath Sounds</a>
    </div>
  </div>

  <script>
    const openBtn  = document.getElementById('openVitals');
    const sheet    = document.getElementById('vitalsSheet');
    const backdrop = document.getElementById('backdrop');

    function openSheet(){
      backdrop.hidden = false;
      backdrop.style.display = 'block';
      sheet.classList.add('active');
      document.body.style.overflow = 'hidden';
    }
    function closeSheet(){
      sheet.classList.remove('active');
      document.body.style.overflow = '';
      backdrop.style.display = 'none';
      backdrop.hidden = true;
    }

    openBtn.addEventListener('click', openSheet);
    backdrop.addEventListener('click', closeSheet);
  </script>
</body>
</html>
