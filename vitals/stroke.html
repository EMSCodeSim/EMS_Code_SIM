<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Stroke Assessment (BE-FAST) – Single SVG, Per-Test Auto Start</title>
<style>
  :root{
    --bg:#f4f8fb; --card:#fff; --ink:#122230; --muted:#5c6a78;
    --accent:#0a76d3; --accent-2:#0db37d; --border:#e6edf3;
  }
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,"Helvetica Neue",sans-serif}
  .wrap{max-width:1100px;margin:0 auto;padding:14px;display:grid;gap:12px}
  header{background:linear-gradient(180deg,#0a76d3,#095fb0);color:#fff;border-radius:16px;padding:16px}
  header h1{margin:0 0 6px;font-size:1.2rem}
  header p{margin:0;opacity:.95}

  .grid{display:grid;gap:12px}
  @media(min-width:980px){ .grid{grid-template-columns:1.35fr .65fr} }

  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:0 2px 12px rgba(10,30,60,.05)}
  .card h2{font-size:1rem;margin:0;padding:12px;border-bottom:1px solid var(--border)}
  .card .body{padding:12px}

  .toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
  .seg{display:flex;border:1px solid var(--border);border-radius:12px;overflow:hidden}
  .seg button{padding:9px 11px;border:0;background:#fff;color:var(--ink);font-weight:700;cursor:pointer}
  .seg button.active{background:var(--accent);color:#fff}
  .seg button+button{border-left:1px solid var(--border)}

  .btn{appearance:none;border:1px solid var(--border);background:#fff;color:var(--ink);padding:10px 12px;border-radius:12px;font-weight:700;cursor:pointer}
  .btn.success{background:var(--accent-2);border-color:var(--accent-2);color:#fff}
  .btn:active{transform:translateY(1px)}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .pill{display:inline-block;background:#eef6ff;border:1px solid #d9e9fb;border-radius:999px;padding:4px 10px;font-weight:700}

  .panel{aspect-ratio: 3/4;background:linear-gradient(180deg,#f9fcff,#f1f6fb);border:1px solid var(--border);border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden}
  svg{width:100%;max-width:480px;height:auto}

  .muted{color:var(--muted)}
  label{font-weight:700}
  select{width:100%;padding:.6rem .7rem;border-radius:10px;border:1px solid var(--border);background:#fff}
  .formGrid{display:grid;gap:10px;grid-template-columns:1fr 1fr}
  @media (max-width:760px){ .formGrid{grid-template-columns:1fr} }
  .results{margin-top:10px}
  .results .box{background:#f8fafc;border:1px solid var(--border);border-radius:12px;padding:10px}
  .results ul{margin:.4rem 0 0 1.1rem}
  .results li{margin:.18rem 0}

  .infoGrid{display:grid;gap:8px;grid-template-columns:1fr}
  @media (max-width:760px){ .infoGrid{grid-template-columns:1fr} }

  /* Anim helpers */
  @keyframes sway{0%{transform:translateX(0)}50%{transform:translateX(3px)}100%{transform:translateX(0)}}
</style>
</head>
<body>
<div class="wrap">
  <header class="card">
    <h1>Stroke Assessment (BE-FAST)</h1>
    <p>Neutral on load. Press any test to start immediately. Pupils remain equal and are not included in findings.</p>
  </header>

  <div class="grid">
    <!-- LEFT: Simulator + Patient Info -->
    <section class="card">
      <h2>Simulator</h2>
      <div class="body">
        <div class="toolbar">
          <div class="seg" role="tablist" aria-label="Test selector">
            <button id="tab-balance" role="tab" aria-selected="false" title="Arms down">Balance</button>
            <button id="tab-drift"   role="tab" aria-selected="false" title="Arms up, palms up">Arm Drift</button>
            <button id="tab-face"    role="tab" aria-selected="false">Face</button>
            <button id="tab-eyes"    role="tab" aria-selected="false">Eyes</button>
            <button id="tab-speech"  role="tab" aria-selected="false">Speech</button>
          </div>
          <div class="btn-row">
            <span class="pill">Timer: <span id="timer">0.0</span>s</span>
            <button id="btn-reset-visual" class="btn">Reset View</button>
          </div>
        </div>

        <div class="panel" id="panel">
          <!-- One reusable SVG person for all tests -->
          <svg id="person" viewBox="0 0 200 280" aria-labelledby="title desc" role="img">
            <title id="title">Patient Figure</title>
            <desc id="desc">Front view human figure used in stroke assessment animations (balance, drift, face, eyes).</desc>

            <!-- Ground -->
            <ellipse cx="100" cy="262" rx="58" ry="10" fill="#e7eef6"/>

            <!-- Upper and lower separated so only upper sways on Balance -->
            <!-- LOWER (legs/feet) stays fixed -->
            <g id="lower">
              <path d="M 92 162 V 228" stroke="#2f3d56" stroke-width="14" stroke-linecap="round"/>
              <path d="M 108 162 V 228" stroke="#2f3d56" stroke-width="14" stroke-linecap="round"/>
              <rect x="84" y="228" width="32" height="10" rx="3" fill="#2f3d56"/>
            </g>

            <!-- UPPER (head + torso + arms) may sway/transform -->
            <g id="upper">
              <!-- Head -->
              <g id="head" transform="translate(100,60)">
                <circle r="22" fill="#f5d2b8" stroke="#c9a18c"/>
                <!-- Eyes with equal pupils (we move pupils for gaze) -->
                <g id="eyeL" transform="translate(-9,-3)">
                  <ellipse rx="6" ry="4.2" fill="#fff" stroke="#c9a18c"/>
                  <circle id="pL" r="2.2" cx="0" cy="0" fill="#222"/>
                </g>
                <g id="eyeR" transform="translate(9,-3)">
                  <ellipse rx="6" ry="4.2" fill="#fff" stroke="#c9a18c"/>
                  <circle id="pR" r="2.2" cx="0" cy="0" fill="#222"/>
                </g>
                <!-- Brows -->
                <path id="browL" d="M -12 -9 Q -6 -11 -1 -10" fill="none" stroke="#8b5a4e" stroke-width="2" stroke-linecap="round"/>
                <path id="browR" d="M 1 -10 Q 6 -11 12 -9" fill="none" stroke="#8b5a4e" stroke-width="2" stroke-linecap="round"/>
                <!-- Mouth (we morph this for smile & droop) -->
                <path id="mouth" d="M -7 8 Q 0 10 7 8" fill="none" stroke="#8b5a4e" stroke-width="2" stroke-linecap="round"/>
              </g>

              <!-- Torso -->
              <rect x="72" y="84" width="56" height="78" rx="10" fill="#79a9ff" stroke="#4c77cc"/>

              <!-- Arms DOWN (Balance default) -->
              <g id="arms-down">
                <path d="M 72 92 C 62 120, 62 150, 70 178" fill="none" stroke="#79a9ff" stroke-width="14" stroke-linecap="round"/>
                <path d="M 128 92 C 138 120, 138 150, 130 178" fill="none" stroke="#79a9ff" stroke-width="14" stroke-linecap="round"/>
                <circle cx="70" cy="184" r="7" fill="#f5d2b8" stroke="#c9a18c"/>
                <circle cx="130" cy="184" r="7" fill="#f5d2b8" stroke="#c9a18c"/>
              </g>

              <!-- Arms UP, PALMS UP (Arm Drift) -->
              <g id="arms-up" visibility="hidden">
                <path d="M 84 110 Q 84 100 92 98" fill="none" stroke="#79a9ff" stroke-width="12" stroke-linecap="round"/>
                <path d="M 116 110 Q 116 100 108 98" fill="none" stroke="#79a9ff" stroke-width="12" stroke-linecap="round"/>
                <path id="left-forearm" d="M 92 98 H 66" fill="none" stroke="#79a9ff" stroke-width="12" stroke-linecap="round"/>
                <path id="right-forearm" d="M 108 98 H 134" fill="none" stroke="#79a9ff" stroke-width="12" stroke-linecap="round"/>
                <ellipse id="left-palm" cx="62" cy="98" rx="7.5" ry="6.5" fill="#f5d2b8" stroke="#c9a18c"/>
                <ellipse id="right-palm" cx="138" cy="98" rx="7.5" ry="6.5" fill="#f5d2b8" stroke="#c9a18c"/>
                <path d="M 58 98 h 8" stroke="#d3b2a0" />
                <path d="M 134 98 h 8" stroke="#d3b2a0" />
              </g>
            </g>
          </svg>
        </div>

        <div class="infoGrid" style="margin-top:10px">
          <div class="box" style="background:#f8fafc;border:1px solid var(--border);border-radius:12px;padding:10px">
            <div style="font-weight:800;margin-bottom:4px">Patient Information</div>
            <div id="ptInfo"></div>
          </div>
        </div>

        <div id="testDesc" class="muted" style="margin-top:10px"></div>
      </div>
    </section>

    <!-- RIGHT: BE-FAST user findings (no pupils) -->
    <aside class="card">
      <h2>Your Findings (BE-FAST)</h2>
      <div class="body">
        <div class="formGrid">
          <div>
            <label for="fBalance">Balance</label>
            <select id="fBalance">
              <option value="normal">Normal</option>
              <option value="unsteady">Unsteady / broad-based</option>
              <option value="leansLeft">Leans/Falls Left</option>
              <option value="leansRight">Leans/Falls Right</option>
            </select>
          </div>
          <div>
            <label for="fEyes">Eyes (Gaze)</label>
            <select id="fEyes">
              <option value="normal">Normal tracking</option>
              <option value="slow">Slow pursuit</option>
              <option value="deviationLeft">Gaze deviation Left</option>
              <option value="deviationRight">Gaze deviation Right</option>
            </select>
          </div>
          <div>
            <label for="fFace">Face droop</label>
            <select id="fFace">
              <option value="none">None</option>
              <option value="left">Left droop</option>
              <option value="right">Right droop</option>
            </select>
          </div>
          <div>
            <label for="fArms">Arm drift</label>
            <select id="fArms">
              <option value="none">No drift</option>
              <option value="left">Left arm drifts</option>
              <option value="right">Right arm drifts</option>
            </select>
          </div>
          <div>
            <label for="fSpeech">Speech</label>
            <select id="fSpeech">
              <option value="normal">Normal</option>
              <option value="dysarthria">Slurred (dysarthria)</option>
              <option value="aphasiaExpressive">Aphasia (expressive)</option>
              <option value="aphasiaReceptive">Aphasia (receptive)</option>
              <option value="aphasiaGlobal">Aphasia (global/mute)</option>
            </select>
          </div>
          <div>
            <label for="fTime">Time (Last Known Well)</label>
            <select id="fTime">
              <option value="lt3h">&lt; 3 hours</option>
              <option value="3to6h">3–6 hours</option>
              <option value="6to24h">6–24 hours</option>
              <option value="gt24h">&gt; 24 hours</option>
              <option value="unknown">Unknown</option>
            </select>
          </div>
        </div>

        <div class="btn-row" style="margin-top:10px">
          <button class="btn success" id="btnGrade">Show Results</button>
          <button class="btn" id="btnNew">Next Case</button>
          <button class="btn" id="btnResetForm">Reset</button>
        </div>

        <div class="results">
          <div class="box" id="gradeBox" hidden>
            <div id="gradeSummary"><strong>Results:</strong> —</div>
            <ul id="gradeList"></ul>
            <div id="meaning" style="margin-top:.5rem"></div>
          </div>
        </div>
      </div>
    </aside>
  </div>
</div>

<script>
(function(){
  const $ = s => document.querySelector(s);

  /* Tabs (no active at start; pressing starts & highlights) */
  const tabBalance = $('#tab-balance');
  const tabDrift   = $('#tab-drift');
  const tabFace    = $('#tab-face');
  const tabEyes    = $('#tab-eyes');
  const tabSpeech  = $('#tab-speech');
  const btnResetVisual = $('#btn-reset-visual');
  const timerEl = $('#timer');
  const testDesc = $('#testDesc');

  /* SVG elements */
  const upper = $('#upper');
  const lower = $('#lower');
  const armsDown = $('#arms-down');
  const armsUp   = $('#arms-up');
  const leftPalm  = $('#left-palm');
  const rightPalm = $('#right-palm');
  const mouth = $('#mouth');
  const browL = $('#browL');
  const browR = $('#browR');
  const pL = $('#pL'); const pR = $('#pR');

  /* Findings form (no pupils) */
  const fBalance = $('#fBalance');
  const fEyes = $('#fEyes');
  const fFace = $('#fFace');
  const fArms = $('#fArms');
  const fSpeech = $('#fSpeech');
  const fTime = $('#fTime');
  const btnGrade = $('#btnGrade');
  const btnNew = $('#btnNew');
  const btnResetForm = $('#btnResetForm');
  const gradeBox = $('#gradeBox');
  const gradeList = $('#gradeList');
  const gradeSummary = $('#gradeSummary');
  const meaning = $('#meaning');

  /* Patient info elements */
  const ptInfo = $('#ptInfo');

  /* State */
  let running = false;
  let scenario = null;

  // timers / animation handles
  let swayTimer = null, swayTick = 0;
  let driftRAF = null, driftRunning = false, driftStart = 0, driftTriggeredAt = null;
  let gazeTimer = null;

  function rand(a){ return a[Math.floor(Math.random()*a.length)]; }
  function coin(p=0.5){ return Math.random() < p; }
  function clamp(n,min,max){ return Math.max(min, Math.min(max,n)); }

  /* ---------- Scenario generation ---------- */
  function newCase(){
    // Demographics + core info
    const ages = [34,41,55,62,69,73,79,84];
    const sexes = ['Male','Female'];
    const complaints = [
      'sudden weakness','facial droop','difficulty speaking','unsteady gait','blurred vision',
      'headache','numbness','confusion'
    ];
    const minutesAgo = [10,15,20,25,30,45,60,90,120,180];
    const glucoseVals = [58,72,88,101,110,126,140,182];
    const hx = [
      'HTN','Type 2 DM','Afib','HLD','Former smoker','CAD','No significant history'
    ];

    const hasStroke = coin(0.7);
    const face = hasStroke ? rand(['left','right','none','none']) : 'none';
    const arm  = hasStroke ? rand(['left','right','none']) : 'none';
    const eyes = hasStroke ? rand(['deviationLeft','deviationRight','slow','normal']) : 'normal';
    const bal  = hasStroke ? rand(['unsteady','leansLeft','leansRight','normal']) : 'normal';
    const speech = hasStroke ? rand(['dysarthria','aphasiaExpressive','aphasiaReceptive','aphasiaGlobal','normal']) : 'normal';

    scenario = {
      age: rand(ages),
      sex: rand(sexes),
      cco: rand(complaints),
      lkwMin: rand(minutesAgo),
      glucose: rand(glucoseVals),
      hx: rand(hx),

      faceDroop: face,
      armDrift: arm,
      gaze: eyes,
      balance: bal,
      speech: speech
    };

    // Fill patient info
    const onset = scenario.lkwMin<=60 ? `${scenario.lkwMin} min ago` : `${Math.round(scenario.lkwMin/60)} hr ago`;
    ptInfo.innerHTML = `
      <div><strong>Age/Sex:</strong> ${scenario.age} / ${scenario.sex}</div>
      <div><strong>Chief Complaint:</strong> ${scenario.cco}</div>
      <div><strong>Last Known Well:</strong> ${onset}</div>
      <div><strong>Glucose:</strong> ${scenario.glucose} mg/dL</div>
      <div><strong>History:</strong> ${scenario.hx}</div>
    `;

    // Reset user selections & visuals
    resetForm();
    resetVisuals();
    clearActive();
    setTestDesc(''); // neutral on load
  }

  /* ---------- Visual reset ---------- */
  function resetVisuals(){
    stopAll();
    // neutral arms
    armsDown.setAttribute('visibility','visible');
    armsUp.setAttribute('visibility','hidden');
    // eyes centered
    pL.style.transform='translate(0,0)'; pR.style.transform='translate(0,0)';
    // mouth & brows neutral
    mouth.setAttribute('d','M -7 8 Q 0 10 7 8');
    browL.setAttribute('d','M -12 -9 Q -6 -11 -1 -10');
    browR.setAttribute('d','M 1 -10 Q 6 -11 12 -9');
    // timer
    timerEl.textContent='0.0';
    // ensure lower body remains fixed; upper transform reset
    upper.style.transform = 'rotate(0deg) translateX(0px)';
  }

  function stopAll(){
    running=false;
    if(swayTimer){ clearInterval(swayTimer); swayTimer=null; }
    if(gazeTimer){ clearInterval(gazeTimer); gazeTimer=null; }
    if(driftRAF){ cancelAnimationFrame(driftRAF); driftRAF=null; }
    driftRunning=false; driftTriggeredAt=null;
  }

  function clearActive(){
    for(const el of [tabBalance,tabDrift,tabFace,tabEyes,tabSpeech]){
      el.classList.remove('active'); el.setAttribute('aria-selected','false');
    }
  }
  function setActive(btn){
    clearActive();
    btn.classList.add('active'); btn.setAttribute('aria-selected','true');
  }
  function setTestDesc(msg){ testDesc.textContent = msg; }

  /* ---------- Test actions (start immediately on press) ---------- */
  function doBalance(){
    setActive(tabBalance);
    resetVisuals();
    setTestDesc('Balance: Feet together, arms at sides. Observe upper body for sway or a lean; legs and feet remain planted.');

    const bal = scenario.balance;
    if(bal==='normal'){ return; }
    running=true; swayTick=0;
    const baseAmp = bal==='unsteady' ? 8 : 10;
    const bias = (bal==='leansLeft') ? -12 : (bal==='leansRight' ? 12 : 0);
    swayTimer=setInterval(()=>{
      swayTick++;
      const sway = Math.sin(swayTick/10)*baseAmp + bias;
      // Only move the UPPER group; lower stays fixed
      upper.style.transform = `rotate(${sway/2}deg) translateX(${sway>0?2:-2}px)`;
    },80);
  }

  function doDrift(){
    setActive(tabDrift);
    resetVisuals();
    setTestDesc('Arm Drift: Ask patient to close eyes and hold both arms straight out, palms up, for 10 seconds. Watch for one arm drifting down.');

    // Arms up immediately
    armsDown.setAttribute('visibility','hidden');
    armsUp.setAttribute('visibility','visible');

    running=true;
    driftRunning=true; driftStart=performance.now(); driftTriggeredAt=null;
    const side = scenario.armDrift; // 'left'|'right'|'none'
    function tick(ts){
      if(!driftRunning) return;
      const elapsed=(ts - driftStart)/1000;
      timerEl.textContent = elapsed.toFixed(1);

      if(side!=='none'){
        // Begin drift after ~3s
        if(!driftTriggeredAt && elapsed>=3.0){ driftTriggeredAt = elapsed; }
        if(driftTriggeredAt){
          const d = clamp((elapsed - driftTriggeredAt)/0.6, 0, 1);
          const drop = 26*d;
          if(side==='left'){
            const baseY = 98; document.getElementById('left-palm').setAttribute('cy', baseY + drop);
            document.getElementById('left-forearm').setAttribute('d', `M 92 98 H ${66 + drop*0.2}`);
          }else if(side==='right'){
            const baseY = 98; document.getElementById('right-palm').setAttribute('cy', baseY + drop);
            document.getElementById('right-forearm').setAttribute('d', `M 108 98 H ${134 - drop*0.2}`);
          }
        }
      }
      if(elapsed<10){ driftRAF=requestAnimationFrame(tick); } else { stopAll(); }
    }
    driftRAF=requestAnimationFrame(tick);
  }

  function doFace(){
    setActive(tabFace);
    resetVisuals();
    setTestDesc('Face: Ask the patient to smile. Look for asymmetry (one corner lower). Eyebrow on the affected side may also droop.');

    // Smile morph + asymmetric droop based on scenario.faceDroop
    const droop = scenario.faceDroop; // 'left'|'right'|'none'

    // Build an asymmetric smile path: control point stays centered; end corners shift
    // Base neutral: M -7 8 Q 0 10 7 8
    // Smile target: left corner y, right corner y may differ if droop is present
    const Lx0=-7, Rx0=7, Ly0=8, Ry0=8, Cx0=0, Cy0=10;
    const LySmile = (droop==='left') ? 11 : 6.5;   // lower (bigger y) if droop on that side
    const RySmile = (droop==='right') ? 11 : 6.5;

    const steps=24; let i=0;
    const id = setInterval(()=>{
      i++;
      const t = i/steps;
      // ease
      const e = t<.5 ? 2*t*t : -1+(4-2*t)*t;
      const Ly = Ly0 + (LySmile - Ly0)*e;
      const Ry = Ry0 + (RySmile - Ry0)*e;
      const Cy = Cy0 + (13 - Cy0)*e; // slightly bigger smile arc
      mouth.setAttribute('d', `M ${Lx0} ${Ly} Q ${Cx0} ${Cy} ${Rx0} ${Ry}`);
      if(i>=steps) clearInterval(id);
    }, 16);

    // Eyebrow droop (pupils stay equal)
    if(droop==='left'){
      browL.setAttribute('d','M -12 -6 Q -6 -6 -1 -7');
      browR.setAttribute('d','M 1 -10 Q 6 -11 12 -9');
    }else if(droop==='right'){
      browR.setAttribute('d','M 1 -6 Q 6 -6 12 -7');
      browL.setAttribute('d','M -12 -9 Q -6 -11 -1 -10');
    }
  }

  function doEyes(){
    setActive(tabEyes);
    resetVisuals();
    setTestDesc('Eyes/Gaze: Ask patient to follow your finger left and right. Look for slow pursuit or forced gaze deviation.');

    const kind = scenario.gaze; // 'normal'|'slow'|'deviationLeft'|'deviationRight'
    const speed = (kind==='slow') ? 140 : 75;
    const amp = 3.5;
    let tick=0;
    gazeTimer=setInterval(()=>{
      tick++;
      let pos = Math.sin(tick/10)*amp;
      if(kind==='deviationLeft'){ pos = Math.min(pos,0) - 1.2; }
      if(kind==='deviationRight'){ pos = Math.max(pos,0) + 1.2; }
      pL.style.transform = `translate(${pos}px,0)`;
      pR.style.transform = `translate(${pos}px,0)`;
    }, speed);
  }

  function doSpeech(){
    setActive(tabSpeech);
    resetVisuals();
    setTestDesc('Speech: Have the patient repeat a phrase. Listen for slurring (dysarthria) or errors in expression/comprehension (aphasia).');

    // Uses browser Text-to-Speech to emulate speech findings
    const s = scenario.speech; // 'normal' | dysarthria | aphasia*
    const u = new SpeechSynthesisUtterance();
    u.rate = 1.0; u.pitch = 1.0; u.lang = 'en-US';

    let text = "The sky is blue and the grass is green.";
    if(s==='normal'){
      text = "The early bird catches the worm. Today is a sunny day.";
    }else if(s==='dysarthria'){
      text = "Thuhh earrly burd catchezz the werm. Tuhday ishh a shunny day.";
    }else if(s==='aphasiaExpressive'){
      text = "Uh... sky... uh... blue... um... grass... uh... uh...";
    }else if(s==='aphasiaReceptive'){
      text = "Yes, okay, I understand. Happy sofa banana elbow, absolutely.";
    }else if(s==='aphasiaGlobal'){
      text = "...";
    }
    u.text = text;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }

  /* ---------- Findings, grading ---------- */
  function resetForm(){
    fBalance.value='normal'; fEyes.value='normal'; fFace.value='none'; fArms.value='none'; fSpeech.value='normal'; fTime.value='unknown';
    gradeBox.hidden=true; gradeList.innerHTML=''; gradeSummary.innerHTML='<strong>Results:</strong> —'; meaning.innerHTML='';
  }

  function grade(){
    const user = { balance:fBalance.value, eyes:fEyes.value, face:fFace.value, arms:fArms.value, speech:fSpeech.value, time:fTime.value };
    const truth = {
      balance: (scenario.balance==='unsteady'||scenario.balance==='leansLeft'||scenario.balance==='leansRight') ? scenario.balance : 'normal',
      eyes: scenario.gaze,
      face: scenario.faceDroop,
      arms: scenario.armDrift,
      speech: scenario.speech,
      time: scenario.lkwMin // informational; not graded exact bucket
    };
    const fields = [['Balance','balance'],['Eyes (gaze)','eyes'],['Face','face'],['Arms','arms'],['Speech','speech']];
    gradeList.innerHTML=''; let correct=0;
    for(const [label,key] of fields){
      const li=document.createElement('li');
      if(user[key]===truth[key]){ correct++; li.innerHTML=`✅ <strong>${label}</strong> correct.`; }
      else{
        const norm=v=>v.replace('leansLeft','Leans/Falls Left').replace('leansRight','Leans/Falls Right')
                       .replace('slow','Slow pursuit').replace('none','None')
                       .replace('aphasiaExpressive','Aphasia (expressive)')
                       .replace('aphasiaReceptive','Aphasia (receptive)')
                       .replace('aphasiaGlobal','Aphasia (global/mute)')
                       .replace(/^./,c=>c.toUpperCase());
        li.innerHTML=`❌ <strong>${label}</strong> expected: <em>${norm(truth[key])}</em>.`;
      }
      gradeList.appendChild(li);
    }

    // Show Time as informational (no right/wrong)
    const timeLi = document.createElement('li');
    const onset = (truth.time<=60) ? `${truth.time} min ago` : `${Math.round(truth.time/60)} hr ago`;
    timeLi.innerHTML = `🕒 <strong>Time (LKW)</strong>: scenario LKW ≈ <em>${onset}</em>.`;
    gradeList.appendChild(timeLi);

    const befastPositives =
      (truth.balance!=='normal') +
      ((truth.eyes==='deviationLeft'||truth.eyes==='deviationRight')?1:0) +
      (truth.face!=='none') +
      (truth.arms!=='none') +
      (truth.speech!=='normal');

    const lvoCues = ((truth.eyes==='deviationLeft'||truth.eyes==='deviationRight')?1:0) + ((/aphasia/.test(truth.speech))?1:0);

    gradeSummary.innerHTML = `<strong>Results:</strong> You matched <strong>${correct}/5</strong> domains. BE-FAST positives: <strong>${befastPositives}</strong>.`;

    const lines=[];
    if(befastPositives>=1) lines.push("Concern for acute stroke. Determine LKW and activate stroke pathway.");
    if(befastPositives>=2) lines.push("Multiple positives increase stroke likelihood; consider stroke-capable destination.");
    if(lvoCues>=1) lines.push("Cortical sign(s) present (gaze deviation and/or aphasia) → possible large vessel occlusion (LVO).");
    if(befastPositives===0) lines.push("No BE-FAST findings. Consider mimics (hypoglycemia, postictal, migraine, toxicity).");
    meaning.innerHTML = `<p><strong>What this pattern can mean:</strong></p><ul>${lines.map(x=>`<li>${x}</li>`).join('')}</ul>`;
    gradeBox.hidden=false; gradeBox.scrollIntoView({behavior:'smooth',block:'start'});
  }

  /* ---------- Events ---------- */
  tabBalance.addEventListener('click', doBalance);
  tabDrift  .addEventListener('click', doDrift);
  tabFace   .addEventListener('click', doFace);
  tabEyes   .addEventListener('click', doEyes);
  tabSpeech .addEventListener('click', doSpeech);

  btnResetVisual.addEventListener('click', resetVisuals);
  btnGrade.addEventListener('click', grade);
  btnNew.addEventListener('click', newCase);
  btnResetForm.addEventListener('click', resetForm);

  // init: neutral (no active)
  newCase();
})();
</script>
</body>
</html>
