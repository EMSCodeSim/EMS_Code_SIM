<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Distal CSM & Capillary Refill | EMSCodeSim</title><link rel="stylesheet" href="/vitals/visual-assessment-suite.css?v=2318"></head><body>
<main class="va-shell"><header class="va-head"><div><small>VISUAL ASSESSMENT MINI SIM</small><h1>Distal CSM & Capillary Refill</h1></div><small>Perform → observe → document</small></header>
<section class="va-card va-stage"><div class="va-visual"><div class="va-csm"><div class="foot"><div class="pulse-dot"></div><div class="toe">🦶</div></div><div class="cap-nail" id="nail"></div></div></div><div class="va-controls"><button class="va-btn" data-step="pulse">1. Palpate distal pulse</button><button class="va-btn" data-step="sensation">2. Check sensation</button><button class="va-btn" data-step="movement">3. Check movement</button><button class="va-btn" data-step="cap">4. Press nail bed for cap refill</button></div></section>
<section id="result" class="va-card va-result">Perform the assessment to reveal findings.</section></main>
<script src="/vitals/patient-record.js"></script><script src="/vitals/scenario-definitions.js?v=2219"></script><script src="/vitals/scenario-session.js?v=5"></script><script src="/vitals/scenario-runtime.js?v=2223"></script><script src="/vitals/visual-assessment-suite.js?v=2318"></script><script>let done=new Set,pulseTimer=null;
const finding=String(VA.vital('distal_csm','Pulse present; sensation intact; movement intact; cap refill <2 seconds'));
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{done.add(b.dataset.step);b.classList.add('done');VA.click();
 if(b.dataset.step==='pulse'){clearInterval(pulseTimer);VA.pulse();pulseTimer=setInterval(VA.pulse,760);setTimeout(()=>clearInterval(pulseTimer),3200)}
 if(b.dataset.step==='cap'){let n=document.querySelector('#nail');n.classList.add('pressed');setTimeout(()=>{n.classList.remove('pressed');n.classList.add('refill')},850)}
 if(b.dataset.step==='movement')document.querySelector('.toe')?.classList.add('wiggle');
 if(done.size===4)VA.result('distal_csm','Distal CSM',finding,finding)
});</script></body></html>
