<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Distal CSM & Capillary Refill | EMSCodeSim</title><link rel="stylesheet" href="/vitals/visual-assessment-suite.css?v=2318"></head><body>
<main class="va-shell"><header class="va-head"><div><small>VISUAL ASSESSMENT MINI SIM</small><h1>Distal CSM & Capillary Refill</h1></div><small>Perform → observe → document</small></header>
<section class="va-card va-stage"><div class="va-visual"><div class="va-csm"><div class="foot"><div class="pulse-dot"></div><div class="toe">🦶</div></div><div class="cap-nail" id="nail"></div><p id="csmObservation" style="max-width:350px;margin:10px auto 0;text-align:center;font-weight:750;color:#36566a">Perform each distal neurovascular check and observe the response.</p></div></div><div class="va-controls"><button class="va-btn" data-step="pulse">1. Palpate distal pulse</button><button class="va-btn" data-step="sensation">2. Check sensation</button><button class="va-btn" data-step="movement">3. Check movement</button><button class="va-btn" data-step="cap">4. Press nail bed for cap refill</button></div></section>
<section id="result" class="va-card va-result">Complete pulse, sensation, movement, and capillary refill before documenting.</section></main>
<script src="/vitals/patient-record.js"></script><script src="/vitals/scenario-definitions.js?v=2219"></script><script src="/vitals/scenario-session.js?v=5"></script><script src="/vitals/scenario-runtime.js?v=2223"></script><script src="/vitals/visual-assessment-suite.js?v=2026.08.11.2"></script><script>let done=new Set,pulseTimer=null;
const finding=String(VA.vital('distal_csm','Pulse present; sensation intact; movement intact; cap refill <2 seconds')),lower=finding.toLowerCase();
const abnormal=/absent|decreased|weak|numb|tingl|loss of sensation|unable to move|no movement|delayed|greater than 2|>2|cool foot/.test(lower),correct=abnormal?'abnormal':'intact';
const observation=document.querySelector('#csmObservation');
function clue(step){if(step==='pulse')return /absent/.test(lower)?'No distal pulse is palpable.':/weak|decreased/.test(lower)?'A distal pulse is present but weak.':'A distinct distal pulse is palpable.';if(step==='sensation')return /numb|tingl|loss of sensation|decreased sensation/.test(lower)?'The patient reports altered distal sensation.':'The patient accurately identifies light touch distally.';if(step==='movement')return /unable to move|no movement|weak movement/.test(lower)?'Distal voluntary movement is impaired.':'The patient moves the toes/foot on command.';return /delayed|greater than 2|>2/.test(lower)?'Color return is visibly delayed beyond two seconds.':'Color returns briskly in under two seconds.'}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{done.add(b.dataset.step);b.classList.add('done');VA.click();if(observation)observation.textContent=clue(b.dataset.step);
 if(b.dataset.step==='pulse'){clearInterval(pulseTimer);VA.pulse();pulseTimer=setInterval(VA.pulse,760);setTimeout(()=>clearInterval(pulseTimer),3200)}
 if(b.dataset.step==='cap'){let n=document.querySelector('#nail');n.classList.add('pressed');setTimeout(()=>{n.classList.remove('pressed');n.classList.add('refill')},850)}
 if(b.dataset.step==='movement')document.querySelector('.toe')?.classList.add('wiggle');
 if(done.size===4)VA.interpret({key:'distal_csm',label:'Distal CSM',prompt:'How would you document distal CSM?',help:'Use the pulse, sensation, movement, and capillary-refill findings you obtained.',expectedFinding:finding,correctValue:correct,choices:[{value:'intact',label:'Distal CSM intact with brisk capillary refill'},{value:'abnormal',label:'Abnormal distal neurovascular finding present'},{value:'uncertain',label:'Unable to determine distal CSM'}]})
});</script></body></html>
