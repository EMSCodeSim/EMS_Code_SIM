<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Breath Sound Simulator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      padding: 20px;
      text-align: center;
    }

    h1 {
      color: #333;
    }

    .image-container {
      position: relative;
      display: inline-block;
      margin-top: 20px;
    }

    .image-container img {
      width: 300px;
      border-radius: 10px;
      border: 2px solid #ccc;
    }

    .button-overlay {
      position: absolute;
      background-color: rgba(0, 123, 255, 0.85);
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
    }

    .button-overlay:hover {
      background-color: rgba(0, 123, 255, 1);
    }

    #controls {
      margin: 20px;
    }

    #audio-player {
      margin-top: 30px;
    }

    #selector-panel {
      margin-top: 20px;
    }

    select {
      margin: 0 5px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <h1>Breath Sound Simulator</h1>

  <div id="controls">
    <button onclick="rotateView()">Rotate Body</button>
  </div>

  <div class="image-container" id="view-container">
    <img id="currentImage" src="front.png" alt="View">

    <!-- Front View Buttons -->
    <button class="button-overlay" style="top: 30%; left: 30%;" data-view="front" onclick="play('left')">ULL</button>
    <button class="button-overlay" style="top: 30%; right: 30%;" data-view="front" onclick="play('right')">URL</button>
    <button class="button-overlay" style="top: 65%; left: 30%;" data-view="front" onclick="play('left')">LLL</button>
    <button class="button-overlay" style="top: 65%; right: 30%;" data-view="front" onclick="play('right')">LRL</button>

    <!-- Back View Buttons -->
    <button class="button-overlay" style="top: 30%; left: 30%;" data-view="back" onclick="play('left')">ULL</button>
    <button class="button-overlay" style="top: 30%; right: 30%;" data-view="back" onclick="play('right')">URL</button>
    <button class="button-overlay" style="top: 65%; left: 30%;" data-view="back" onclick="play('left')">LLL</button>
    <button class="button-overlay" style="top: 65%; right: 30%;" data-view="back" onclick="play('right')">LRL</button>

    <!-- Right View -->
    <button class="button-overlay" style="top: 25%; left: 40%;" data-view="right" onclick="play('right')">Stridor</button>
    <button class="button-overlay" style="top: 65%; left: 40%;" data-view="right" onclick="play('right')">Midaxillary</button>

    <!-- Left View -->
    <button class="button-overlay" style="top: 25%; left: 40%;" data-view="left" onclick="play('left')">Stridor</button>
    <button class="button-overlay" style="top: 65%; left: 40%;" data-view="left" onclick="play('left')">Midaxillary</button>
  </div>

  <!-- Breath Sound Selector -->
  <div id="selector-panel">
    <label for="side">Side:</label>
    <select id="side">
      <option value="left">Left</option>
      <option value="right">Right</option>
    </select>

    <label for="sound">Breath Sound:</label>
    <select id="sound">
      <option value="normal">Normal</option>
      <option value="wheeze">Wheeze</option>
      <option value="crackles">Crackles</option>
      <option value="rhonchi">Rhonchi</option>
      <option value="stridor">Stridor</option>
    </select>
  </div>

  <div id="audio-player">
    <audio id="breathAudio" controls>
      <source src="" type="audio/mpeg">
      Your browser does not support the audio element.
    </audio>
  </div>

  <script>
    const views = ["front", "right", "back", "left"];
    const images = {
      front: "front.png",
      right: "right.png",
      back: "back.png",
      left: "left.png"
    };

    let currentViewIndex = 0;

    function rotateView() {
      currentViewIndex = (currentViewIndex + 1) % views.length;
      const view = views[currentViewIndex];
      document.getElementById("currentImage").src = images[view];
      updateButtons(view);
    }

    function updateButtons(view) {
      const allButtons = document.querySelectorAll(".button-overlay");
      allButtons.forEach(btn => {
        btn.style.display = btn.dataset.view === view ? "block" : "none";
      });
    }

    function play(side) {
      const sound = document.getElementById("sound").value;
      if (!sound) return;

      const filename = `${side}_${sound}.mp3`;  // e.g., left_wheeze.mp3
      const audio = document.getElementById("breathAudio");
      audio.src = filename;
      audio.play();
    }

    // Initialize
    updateButtons("front");
  </script>

</body>
</html>
