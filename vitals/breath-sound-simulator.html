<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Breath Sound Simulator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    h1 {
      color: #333;
    }

    .image-container {
      display: flex;
      justify-content: center;
      gap: 50px;
      margin: 30px 0;
    }

    .image-box {
      position: relative;
      display: inline-block;
    }

    .image-box img {
      width: 300px;
      border: 2px solid #ccc;
      border-radius: 10px;
    }

    .button-overlay {
      position: absolute;
      background-color: rgba(0, 123, 255, 0.7);
      color: white;
      border: none;
      padding: 5px 10px;
      cursor: pointer;
      border-radius: 5px;
      font-size: 14px;
    }

    .button-overlay:hover {
      background-color: rgba(0, 123, 255, 1);
    }

    #audio-player {
      margin-top: 30px;
    }
  </style>
</head>
<body>

  <h1>Breath Sound Simulator</h1>

  <div class="image-container">
    <div class="image-box">
      <img src="front.png" alt="Front View">
      <button class="button-overlay" style="top: 20%; left: 40%;" onclick="playSound('normal_sound.mp3')">Front Left</button>
      <button class="button-overlay" style="top: 20%; right: 40%;" onclick="playSound('normal_sound.mp3')">Front Right</button>
    </div>

    <div class="image-box">
      <img src="back.png" alt="Back View">
      <button class="button-overlay" style="top: 20%; left: 40%;" onclick="playSound('normal_sound.mp3')">Back Left</button>
      <button class="button-overlay" style="top: 20%; right: 40%;" onclick="playSound('normal_sound.mp3')">Back Right</button>
    </div>
  </div>

  <div id="audio-player">
    <audio id="breathAudio" controls>
      <source src="normal_sound.mp3" type="audio/mpeg">
      Your browser does not support the audio element.
    </audio>
  </div>

  <script>
    function playSound(src) {
      const audio = document.getElementById('breathAudio');
      audio.src = src;
      audio.play();
    }
  </script>

</body>
</html>
