<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Breath Sound Simulator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      padding: 20px;
      text-align: center;
    }

    .image-container {
      position: relative;
      display: inline-block;
      margin-top: 20px;
    }

    .image-container img {
      width: 300px;
      border-radius: 10px;
      border: 2px solid #ccc;
    }

    .button-overlay {
      position: absolute;
      background-color: rgba(0, 123, 255, 0.85);
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
    }

    .button-overlay:hover {
      background-color: rgba(0, 123, 255, 1);
    }

    #controls {
      margin-bottom: 20px;
    }

    #audio-player {
      margin-top: 30px;
    }

    select {
      margin-left: 5px;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <h1>Breath Sound Simulator</h1>

  <div id="controls">
    <button onclick="rotateView()">Rotate Body</button>
  </div>

  <div class="image-container" id="view-container">
    <img id="currentImage" src="front.png" alt="Front View">

    <!-- Example Button with Selector -->
    <div class="button-overlay" style="top: 30%; left: 30%;" data-view="front">
      URL
      <select onchange="playSound(this, 'front_url')">
        <option value="">--Sound--</option>
        <option value="normal">Normal</option>
        <option value="wheeze">Wheeze</option>
        <option value="crackles">Crackles</option>
        <option value="rhonchi">Rhonchi</option>
        <option value="stridor">Stridor</option>
      </select>
    </div>

    <div class="button-overlay" style="top: 30%; right: 30%;" data-view="front">
      ULL
      <select onchange="playSound(this, 'front_ull')">
        <option value="">--Sound--</option>
        <option value="normal">Normal</option>
        <option value="wheeze">Wheeze</option>
        <option value="crackles">Crackles</option>
        <option value="rhonchi">Rhonchi</option>
        <option value="stridor">Stridor</option>
      </select>
    </div>

    <div class="button-overlay" style="top: 65%; left: 30%;" data-view="front">
      LRL
      <select onchange="playSound(this, 'front_lrl')">
        <option value="">--Sound--</option>
        <option value="normal">Normal</option>
        <option value="wheeze">Wheeze</option>
        <option value="crackles">Crackles</option>
        <option value="rhonchi">Rhonchi</option>
        <option value="stridor">Stridor</option>
      </select>
    </div>

    <div class="button-overlay" style="top: 65%; right: 30%;" data-view="front">
      LLL
      <select onchange="playSound(this, 'front_lll')">
        <option value="">--Sound--</option>
        <option value="normal">Normal</option>
        <option value="wheeze">Wheeze</option>
        <option value="crackles">Crackles</option>
        <option value="rhonchi">Rhonchi</option>
        <option value="stridor">Stridor</option>
      </select>
    </div>

    <!-- Add similar blocks for 'back', 'left', and 'right' if needed -->
  </div>

  <div id="audio-player">
    <audio id="breathAudio" controls>
      <source src="" type="audio/mpeg">
      Your browser does not support the audio element.
    </audio>
  </div>

  <script>
    const views = ["front", "right", "back", "left"];
    const images = {
      front: "front.png",
      right: "right.png",
      back: "back.png",
      left: "left.png"
    };

    let currentViewIndex = 0;

    function rotateView() {
      currentViewIndex = (currentViewIndex + 1) % views.length;
      const view = views[currentViewIndex];
      document.getElementById("currentImage").src = images[view];
      updateButtons(view);
    }

    function updateButtons(view) {
      const all = document.querySelectorAll(".button-overlay");
      all.forEach(el => {
        el.style.display = el.dataset.view === view ? "block" : "none";
      });
    }

    function playSound(selectElem, baseName) {
      const type = selectElem.value;
      if (!type) return;

      const file = `${baseName}_${type}.mp3`;
      const audio = document.getElementById('breathAudio');
      audio.src = file;
      audio.play();
    }

    // Init
    updateButtons("front");
  </script>

</body>
</html>
