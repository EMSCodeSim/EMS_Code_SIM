<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Visual Airway Assessment | EMSCodeSim</title><link rel="stylesheet" href="/vitals/visual-assessment-suite.css?v=2318"></head><body>
<main class="va-shell"><header class="va-head"><div><small>VISUAL ASSESSMENT MINI SIM</small><h1>Visual Airway Assessment</h1></div><small>Perform → observe → document</small></header>
<section class="va-card va-stage"><div class="va-visual"><div><div class="va-airway">🗣️</div><div style="text-align:center"><span class="sound-chip">speech</span><span class="sound-chip">snoring</span><span class="sound-chip">gurgling</span><span class="sound-chip">stridor</span></div><p id="airwayObservation" style="max-width:340px;margin:10px auto 0;text-align:center;font-weight:750;color:#36566a">Assess each airway feature. Findings appear here as you perform the exam.</p></div></div><div class="va-controls"><button class="va-btn" data-a="speak">Can the patient speak?</button><button class="va-btn" data-a="look">Look for obstruction / blood / vomit</button><button class="va-btn" data-a="listen">Listen for abnormal airway sounds</button><button class="va-btn" data-a="protect">Can the patient protect the airway?</button></div></section>
<section id="result" class="va-card va-result">Perform all four airway checks before documenting your finding.</section></main>
<script src="/vitals/patient-record.js"></script><script src="/vitals/scenario-definitions.js?v=2219"></script><script src="/vitals/scenario-session.js?v=5"></script><script src="/vitals/scenario-runtime.js?v=2223"></script><script src="/vitals/visual-assessment-suite.js?v=2026.08.14.1"></script><script>let s=new Set;
const finding=String(VA.vital('airway','Patent')),lower=finding.toLowerCase();
const threatened=/not patent|obstruct|threat|stridor|gurg|snor|unable to protect|cannot protect/.test(lower);
const correct=threatened?'threatened':'patent';
const observation=document.querySelector('#airwayObservation');
function airwaySound(){if(lower.includes('stridor')){VA.tone(720,.7,.035,'sawtooth');return 'A harsh high-pitched inspiratory sound is audible.'}if(lower.includes('snor')){VA.tone(95,.55,.055,'sine');return 'Low-pitched snoring respirations are audible.'}if(lower.includes('gurg')){VA.tone(145,.45,.035,'triangle');return 'Wet gurgling is audible in the airway.'}VA.tone(310,.10,.018,'sine');return 'No snoring, gurgling, or stridor is heard.'}
function clue(kind){if(kind==='speak')return threatened?'Speech is limited or altered by the airway problem.':'The patient answers you clearly in a full sentence.';if(kind==='look')return threatened?'Your airway inspection identifies a visible or functional airway concern.':'No blood, vomit, foreign body, or visible obstruction is seen.';if(kind==='protect')return threatened?'The patient cannot be assumed to reliably protect the airway.':'The patient handles secretions and follows commands appropriately.';return airwaySound()}
document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{s.add(b.dataset.a);b.classList.add('done');VA.click();if(b.dataset.a==='speak')document.querySelector('.va-airway')?.classList.add('speaking');if(observation)observation.textContent=clue(b.dataset.a);if(s.size===4)VA.interpret({key:'airway',label:'Airway',prompt:'How would you document the airway?',help:'Base your choice on speech, visual inspection, sounds, and airway protection.',expectedFinding:finding,correctValue:correct,choices:[{value:'patent',label:'Airway patent; no immediate airway threat'},{value:'threatened',label:'Airway threatened or obstructed'},{value:'uncertain',label:'Not enough information to classify the airway'}]})});</script></body></html>
