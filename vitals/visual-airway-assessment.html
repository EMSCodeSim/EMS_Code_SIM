<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Visual Airway Assessment | EMSCodeSim</title><link rel="stylesheet" href="/vitals/visual-assessment-suite.css?v=2312"></head><body>
<main class="va-shell"><header class="va-head"><div><small>VISUAL ASSESSMENT MINI SIM</small><h1>Visual Airway Assessment</h1></div><small>Perform → observe → document</small></header>
<section class="va-card va-stage"><div class="va-visual"><div><div class="va-airway">🗣️</div><div style="text-align:center"><span class="sound-chip">speech</span><span class="sound-chip">snoring</span><span class="sound-chip">gurgling</span><span class="sound-chip">stridor</span></div></div></div><div class="va-controls"><button class="va-btn" data-a="speak">Can the patient speak?</button><button class="va-btn" data-a="look">Look for obstruction / blood / vomit</button><button class="va-btn" data-a="listen">Listen for abnormal airway sounds</button><button class="va-btn" data-a="protect">Can the patient protect the airway?</button></div></section>
<section id="result" class="va-card va-result">Perform the assessment to reveal findings.</section></main>
<script src="/vitals/patient-record.js"></script><script src="/vitals/visual-assessment-suite.js?v=2312"></script><script>let s=new Set;document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{s.add(b.dataset.a);b.classList.add('done');if(s.size===4)VA.result('airway','Airway','Patent','Patient speaks clearly; no obstruction, secretions, snoring, gurgling, or stridor.');});</script></body></html>
