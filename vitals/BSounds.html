<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breath Sound Simulator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="simulator-container">
        <h1>Breath Sound Simulator</h1>

        <!-- View toggle for Anterior and Posterior -->
        <div class="view-toggle">
            <button id="anteriorBtn">Anterior View</button>
            <button id="posteriorBtn">Posterior View</button>
        </div>

        <!-- Diagram container where images will be shown -->
        <div class="diagram-container">
            <img id="chestImage" src="front.jpg" alt="Anterior Chest View" class="chest-img" />
        </div>

        <!-- Sound Controls -->
        <div class="controls">
            <div class="sound-controls">
                <label for="soundType">Select Sound: </label>
                <select id="soundType">
                    <option value="normal">Normal</option>
                    <option value="stridor">Stridor</option>
                    <option value="wheezing">Wheezing</option>
                    <!-- Add more sound options as needed -->
                </select>

                <label for="volume">Volume: </label>
                <input type="range" id="volume" min="0" max="100" value="50">

                <button id="playSoundBtn">Play Sound</button>
                <button id="pauseSoundBtn">Pause Sound</button>
            </div>
        </div>
    </div>

    <footer>
        <p>Instructions: Click on a lung area to listen to breath sounds.</p>
        <button id="resetBtn">Reset Simulation</button>
    </footer>

    <script src="app.js"></script>
</body>
</html>
