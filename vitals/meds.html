<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EMS Trainer – The 5 Rights of Medication Administration</title>
<style>
  :root{
    --bg:#f6f9fc; --card:#fff; --ink:#122230; --muted:#637589; --accent:#0a76d3;
    --ok:#16a34a; --no:#dc2626; --border:#e6edf3;
  }
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,"Helvetica Neue",sans-serif}
  .wrap{max-width:980px;margin:0 auto;padding:16px;display:grid;gap:12px}
  header{position:sticky;top:0;z-index:10;background:linear-gradient(180deg,#0a76d3,#095fb0);color:#fff;border-radius:14px;padding:14px 16px;box-shadow:0 6px 16px rgba(10,30,60,.15)}
  h1{margin:0;font-size:1.15rem}
  .row{display:grid;gap:12px}
  @media(min-width:900px){ .row{grid-template-columns:1.1fr .9fr} }
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:0 2px 10px rgba(10,20,40,.05)}
  .card h2{margin:0;font-size:1rem;border-bottom:1px solid var(--border);padding:12px}
  .card .body{padding:12px}
  .scenario{line-height:1.45}
  .pill{display:inline-block;background:#eef6ff;border:1px solid #d9e9fb;color:#0a3a7a;border-radius:999px;padding:4px 10px;font-weight:700}
  .grid{display:grid;gap:10px}
  .form{display:grid;gap:10px}
  .form label{font-size:.9rem;font-weight:700}
  select{width:100%;padding:.6rem .7rem;border-radius:10px;border:1px solid var(--border);background:#fff}
  .btns{display:flex;gap:8px;flex-wrap:wrap}
  button{appearance:none;border:1px solid var(--border);background:#fff;color:var(--ink);padding:10px 12px;border-radius:12px;font-weight:700;cursor:pointer}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button:active{transform:translateY(1px)}
  .results .line{padding:8px 10px;border-radius:10px;border:1px solid var(--border);background:#f8fafc}
  .good{border-color:#bbf7d0;background:#f0fdf4}
  .bad{border-color:#fecaca;background:#fff1f2}
  .muted{color:var(--muted)}
  .flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  @media(max-width:600px){ .split{grid-template-columns:1fr} }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Medication Administration Trainer — The 5 Rights</h1>
    </header>

    <div class="row">
      <section class="card">
        <h2>Scenario</h2>
        <div class="body">
          <div id="scenario" class="scenario"></div>
          <div class="flex" style="margin-top:8px">
            <span class="pill" id="vitalsPill"></span>
            <span class="pill" id="ordersPill"></span>
            <span class="pill" id="allergyPill"></span>
          </div>
        </div>
      </section>

      <section class="card">
        <h2>Your 5 Rights</h2>
        <div class="body">
          <div class="form">
            <div>
              <label for="rightPatient">Right Patient</label>
              <select id="rightPatient">
                <option value="">— choose —</option>
              </select>
            </div>

            <div>
              <label for="rightMed">Right Medication</label>
              <select id="rightMed">
                <option value="">— choose —</option>
                <option>Aspirin (chewable)</option>
                <option>Nitroglycerin (SL)</option>
                <option>Albuterol (MDI)</option>
                <option>Epinephrine (auto-injector)</option>
                <option>Oral Glucose (gel)</option>
                <option>Naloxone (IN)</option>
              </select>
            </div>

            <div class="split">
              <div>
                <label for="rightDose">Right Dose</label>
                <select id="rightDose">
                  <option value="">— choose —</option>
                  <!-- Will be loaded with context-relevant options -->
                </select>
              </div>
              <div>
                <label for="rightRoute">Right Route</label>
                <select id="rightRoute">
                  <option value="">— choose —</option>
                  <option>PO (by mouth)</option>
                  <option>SL (sublingual)</option>
                  <option>IM (intramuscular)</option>
                  <option>IN (intranasal)</option>
                  <option>Inhalation (MDI)</option>
                </select>
              </div>
            </div>

            <div>
              <label for="rightTime">Right Time</label>
              <select id="rightTime">
                <option value="">— choose —</option>
                <option>Now</option>
                <option>Repeat in 2 minutes</option>
                <option>Repeat in 5 minutes</option>
                <option>Hold & consult medical control</option>
                <option>After food</option>
              </select>
            </div>

            <div class="btns" style="margin-top:6px">
              <button class="primary" id="btnSubmit">Submit</button>
              <button id="btnNew">New Scenario</button>
              <button id="btnReset">Reset Choices</button>
            </div>
          </div>
        </div>
      </section>
    </div>

    <section class="card">
      <h2>Results</h2>
      <div class="body results" id="results" aria-live="polite">
        <div class="muted">Pick your answers and hit <strong>Submit</strong> to see feedback.</div>
      </div>
    </section>
  </div>

<script>
(function(){
  const $ = s => document.querySelector(s);
  const scenarioBox = $('#scenario');
  const vitalsPill = $('#vitalsPill');
  const ordersPill = $('#ordersPill');
  const allergyPill = $('#allergyPill');

  const selPatient = $('#rightPatient');
  const selMed = $('#rightMed');
  const selDose = $('#rightDose');
  const selRoute = $('#rightRoute');
  const selTime = $('#rightTime');

  const btnSubmit = $('#btnSubmit');
  const btnNew = $('#btnNew');
  const btnReset = $('#btnReset');
  const results = $('#results');

  // ————— Scenarios —————
  // Each scenario defines the correct "5 rights" and the distractors we’ll populate.
  const SCENARIOS = [
    {
      id: 'aspirin',
      title: '55-year-old with crushing substernal chest pain (8/10), onset 20 minutes ago.',
      vitals: 'HR 96, BP 138/84, RR 18, SpO₂ 98%',
      orders: 'No aspirin today. Not on anticoagulants. No active bleeding. No true allergy to aspirin.',
      allergies: 'NKDA',
      patients: makePatients('Pat Morgan'),
      rights: {
        patient: 'Pat Morgan',
        med: 'Aspirin (chewable)',
        dose: '324 mg (4 x 81 mg chewable)',
        route: 'PO (by mouth)',
        time: 'Now'
      },
      doseOptions: ['162 mg (2 x 81 mg)', '324 mg (4 x 81 mg chewable)', '650 mg', '0.4 mg'],
      notes: 'Indication: suspected cardiac chest pain with no aspirin contraindication.'
    },
    {
      id: 'nitro',
      title: '64-year-old with pressure-like chest pain radiating to jaw. Has Rx Nitroglycerin.',
      vitals: 'HR 84, BP 132/86, RR 16, SpO₂ 97%',
      orders: 'No ED meds in last 48h. No head injury. Assist with own Nitro as needed.',
      allergies: 'NKDA',
      patients: makePatients('Jamie Chen'),
      rights: {
        patient: 'Jamie Chen',
        med: 'Nitroglycerin (SL)',
        dose: '0.4 mg tablet/spray',
        route: 'SL (sublingual)',
        time: 'Now'
      },
      doseOptions: ['0.3 mg', '0.4 mg tablet/spray', '324 mg', '1 mg IM'],
      notes: 'Assist with patient’s Nitro if BP adequate and no ED drugs.'
    },
    {
      id: 'albuterol',
      title: '28-year-old with wheezing and difficulty speaking full sentences. Has Albuterol MDI.',
      vitals: 'HR 104, BP 122/78, RR 26, SpO₂ 92%',
      orders: 'Assist with prescribed inhaler.',
      allergies: 'NKDA',
      patients: makePatients('Riley Thompson'),
      rights: {
        patient: 'Riley Thompson',
        med: 'Albuterol (MDI)',
        dose: '1–2 puffs (90 mcg each)',
        route: 'Inhalation (MDI)',
        time: 'Now'
      },
      doseOptions: ['1 puff', '1–2 puffs (90 mcg each)', '0.4 mg', '324 mg'],
      notes: 'Bronchospasm with patient’s own MDI; assist per protocol.'
    },
    {
      id: 'epi',
      title: '19-year-old with hives, wheeze, hypotension after peanut exposure.',
      vitals: 'HR 128, BP 86/58, RR 28, SpO₂ 90%',
      orders: 'Severe allergic reaction with airway/ perfusion threat.',
      allergies: 'Peanuts',
      patients: makePatients('Alex Rivera'),
      rights: {
        patient: 'Alex Rivera',
        med: 'Epinephrine (auto-injector)',
        dose: '0.3 mg adult IM',
        route: 'IM (intramuscular)',
        time: 'Now'
      },
      doseOptions: ['0.15 mg pediatric IM', '0.3 mg adult IM', '324 mg', '2 mg IN'],
      notes: 'Life threat → Epi IM immediately.'
    },
    {
      id: 'glucose',
      title: '72-year-old confused and diaphoretic; glucometer reads 52 mg/dL; can swallow.',
      vitals: 'HR 92, BP 130/76, RR 18, SpO₂ 98%',
      orders: 'Airway protected; patient follows simple commands.',
      allergies: 'NKDA',
      patients: makePatients('Casey Patel'),
      rights: {
        patient: 'Casey Patel',
        med: 'Oral Glucose (gel)',
        dose: '15–25 g buccal',
        route: 'PO (by mouth)',
        time: 'Now'
      },
      doseOptions: ['5 g', '15–25 g buccal', '0.4 mg', '2 mg IN'],
      notes: 'Hypoglycemia with intact gag/swallow → oral glucose.'
    },
    {
      id: 'naloxone',
      title: '35-year-old apneic with pinpoint pupils; bradypneic after stimulation.',
      vitals: 'HR 68, BP 118/70, RR 6 shallow, SpO₂ 86%',
      orders: 'Suspected opioid overdose; BVM support started.',
      allergies: 'NKDA',
      patients: makePatients('Jordan Lee'),
      rights: {
        patient: 'Jordan Lee',
        med: 'Naloxone (IN)',
        dose: '2 mg IN (1 mg each nostril)',
        route: 'IN (intranasal)',
        time: 'Now'
      },
      doseOptions: ['0.4 mg IM', '2 mg IN (1 mg each nostril)', '324 mg', '0.3 mg IM'],
      notes: 'Opioid toxidrome → Naloxone; ventilate first if needed.'
    }
  ];

  let current = null;

  function makePatients(correctName){
    // Return two names: correct + 1 decoy
    const names = [
      'Taylor Brooks','Sam Ortiz','Morgan Diaz','Avery Nguyen',
      'Hunter James','Jordan Lee','Alex Rivera','Casey Patel',
      'Pat Morgan','Riley Thompson','Jamie Chen'
    ];
    let decoy = names[Math.floor(Math.random()*names.length)];
    while(decoy === correctName) decoy = names[Math.floor(Math.random()*names.length)];
    return [correctName, decoy].sort(()=>Math.random()-0.5);
  }

  function newScenario(){
    current = JSON.parse(JSON.stringify(SCENARIOS[Math.floor(Math.random()*SCENARIOS.length)]));

    // Render scenario text
    scenarioBox.innerHTML = `
      <p><strong>Chief complaint:</strong> ${current.title}</p>
      <p class="muted" style="margin:.25rem 0 0 0"><em>Make selections for the 5 Rights based on this presentation.</em></p>
    `;
    vitalsPill.textContent = current.vitals;
    ordersPill.textContent = 'Notes: ' + current.orders;
    allergyPill.textContent = 'Allergies: ' + current.allergies;

    // Populate patient choices
    selPatient.innerHTML = `<option value="">— choose —</option>` +
      current.patients.map(n=>`<option>${n}</option>`).join('');

    // Reset other selects
    selMed.value = '';
    selDose.innerHTML = `<option value="">— choose —</option>` +
      current.doseOptions.map(d=>`<option>${d}</option>`).join('');
    selRoute.value = '';
    selTime.value = '';

    results.innerHTML = `<div class="muted">Pick your answers and hit <strong>Submit</strong> to see feedback.</div>`;
  }

  // Helpful mapping from medication to best route & dose to validate partial correctness
  const MED_CANON = {
    'Aspirin (chewable)': { route: 'PO (by mouth)', dose: '324 mg (4 x 81 mg chewable)'},
    'Nitroglycerin (SL)': { route: 'SL (sublingual)', dose: '0.4 mg tablet/spray'},
    'Albuterol (MDI)': { route: 'Inhalation (MDI)', dose: '1–2 puffs (90 mcg each)'},
    'Epinephrine (auto-injector)': { route: 'IM (intramuscular)', dose: '0.3 mg adult IM'},
    'Oral Glucose (gel)': { route: 'PO (by mouth)', dose: '15–25 g buccal'},
    'Naloxone (IN)': { route: 'IN (intranasal)', dose: '2 mg IN (1 mg each nostril)'}
  };

  function assess(){
    if(!current) return;

    const user = {
      patient: selPatient.value,
      med: selMed.value,
      dose: selDose.value,
      route: selRoute.value,
      time: selTime.value
    };
    const key = current.rights;

    function line(ok, label, expected, got, extraNote=''){
      const cls = ok ? 'good' : 'bad';
      const icon = ok ? '✅' : '❌';
      return `<div class="line ${cls}">
        <strong>${icon} ${label}:</strong> ${ok ? 'Correct' : 'Incorrect'}<br/>
        ${!ok ? `<span class="muted">Your choice:</span> ${got || '—'}<br/>` : ''}
        <span class="muted">Expected:</span> ${expected}
        ${extraNote ? `<div class="muted" style="margin-top:4px">${extraNote}</div>` : ''}
      </div>`;
    }

    // Determine correctness
    const patientOK = user.patient && user.patient === key.patient;
    const medOK = user.med && user.med === key.med;
    const doseOK = user.dose && user.dose === key.dose;
    const routeOK = user.route && user.route === key.route;
    const timeOK = user.time && user.time === key.time;

    // Helpful targeted explanations if med is right but dose/route wrong, or vice versa
    let medHint = '';
    if(medOK && (!doseOK || !routeOK)){
      const canon = MED_CANON[user.med];
      if(canon){
        const wrongPieces = [];
        if(!doseOK) wrongPieces.push(`dose is typically <strong>${canon.dose}</strong>`);
        if(!routeOK) wrongPieces.push(`route is <strong>${canon.route}</strong>`);
        medHint = `For <strong>${user.med}</strong>, ${wrongPieces.join(' and ')}.`;
      }
    }

    let timeHint = '';
    if(!timeOK){
      // Simple logic: these initial administrations should be "Now";
      // “Repeat in 5 minutes” is appropriate for Nitro follow-ups, but the first dose here is "Now".
      timeHint = (current.id === 'nitro')
        ? 'First SL Nitro dose is given <strong>now</strong> if not contraindicated; repeats may occur every 5 minutes per protocol.'
        : 'Initial administration is indicated <strong>now</strong> for this presentation.';
    }

    const blocks = [
      line(patientOK, 'Right Patient', key.patient, user.patient || ''),
      line(medOK, 'Right Medication', key.med, user.med || '', medHint),
      line(doseOK, 'Right Dose', key.dose, user.dose || ''),
      line(routeOK, 'Right Route', key.route, user.route || ''),
      line(timeOK, 'Right Time', key.time, user.time || '', timeHint)
    ];

    const score = [patientOK,medOK,doseOK,routeOK,timeOK].filter(Boolean).length;

    results.innerHTML = `
      <p><strong>Score:</strong> ${score}/5</p>
      ${blocks.join('')}
      <div class="muted" style="margin-top:8px">
        <strong>Rationale:</strong> ${current.notes}
      </div>
    `;
  }

  btnSubmit.addEventListener('click', assess);
  btnNew.addEventListener('click', newScenario);
  btnReset.addEventListener('click', ()=>{
    if(!current) return;
    selPatient.value = '';
    selMed.value = '';
    selDose.innerHTML = `<option value="">— choose —</option>` + current.doseOptions.map(d=>`<option>${d}</option>`).join('');
    selRoute.value = '';
    selTime.value = '';
    results.innerHTML = `<div class="muted">Choices cleared. Submit when ready.</div>`;
  });

  // Initialize
  newScenario();
})();
</script>
</body>
</html>
