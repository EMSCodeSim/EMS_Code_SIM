<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BP Simulator</title>
  <style>
    body {
      text-align: center;
      font-family: Arial;
      background: #f0f0f0;
    }
    #dial {
      position: relative;
      width: 300px;
      height: 300px;
      margin: 20px auto;
    }
    #dial img {
      width: 100%;
      height: 100%;
    }
    #needle {
      position: absolute;
      width: 6px;
      height: 140px;
      background: red;
      top: 10px;
      left: 50%;
      transform-origin: bottom center;
      transform: rotate(-135deg); /* Start at 0 (bottom) */
    }
    #controls {
      margin-top: 20px;
    }
    button {
      font-size: 18px;
      padding: 10px 20px;
      margin: 5px;
    }
    #bpDisplay {
      font-size: 24px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>Blood Pressure Simulator</h1>
  <div id="dial">
    <img src="bp_dial.png" alt="Dial">
    <div id="needle"></div>
  </div>
  <div id="controls">
    <button onclick="pump()">Pump</button>
    <button onclick="release()">Release Pressure</button>
  </div>
  <div id="bpDisplay"></div>

  <script>
    const needle = document.getElementById("needle");
    const bpDisplay = document.getElementById("bpDisplay");

    let currentPressure = 0;
    let interval;
    let systolic = 120;
    let diastolic = 80;
    let releasing = false;

    // Web Audio API
    const bpm = 90;
    const beatInterval = 60000 / bpm;
    let audioCtx;
    let beatTimer;

    function startSound() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      stopSound();
      beatTimer = setInterval(() => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(200, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
      }, beatInterval);
    }

    function stopSound() {
      clearInterval(beatTimer);
    }

    function updateNeedle(pressure) {
      const angle = (pressure / 280) * 270 - 135;
      needle.style.transform = `rotate(${angle}deg)`;
    }

    function pump() {
      stopSound();
      releasing = false;
      if (currentPressure < 280) {
        currentPressure += 10;
        updateNeedle(currentPressure);
        bpDisplay.textContent = `Pressure: ${currentPressure} mmHg`;
      }
    }

    function release() {
      // Generate BP
      systolic = Math.floor(Math.random() * (222 - 80 + 1)) + 80;
      const minDia = Math.floor(systolic * 0.5);
      const maxDia = Math.floor(systolic * 0.75);
      diastolic = Math.floor(Math.random() * (maxDia - minDia + 1)) + minDia;

      bpDisplay.textContent = `BP: ${systolic}/${diastolic}`;
      releasing = true;

      if (interval) clearInterval(interval);
      interval = setInterval(() => {
        if (!releasing) return;
        currentPressure -= 0.5;
        if (currentPressure < 0) {
          currentPressure = 0;
          clearInterval(interval);
          stopSound();
        }

        updateNeedle(currentPressure);

        if (currentPressure <= systolic && currentPressure >= diastolic) {
          if (!beatTimer) startSound();
        } else {
          stopSound();
        }

      }, 25);
    }
  </script>
</body>
</html>
