<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Blood Pressure Simulator</title>
  <style>
    body {
      text-align: center;
      font-family: Arial, sans-serif;
      background-color: #f3f3f3;
    }

    #gauge-container {
      position: relative;
      width: 300px;
      height: 300px;
      margin: 20px auto;
    }

    #dial {
      width: 100%;
      display: block;
    }

    #needle {
      position: absolute;
      width: 4px;
      height: 140px;
      background: red;
      top: 50%;
      left: 50%;
      transform-origin: bottom center;
      transform: rotate(180deg);
      transition: transform 0.1s linear;
      z-index: 2;
      margin-left: -2px;
      margin-top: -140px;
    }

    button, input[type="range"] {
      margin: 10px;
      padding: 10px 20px;
      font-size: 1rem;
    }

    #pressureDisplay {
      font-size: 1.2rem;
      margin-top: 10px;
    }

    #bpReading {
      font-weight: bold;
      font-size: 1rem;
    }

    #deflationSpeedLabel {
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Blood Pressure Simulator</h1>

  <div id="gauge-container">
    <img id="dial" src="bp_dial.png" alt="Gauge Dial">
    <div id="needle"></div>
  </div>

  <div id="pressureDisplay">Pressure: 0 mmHg</div>
  <div id="bpReading"></div>

  <button onclick="pump()">Pump</button>
  <button onclick="release()">Release Pressure</button>

  <div>
    <label id="deflationSpeedLabel">Deflation Speed: <span id="speedValue">0.5</span> mmHg/step</label><br/>
    <input type="range" id="speedSlider" min="0.2" max="5" step="0.1" value="0.5" oninput="updateSpeedDisplay(this.value)">
  </div>

  <script>
    let currentPressure = 0;
    let systolic = 120;
    let diastolic = 80;
    const needle = document.getElementById("needle");
    const pressureDisplay = document.getElementById("pressureDisplay");
    const bpReading = document.getElementById("bpReading");
    const speedValueText = document.getElementById("speedValue");
    const speedSlider = document.getElementById("speedSlider");

    let releaseInterval;
    let beatInterval;
    let beatStarted = false;
    const beatAudio = new AudioContext();

    function updateNeedle() {
      // Correct clockwise mapping:
      // 0 mmHg => 180°, 140 mmHg => 0°, 280 mmHg => -180°
      const angle = 180 - (currentPressure / 280) * 360;
      needle.style.transform = `rotate(${angle}deg)`;
      pressureDisplay.textContent = `Pressure: ${Math.round(currentPressure)} mmHg`;
    }

    function pump() {
      clearInterval(releaseInterval);
      if (currentPressure < 280) {
        currentPressure += 10;
        if (currentPressure > 280) currentPressure = 280;
        updateNeedle();
      }
    }

    function release() {
      clearInterval(releaseInterval);
      systolic = Math.floor(Math.random() * (222 - 80 + 1)) + 80;
      diastolic = Math.floor(systolic * 0.65);
      bpReading.textContent = `Set BP: ${systolic}/${diastolic}`;

      const deflationSpeed = parseFloat(speedSlider.value);

      releaseInterval = setInterval(() => {
        if (currentPressure <= 0) {
          clearInterval(releaseInterval);
          stopHeartbeat();
          bpReading.textContent = '';
        } else {
          currentPressure -= deflationSpeed;
          if (currentPressure < 0) currentPressure = 0;
          updateNeedle();

          if (Math.round(currentPressure) === systolic && !beatStarted) {
            startHeartbeat();
          }

          if (Math.round(currentPressure) <= diastolic && beatStarted) {
            stopHeartbeat();
          }
        }
      }, 100);
    }

    function startHeartbeat() {
      beatStarted = true;
      beatInterval = setInterval(playBeat, 666); // 90 bpm
    }

    function stopHeartbeat() {
      clearInterval(beatInterval);
      beatStarted = false;
    }

    function playBeat() {
      let osc = beatAudio.createOscillator();
      let gain = beatAudio.createGain();
      osc.connect(gain);
      gain.connect(beatAudio.destination);
      osc.frequency.setValueAtTime(1000, beatAudio.currentTime);
      gain.gain.setValueAtTime(1, beatAudio.currentTime);
      osc.start();
      osc.stop(beatAudio.currentTime + 0.15); // louder and longer pulse
    }

    function updateSpeedDisplay(val) {
      speedValueText.textContent = val;
    }

    updateNeedle(); // Initialize
  </script>
</body>
</html>
