<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Blood Pressure Simulator</title>
  <style>
    body {
      background-color: #eef7ff;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    h1 {
      color: #333;
    }
    #dial-container {
      position: relative;
      width: 300px;
      height: 300px;
      margin: 30px auto;
    }
    #dial {
      width: 100%;
    }
    #needle {
      position: absolute;
      width: 6px;
      height: 140px;
      background-color: red;
      top: 30px;
      left: 50%;
      transform-origin: bottom center;
      transform: rotate(0deg);
    }
    button {
      padding: 12px 24px;
      margin: 10px;
      font-size: 16px;
      cursor: pointer;
      background-color: #007acc;
      color: white;
      border: none;
      border-radius: 5px;
    }
    #bp-display {
      font-size: 20px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>Blood Pressure Simulator</h1>
  <div id="dial-container">
    <img src="bp_dial.png" id="dial" />
    <div id="needle"></div>
  </div>
  <button onclick="pump()">Pump</button>
  <button onclick="releasePressure()">Release Pressure</button>
  <div id="bp-display">Set BP: --/--</div>

  <script>
    const needle = document.getElementById("needle");
    const bpDisplay = document.getElementById("bp-display");

    let pressure = 0;
    let systolic = 0;
    let diastolic = 0;
    let currentPressure = 0;
    let releasing = false;
    let beatInterval = 60 / 90; // 90 bpm
    let audioCtx = null;

    function rotateNeedle(value) {
      const angle = (value / 280) * 270 - 135; // Map 0–280 mmHg to -135 to +135 degrees
      needle.style.transform = `rotate(${angle}deg)`;
    }

    function pump() {
      if (releasing) return;
      pressure += 10;
      if (pressure > 280) pressure = 280;
      rotateNeedle(pressure);
    }

    function releasePressure() {
      if (releasing) return;
      releasing = true;

      systolic = getRandomInt(80, 222);
      diastolic = getRandomInt(40, Math.min(systolic - 20, 100));
      bpDisplay.textContent = `Set BP: ${systolic}/${diastolic}`;
      currentPressure = pressure;
      playHeartSoundLoop();

      const interval = setInterval(() => {
        currentPressure -= 1;
        if (currentPressure <= 0) {
          currentPressure = 0;
          clearInterval(interval);
          releasing = false;
        }
        rotateNeedle(currentPressure);
      }, 40);
    }

    function playHeartSoundLoop() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const now = audioCtx.currentTime;
      const beats = 30;
      for (let i = 0; i < beats; i++) {
        const start = now + i * beatInterval;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = 660;
        gain.gain.setValueAtTime(1, start);
        gain.gain.exponentialRampToValueAtTime(0.01, start + 0.1);
        osc.connect(gain).connect(audioCtx.destination);
        if (systolic >= currentPressure - 1 && systolic <= currentPressure + 1) {
          osc.start(start);
          osc.stop(start + 0.1);
        }
        if (diastolic >= currentPressure - 1 && diastolic <= currentPressure + 1) {
          osc.start(start);
          osc.stop(start + 0.1);
        }
      }
    }

    function getRandomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }
  </script>
</body>
</html>
