<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Blood Pressure Simulator</title>
  <style>
    body {
      text-align: center;
      font-family: Arial, sans-serif;
      background-color: #eef2f3;
    }

    #gauge-container {
      position: relative;
      width: 300px;
      margin: 20px auto;
    }

    #dial {
      width: 100%;
    }

    #needle {
      position: absolute;
      width: 6px;
      height: 140px;
      background: red;
      top: 30px;
      left: 147px;
      transform-origin: bottom center;
      transform: rotate(180deg); /* Start at 0 (pointing down) */
      transition: transform 0.2s linear;
      z-index: 2;
    }

    button {
      margin: 10px;
      padding: 10px 20px;
      font-size: 1rem;
    }

    #pressureDisplay {
      font-size: 1.2rem;
      margin-top: 10px;
    }

    #bpReading {
      margin-top: 5px;
      font-weight: bold;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <h1>Blood Pressure Simulator</h1>

  <div id="gauge-container">
    <img id="dial" src="bp_dial.png" alt="Gauge Dial">
    <div id="needle"></div>
  </div>

  <div id="pressureDisplay">Pressure: 0 mmHg</div>
  <div id="bpReading"></div>

  <button onclick="pump()">Pump</button>
  <button onclick="release()">Release Pressure</button>

  <script>
    let currentPressure = 0;
    let needle = document.getElementById("needle");
    let pressureDisplay = document.getElementById("pressureDisplay");
    let bpReading = document.getElementById("bpReading");
    let releaseInterval;
    let systolic = 120;
    let diastolic = 80;
    let beatInterval;
    let beatAudio = new AudioContext();
    let beatStarted = false;

    function updateNeedle() {
      // Map 0–280 mmHg to 0–360 degrees starting at 180 degrees (bottom)
      let angle = 180 - (currentPressure / 280) * 360;
      needle.style.transform = `rotate(${angle}deg)`;
      pressureDisplay.textContent = `Pressure: ${Math.round(currentPressure)} mmHg`;
    }

    function pump() {
      clearInterval(releaseInterval);
      if (currentPressure < 280) {
        currentPressure += 10;
        updateNeedle();
      }
    }

    function release() {
      clearInterval(releaseInterval);
      systolic = Math.floor(Math.random() * (222 - 80 + 1)) + 80;
      diastolic = Math.floor(systolic * 0.65);
      bpReading.textContent = `Set BP: ${systolic}/${diastolic}`;

      releaseInterval = setInterval(() => {
        if (currentPressure <= 0) {
          clearInterval(releaseInterval);
          stopHeartbeat();
          bpReading.textContent = '';
        } else {
          currentPressure -= 0.5;
          updateNeedle();
          if (Math.round(currentPressure) === systolic && !beatStarted) {
            startHeartbeat();
          }
          if (Math.round(currentPressure) === diastolic && beatStarted) {
            stopHeartbeat();
          }
        }
      }, 20);
    }

    function playBeat() {
      let osc = beatAudio.createOscillator();
      let gain = beatAudio.createGain();
      osc.connect(gain);
      gain.connect(beatAudio.destination);
      osc.frequency.setValueAtTime(1000, beatAudio.currentTime);
      gain.gain.setValueAtTime(1, beatAudio.currentTime);
      osc.start();
      osc.stop(beatAudio.currentTime + 0.1);
    }

    function startHeartbeat() {
      beatStarted = true;
      beatInterval = setInterval(playBeat, 666); // 90 bpm = 666ms
    }

    function stopHeartbeat() {
      clearInterval(beatInterval);
      beatStarted = false;
    }

    updateNeedle(); // initialize position
  </script>
</body>
</html>
