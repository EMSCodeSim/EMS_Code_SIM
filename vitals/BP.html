<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BP Simulator</title>
  <style>
    body {
      text-align: center;
      background-color: #f0f0f0;
      font-family: Arial, sans-serif;
    }
    #dial-container {
      position: relative;
      width: 300px;
      height: 300px;
      margin: 20px auto;
    }
    #dial {
      width: 100%;
      height: 100%;
    }
    #needle {
      position: absolute;
      width: 6px;
      height: 140px;
      background-color: red;
      top: 10px;
      left: 50%;
      transform-origin: bottom center;
      transform: rotate(180deg);
      z-index: 10;
    }
    button {
      margin: 10px;
      padding: 10px 20px;
      font-size: 16px;
    }
    #pressureDisplay, #bpReadout {
      font-size: 20px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h1>Blood Pressure Simulator</h1>

  <div id="dial-container">
    <img id="dial" src="bp_dial.png" alt="BP Dial">
    <div id="needle"></div>
  </div>

  <button onclick="pump()">Pump</button>
  <button onclick="release()">Release</button>

  <div id="pressureDisplay">Current Pressure: 0 mmHg</div>
  <div id="bpReadout">Systolic/Diastolic: --/--</div>

  <script>
    let pressure = 0;
    let releasing = false;
    let systolic = 0;
    let diastolic = 0;
    let audioCtx;
    let beatInterval = null;
    let soundActive = false;

    const needle = document.getElementById('needle');
    const pressureDisplay = document.getElementById('pressureDisplay');
    const bpReadout = document.getElementById('bpReadout');

    function updateNeedle(p) {
      const angle = (p / 280) * 360 + 180; // 0 = 180deg, 280 = 540deg
      needle.style.transform = `rotate(${angle % 360}deg)`;
      pressureDisplay.innerText = `Current Pressure: ${Math.round(p)} mmHg`;
    }

    function pump() {
      if (releasing) return;
      pressure += 10;
      if (pressure > 280) pressure = 280;
      updateNeedle(pressure);
    }

    function release() {
      if (releasing) return;
      releasing = true;

      systolic = Math.floor(Math.random() * (222 - 100 + 1)) + 100;
      diastolic = Math.floor(systolic * 0.6);
      bpReadout.innerText = `Systolic/Diastolic: ${systolic}/${diastolic}`;

      console.log(`BP: ${systolic}/${diastolic}`);
      releaseLoop();
    }

    function releaseLoop() {
      if (!releasing) return;

      pressure -= 1;
      if (pressure < 0) {
        pressure = 0;
        releasing = false;
        stopHeartbeat();
        return;
      }

      updateNeedle(pressure);

      if (Math.round(pressure) === systolic) {
        startHeartbeat();
      }

      if (Math.round(pressure) === diastolic) {
        stopHeartbeat();
      }

      setTimeout(releaseLoop, 50);
    }

    function startHeartbeat() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (beatInterval) return; // already playing

      beatInterval = setInterval(() => {
        playBeat();
      }, 667); // 90 bpm
    }

    function stopHeartbeat() {
      clearInterval(beatInterval);
      beatInterval = null;
    }

    function playBeat() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.setValueAtTime(150, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.1);
    }
  </script>

</body>
</html>
