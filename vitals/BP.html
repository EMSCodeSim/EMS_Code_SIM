<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Blood Pressure Simulator</title>
  <style>
    body {
      text-align: center;
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
    }
    #gauge-container {
      position: relative;
      width: 400px;
      height: 400px;
      margin: 20px auto;
    }
    #gauge {
      width: 100%;
      height: 100%;
    }
    #needle {
      position: absolute;
      width: 4px;
      height: 140px;
      background-color: red;
      top: 60px;
      left: 198px;
      transform-origin: bottom center;
      transform: rotate(180deg);
      transition: transform 0.05s linear;
    }
    button {
      margin: 10px;
      padding: 10px 20px;
      font-size: 16px;
    }
    #pressure-display {
      font-size: 20px;
    }
  </style>
</head>
<body>
  <h1>Blood Pressure Simulator</h1>
  <div id="gauge-container">
    <img id="gauge" src="bp_dial.png" alt="BP Dial" />
    <div id="needle"></div>
  </div>
  <div id="pressure-display">Pressure: 0 mmHg</div>
  <button id="pump">Pump</button>
  <button id="release">Release Pressure</button>

  <audio id="heartbeat" src="https://actions.google.com/sounds/v1/health/heart_monitor_beep.ogg" preload="auto"></audio>

  <script>
    const needle = document.getElementById("needle");
    const pressureDisplay = document.getElementById("pressure-display");
    const heartbeat = document.getElementById("heartbeat");

    let pressure = 0;
    let systolic = 120;
    let diastolic = 80;
    let pumpInterval;
    let releasing = false;
    let beatInterval;

    function getRandomBP() {
      systolic = Math.floor(Math.random() * (222 - 100 + 1)) + 100;
      let minDiastolic = Math.max(40, systolic - 80);
      let maxDiastolic = Math.min(100, systolic - 20);
      diastolic = Math.floor(Math.random() * (maxDiastolic - minDiastolic + 1)) + minDiastolic;
      console.log(`BP: ${systolic}/${diastolic}`);
    }

    function updateNeedle() {
      const degreesPerMMHg = 360 / 280;
      const angle = (pressure * degreesPerMMHg) + 180; // 0 at bottom
      needle.style.transform = `rotate(${angle}deg)`;
      pressureDisplay.textContent = `Pressure: ${Math.round(pressure)} mmHg`;
    }

    function startPump() {
      getRandomBP();
      clearInterval(beatInterval);
      pumpInterval = setInterval(() => {
        if (pressure < 280) {
          pressure += 2;
          updateNeedle();
        }
      }, 40);
    }

    function stopPump() {
      clearInterval(pumpInterval);
    }

    function releasePressure() {
      if (releasing) return;
      releasing = true;
      let releaseInterval = setInterval(() => {
        if (pressure > 0) {
          pressure -= 0.2;
          updateNeedle();
          checkHeartbeat();
        } else {
          clearInterval(releaseInterval);
          releasing = false;
          pressure = 0;
          updateNeedle();
          stopHeartbeat();
        }
      }, 25);
    }

    function checkHeartbeat() {
      if (pressure >= diastolic && pressure <= systolic) {
        if (!beatInterval) {
          beatInterval = setInterval(() => {
            heartbeat.pause();
            heartbeat.currentTime = 0;
            heartbeat.play().catch(err => console.log("Sound error:", err));
          }, 667);
        }
      } else {
        stopHeartbeat();
      }
    }

    function stopHeartbeat() {
      if (beatInterval) {
        clearInterval(beatInterval);
        beatInterval = null;
      }
      heartbeat.pause();
      heartbeat.currentTime = 0;
    }

    document.getElementById("pump").addEventListener("mousedown", startPump);
    document.getElementById("pump").addEventListener("mouseup", stopPump);
    document.getElementById("pump").addEventListener("mouseleave", stopPump);
    document.getElementById("release").addEventListener("click", releasePressure);
  </script>
</body>
</html>
