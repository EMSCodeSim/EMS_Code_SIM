<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Blood Pressure Simulator</title>
  <style>
    body {
      background: #eef;
      text-align: center;
      font-family: sans-serif;
    }
    #gauge {
      position: relative;
      width: 300px;
      height: 300px;
      margin: 20px auto;
      background: url("bp_dial.png") no-repeat center/contain;
    }
    #needle {
      position: absolute;
      width: 6px;
      height: 140px;
      background: red;
      top: 30px;
      left: 147px;
      transform-origin: bottom center;
      transform: rotate(0deg);
    }
    button {
      padding: 10px 20px;
      margin: 10px;
      font-size: 16px;
    }
    #bpReading {
      font-size: 20px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>Blood Pressure Simulator</h1>
  <div id="gauge">
    <div id="needle"></div>
  </div>
  <button onclick="pump()">Pump</button>
  <button onclick="release()">Release Pressure</button>
  <div id="bpReading">Blood Pressure: ???/???</div>

  <script>
    const needle = document.getElementById('needle');
    const bpDisplay = document.getElementById('bpReading');

    let currentPressure = 0;
    let systolic = 0;
    let diastolic = 0;
    let releasing = false;
    let beatInterval = null;
    let audioCtx = null;

    function rotateNeedle(pressure) {
      // Convert pressure (0–260) to degrees (0–360)
      const angle = (pressure / 260) * 360;
      needle.style.transform = `rotate(${angle}deg)`;
    }

    function pump() {
      if (releasing) return;
      currentPressure += 10;
      if (currentPressure > 260) currentPressure = 260;
      rotateNeedle(currentPressure);
    }

    function release() {
      if (releasing) return;
      releasing = true;

      // Generate random BP
      systolic = Math.floor(Math.random() * (222 - 80 + 1)) + 80;
      const systolicRange = systolic - 40;
      diastolic = Math.floor(Math.random() * (systolicRange - 40 + 1)) + 40;

      bpDisplay.textContent = `Blood Pressure: ${systolic}/${diastolic}`;

      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }

      const releaseInterval = setInterval(() => {
        currentPressure -= 1;
        if (currentPressure <= 0) {
          currentPressure = 0;
          clearInterval(releaseInterval);
          releasing = false;
          stopBeats();
        }
        rotateNeedle(currentPressure);

        // Start heartbeat sound at systolic
        if (currentPressure === systolic) {
          startBeats();
        }

        // Stop at diastolic
        if (currentPressure === diastolic) {
          stopBeats();
        }
      }, 30);
    }

    function startBeats() {
      if (beatInterval) return;
      beatInterval = setInterval(playBeat, 666); // ~90 bpm
    }

    function stopBeats() {
      clearInterval(beatInterval);
      beatInterval = null;
    }

    function playBeat() {
      if (!audioCtx) return;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.frequency.setValueAtTime(120, audioCtx.currentTime); // Deeper heartbeat
      gain.gain.setValueAtTime(0, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(1.0, audioCtx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);

      osc.connect(gain).connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    }
  </script>
</body>
</html>
