<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Blood Pressure Simulator</title>
  <style>
    body {
      text-align: center;
      background-color: #f0f0f0;
      font-family: Arial, sans-serif;
    }
    canvas {
      background-color: white;
      border-radius: 50%;
      margin-top: 20px;
    }
    #controls {
      margin-top: 20px;
    }
    button {
      padding: 10px 20px;
      margin: 5px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h1>Blood Pressure Simulator</h1>
  <canvas id="gauge" width="400" height="400"></canvas>
  <div id="pressureDisplay"></div>
  <div id="controls">
    <button onclick="pump()">Pump</button>
    <button onclick="release()">Release</button>
  </div>

  <script>
    const canvas = document.getElementById("gauge");
    const ctx = canvas.getContext("2d");
    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    const radius = 180;

    let pressure = 0;
    let interval;
    let systolic = 120;
    let diastolic = 80;
    let bpm = 90;
    let beatInterval = 60 / bpm;
    let ctxAudio;

    function drawGauge() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Tick marks
      for (let i = 0; i <= 280; i += 2) {
        const angle = ((i - 140) / 280) * 2 * Math.PI;
        const tickLength = i % 10 === 0 ? 10 : 5;
        const startX = centerX + (radius - tickLength) * Math.cos(angle);
        const startY = centerY + (radius - tickLength) * Math.sin(angle);
        const endX = centerX + radius * Math.cos(angle);
        const endY = centerY + radius * Math.sin(angle);

        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.lineTo(endX, endY);
        ctx.lineWidth = 2;
        ctx.strokeStyle = "black";
        ctx.stroke();

        if (i % 20 === 0) {
          const labelX = centerX + (radius - 30) * Math.cos(angle);
          const labelY = centerY + (radius - 30) * Math.sin(angle);
          ctx.font = "16px Arial";
          ctx.fillStyle = "black";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(i.toString(), labelX, labelY);
        }
      }

      // Needle
      const angle = ((pressure - 140) / 280) * 2 * Math.PI;
      const needleLength = 140;
      const needleX = centerX + needleLength * Math.cos(angle);
      const needleY = centerY + needleLength * Math.sin(angle);

      ctx.beginPath();
      ctx.moveTo(centerX, centerY);
      ctx.lineTo(needleX, needleY);
      ctx.lineWidth = 4;
      ctx.strokeStyle = "red";
      ctx.stroke();
    }

    function pump() {
      pressure += 10;
      if (pressure > 300) pressure = 300;
      drawGauge();
    }

    function release() {
      systolic = Math.floor(Math.random() * 142) + 80;  // 80 to 222
      diastolic = Math.floor(systolic * 0.5 + Math.random() * 20); // ~ realistic ratio
      bpm = 90;
      beatInterval = 60 / bpm;
      document.getElementById("pressureDisplay").innerText = `Set BP: ${systolic}/${diastolic}`;

      if (interval) clearInterval(interval);

      interval = setInterval(() => {
        pressure -= 1;
        if (pressure < 0) {
          pressure = 0;
          clearInterval(interval);
        }

        if (pressure <= systolic && pressure >= diastolic) {
          playTone();
        }

        drawGauge();
      }, 50);
    }

    function playTone() {
      if (!ctxAudio) {
        ctxAudio = new (window.AudioContext || window.webkitAudioContext)();
      }

      const now = ctxAudio.currentTime;
      const osc = ctxAudio.createOscillator();
      const gain = ctxAudio.createGain();

      osc.frequency.value = 660;
      gain.gain.setValueAtTime(1, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);

      osc.connect(gain).connect(ctxAudio.destination);
      osc.start(now);
      osc.stop(now + 0.1);
    }

    drawGauge();
  </script>
</body>
</html>
