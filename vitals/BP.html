<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Blood Pressure Simulator</title>
  <style>
    body {
      text-align: center;
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
    }
    #gauge-container {
      position: relative;
      width: 400px;
      height: 400px;
      margin: 20px auto;
    }
    #gauge {
      width: 100%;
      height: 100%;
    }
    #needle {
      position: absolute;
      width: 4px;
      height: 180px;
      background-color: red;
      top: 20px;
      left: 198px;
      transform-origin: bottom center;
      transform: rotate(0deg);
      transition: transform 0.1s linear;
    }
    button {
      margin: 10px;
      padding: 10px 20px;
      font-size: 16px;
    }
    #pressure-display {
      font-size: 20px;
    }
  </style>
</head>
<body>
  <h1>Blood Pressure Simulator</h1>
  <div id="gauge-container">
    <img id="gauge" src="bp_dial.png" alt="BP Dial" />
    <div id="needle"></div>
  </div>
  <div id="pressure-display">Pressure: 0 mmHg</div>
  <button id="pump">Pump</button>
  <button id="release">Release Pressure</button>

  <audio id="heartbeat" src="https://actions.google.com/sounds/v1/health/heart_monitor_beep.ogg"></audio>

  <script>
    let pressure = 0;
    let needle = document.getElementById("needle");
    let pressureDisplay = document.getElementById("pressure-display");
    let heartbeat = document.getElementById("heartbeat");
    let pumpInterval;
    let releasing = false;

    const systolic = 120;
    const diastolic = 80;

    function updateNeedle() {
      const angle = (pressure / 280) * 360;
      needle.style.transform = `rotate(${angle}deg)`;
      pressureDisplay.textContent = `Pressure: ${Math.round(pressure)} mmHg`;

      if (pressure >= diastolic && pressure <= systolic) {
        if (heartbeat.paused) {
          heartbeat.currentTime = 0;
          heartbeat.play();
        }
      } else {
        heartbeat.pause();
        heartbeat.currentTime = 0;
      }
    }

    function startPump() {
      pumpInterval = setInterval(() => {
        if (pressure < 280) {
          pressure += 2;
          updateNeedle();
        }
      }, 50);
    }

    function stopPump() {
      clearInterval(pumpInterval);
    }

    function releasePressure() {
      if (releasing) return;
      releasing = true;
      const releaseInterval = setInterval(() => {
        if (pressure > 0) {
          pressure -= 0.3; // Slower release
          updateNeedle();
        } else {
          clearInterval(releaseInterval);
          releasing = false;
          pressure = 0;
          updateNeedle();
        }
      }, 30);
    }

    document.getElementById("pump").addEventListener("mousedown", startPump);
    document.getElementById("pump").addEventListener("mouseup", stopPump);
    document.getElementById("pump").addEventListener("mouseleave", stopPump);
    document.getElementById("release").addEventListener("click", releasePressure);
  </script>
</body>
</html>
