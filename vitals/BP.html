<!DOCTYPE html>
<html>
<head>
  <title>Blood Pressure Simulator</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      background-color: #eef5f9;
    }
    #gauge {
      width: 300px;
      height: 300px;
      background: url('bp_dial.png') no-repeat center center;
      background-size: contain;
      position: relative;
      margin: 20px auto;
    }
    #needle {
      width: 6px;
      height: 140px;
      background: red;
      position: absolute;
      top: 30px;
      left: 147px;
      transform-origin: bottom center;
      transform: rotate(0deg);
      border-radius: 3px;
    }
    .button {
      padding: 10px 20px;
      font-size: 16px;
      margin: 10px;
    }
    #readings {
      font-size: 20px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <h2>Manual Blood Pressure Simulator</h2>

  <div id="gauge">
    <div id="needle"></div>
  </div>

  <div>
    <button class="button" onclick="pumpCuff()">Pump Cuff</button>
    <button class="button" onclick="releasePressure()">Release Pressure</button>
  </div>

  <div id="readings">Set Pressure: -- / --</div>

  <script>
    let currentPressure = 0;
    let targetPressure = 200;
    let interval;
    let heartbeatInterval;
    let systolic = 0;
    let diastolic = 0;
    let playing = false;
    const bpm = 90;
    const beatInterval = 60000 / bpm;

    const context = new (window.AudioContext || window.webkitAudioContext)();

    function playHeartbeat() {
      const osc = context.createOscillator();
      const gain = context.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(150, context.currentTime);
      gain.gain.setValueAtTime(1, context.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, context.currentTime + 0.1);
      osc.connect(gain);
      gain.connect(context.destination);
      osc.start();
      osc.stop(context.currentTime + 0.1);
    }

    function updateNeedle(pressure) {
      const rotation = (pressure / 280) * 180;
      document.getElementById("needle").style.transform = `rotate(${rotation}deg)`;
    }

    function pumpCuff() {
      currentPressure = 200;
      updateNeedle(currentPressure);
      document.getElementById("readings").innerText = "Set Pressure: -- / --";
      clearInterval(interval);
      clearInterval(heartbeatInterval);
      playing = false;
    }

    function releasePressure() {
      systolic = Math.floor(Math.random() * (222 - 80 + 1)) + 80;
      diastolic = Math.floor(systolic * 0.55 + Math.random() * 10);

      document.getElementById("readings").innerText = `Set Pressure: ${systolic} / ${diastolic}`;

      clearInterval(interval);
      clearInterval(heartbeatInterval);
      playing = false;

      interval = setInterval(() => {
        if (currentPressure <= 0) {
          clearInterval(interval);
          clearInterval(heartbeatInterval);
          updateNeedle(0);
          return;
        }

        currentPressure -= 1;
        updateNeedle(currentPressure);

        if (currentPressure <= systolic && currentPressure >= diastolic && !playing) {
          heartbeatInterval = setInterval(() => {
            playHeartbeat();
          }, beatInterval);
          playing = true;
        }

        if (currentPressure < diastolic && playing) {
          clearInterval(heartbeatInterval);
          playing = false;
        }

      }, 100); // Slower release
    }
  </script>

</body>
</html>
