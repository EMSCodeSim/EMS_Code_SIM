<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Blood Pressure Simulator</title>
  <style>
    body {
      text-align: center;
      font-family: Arial, sans-serif;
    }

    canvas {
      background-color: #f0f0f0;
      margin-top: 20px;
    }

    #controls {
      margin-top: 20px;
    }

    label, input, button {
      margin: 5px;
    }
  </style>
</head>
<body>
  <h1>Blood Pressure Cuff Simulator</h1>
  <canvas id="dialCanvas" width="400" height="400"></canvas>

  <div id="controls">
    <label for="deflateRate">Deflation Rate (0.1–1.0):</label>
    <input type="number" id="deflateRate" value="0.5" step="0.1" min="0.1" max="1">
    <br>
    <button onclick="startInflation()">Start Inflation</button>
    <button onclick="startDeflation()">Start Deflation</button>
    <button onclick="stopSimulation()">Stop</button>
  </div>

  <audio id="heartbeat" src="https://www.soundjay.com/button/sounds/beep-07.mp3" preload="auto"></audio>

  <script>
    const canvas = document.getElementById('dialCanvas');
    const ctx = canvas.getContext('2d');
    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    const radius = 150;

    const minPressure = 70;
    const maxPressure = 210;

    let currentPressure = 70;
    let inflating = false;
    let deflating = false;
    let intervalId;
    let heartbeat = document.getElementById("heartbeat");

    function drawDial(pressure) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw outer circle
      ctx.beginPath();
      ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
      ctx.stroke();

      // Draw ticks and numbers
      for (let p = minPressure; p <= maxPressure; p += 10) {
        const angle = pressureToAngle(p);
        const x1 = centerX + Math.cos(angle) * (radius - 10);
        const y1 = centerY + Math.sin(angle) * (radius - 10);
        const x2 = centerX + Math.cos(angle) * radius;
        const y2 = centerY + Math.sin(angle) * radius;

        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();

        const labelX = centerX + Math.cos(angle) * (radius - 30);
        const labelY = centerY + Math.sin(angle) * (radius - 30);
        ctx.font = "12px Arial";
        ctx.fillText(p, labelX - 10, labelY + 4);
      }

      // Draw needle
      const angle = pressureToAngle(pressure);
      const needleX = centerX + Math.cos(angle) * (radius - 40);
      const needleY = centerY + Math.sin(angle) * (radius - 40);
      ctx.beginPath();
      ctx.moveTo(centerX, centerY);
      ctx.lineTo(needleX, needleY);
      ctx.strokeStyle = "red";
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.lineWidth = 1;
      ctx.strokeStyle = "black";
    }

    function pressureToAngle(pressure) {
      // Maps 70 (270°) to 210 (90°)
      const pressureRange = maxPressure - minPressure;
      const angleRange = Math.PI * 1.5; // 270° to 90° in radians (clockwise)
      const ratio = (pressure - minPressure) / pressureRange;
      return (Math.PI * 1.5) - ratio * angleRange;
    }

    function startInflation() {
      stopSimulation();
      inflating = true;
      intervalId = setInterval(() => {
        if (currentPressure < 220) {
          currentPressure += 1;
          drawDial(currentPressure);
          playHeartbeat();
        } else {
          stopSimulation();
        }
      }, 50);
    }

    function startDeflation() {
      stopSimulation();
      deflating = true;
      const rate = parseFloat(document.getElementById("deflateRate").value);
      const intervalMs = 200 / rate;
      intervalId = setInterval(() => {
        if (currentPressure > 70) {
          currentPressure -= 1;
          drawDial(currentPressure);
        } else {
          stopSimulation();
        }
      }, intervalMs);
    }

    function stopSimulation() {
      clearInterval(intervalId);
      inflating = false;
      deflating = false;
    }

    function playHeartbeat() {
      heartbeat.currentTime = 0;
      heartbeat.play();
    }

    drawDial(currentPressure);
  </script>
</body>
</html>
