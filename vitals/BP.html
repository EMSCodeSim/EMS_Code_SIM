<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BP Simulator with Accurate Dial & Sound</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #eef6fb;
      padding: 20px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      margin: 10px;
      cursor: pointer;
    }

    #pressureDisplay {
      font-size: 20px;
      margin: 10px 0;
      font-weight: bold;
    }

    .dial-container {
      position: relative;
      width: 300px;
      height: 300px;
      margin: 20px auto;
    }

    .dial-container img {
      width: 100%;
      height: 100%;
    }

    #needle {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 4px;
      height: 120px;
      background-color: red;
      transform-origin: bottom center;
      transform: translate(-50%, -100%) rotate(180deg);
      transition: transform 0.05s linear;
    }
  </style>
</head>
<body>

<h1>Accurate Blood Pressure Simulator</h1>

<label>Systolic:
  <input type="number" id="sys" value="120" min="50" max="250">
</label>
<label>Diastolic:
  <input type="number" id="dia" value="80" min="30" max="200">
</label>

<div id="pressureDisplay">Current Pressure: 0 mmHg</div>

<button id="pumpBtn" onmousedown="startPumping()" onmouseup="stopPumping()" onmouseleave="stopPumping()" ontouchstart="startPumping()" ontouchend="stopPumping()">Pump Cuff</button>
<button onclick="startRelease()">Release Pressure</button>

<div class="dial-container">
  <img src="bp_dial.png" alt="BP Dial">
  <div id="needle"></div>
</div>

<script>
  let currentPressure = 0;
  let releaseInterval;
  let pumpInterval;
  let heartbeatInterval;
  let audioCtx;

  function unlockAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const dummy = audioCtx.createOscillator();
      dummy.connect(audioCtx.destination);
      dummy.start();
      dummy.stop();
    }
  }

  function bpToAngle(bp) {
    return ((bp / 280) * 360) + 180;
  }

  function updateNeedle(bp) {
    const angle = bpToAngle(bp);
    document.getElementById("needle").style.transform = `translate(-50%, -100%) rotate(${angle}deg)`;
    document.getElementById("pressureDisplay").innerText = `Current Pressure: ${bp} mmHg`;
  }

  function playBeat() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.frequency.value = 660;
    gain.gain.setValueAtTime(1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime + 0.1);
  }

  function startHeartbeat() {
    heartbeatInterval = setInterval(playBeat, 800);
  }

  function stopHeartbeat() {
    clearInterval(heartbeatInterval);
  }

  function startPumping() {
    unlockAudio();
    clearInterval(releaseInterval);
    pumpInterval = setInterval(() => {
      if (currentPressure < 280) {
        currentPressure += 10;
        updateNeedle(currentPressure);
      }
    }, 200);
  }

  function stopPumping() {
    clearInterval(pumpInterval);
  }

  function startRelease() {
    unlockAudio();
    const sys = parseInt(document.getElementById("sys").value);
    const dia = parseInt(document.getElementById("dia").value);

    clearInterval(pumpInterval);

    releaseInterval = setInterval(() => {
      if (currentPressure <= 0) {
        clearInterval(releaseInterval);
        stopHeartbeat();
        currentPressure = 0;
        updateNeedle(currentPressure);
        return;
      }

      currentPressure--;
      updateNeedle(currentPressure);

      if (currentPressure === sys) startHeartbeat();
      if (currentPressure === dia) stopHeartbeat();

    }, 100);
  }

  updateNeedle(0);
</script>

</body>
</html>
