<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Interactive Trauma Body Exam | EMSCodeSim</title><link rel="stylesheet" href="/vitals/visual-assessment-suite.css?v=2318"></head><body>
<main class="va-shell"><header class="va-head"><div><small>VISUAL ASSESSMENT MINI SIM</small><h1>Interactive Trauma Body Exam</h1></div><small>Perform → observe → document</small></header>
<section class="va-card va-stage"><div class="va-visual"><div class="va-body"><div class="head"></div><div class="torso"></div><div class="limb armL"></div><div class="limb armR"></div><div class="limb legL"></div><div class="limb legR"></div>
<button class="hotspot" style="left:61px;top:22px" data-r="Head">Head</button><button class="hotspot" style="left:58px;top:84px" data-r="Chest">Chest</button><button class="hotspot" style="left:55px;top:135px" data-r="Abdomen">Abd</button><button class="hotspot" style="left:57px;top:169px" data-r="Pelvis">Pelvis</button><button class="hotspot" style="left:8px;top:205px" data-r="Left leg">L leg</button><button class="hotspot" style="right:2px;top:205px" data-r="Right leg">R leg</button></div></div><div class="va-controls"><strong>Select each body region on the patient.</strong><small>Look and palpate systematically for DCAP-BTLS findings. Completed regions remain highlighted.</small><button class="va-btn" id="finish">Document trauma exam</button></div></section>
<section id="result" class="va-card va-result">Perform the assessment to reveal findings.</section></main>
<script src="/vitals/patient-record.js"></script><script src="/vitals/scenario-definitions.js?v=2219"></script><script src="/vitals/scenario-session.js?v=5"></script><script src="/vitals/scenario-runtime.js?v=2223"></script><script src="/vitals/visual-assessment-suite.js?v=2318"></script><script>let seen=new Set;const finding=String(VA.vital('trauma_assessment','No major external trauma identified'));
document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{seen.add(b.dataset.r);b.classList.add('active');VA.click();const abnormal=/injur|deform|tender|pain|bleed|swelling/i.test(finding);if(abnormal&&/leg|pelvis|chest/i.test(b.dataset.r))b.classList.add('abnormal')});
document.querySelector('#finish').onclick=()=>{if(seen.size<6){VA.tone(180,.08,.02,'square');return}VA.result('trauma_assessment','Trauma Exam',finding,finding)}</script></body></html>
