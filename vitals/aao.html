<style>
  :root{
    --brand:#007B8A; --brand-600:#066371;
    --bg:#f0f8ff; --panel:#ffffff; --ink:#0f2b33; --muted:#46636a;
    --ok:#0a8f5b; --bad:#b81e2b; --warn:#c77b00;
    --border:#e2e8f0; --shadow:0 10px 28px rgba(2,8,23,.08);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0; background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,Segoe UI,Inter,Roboto,Arial,sans-serif;
    -webkit-text-size-adjust:100%;}
  a{color:var(--brand-600); text-decoration:none}
  .wrap{max-width:1100px; margin:0 auto; padding:18px 16px 60px;}
  .top{position:sticky; top:0; z-index:10; background:rgba(240,248,255,.75); backdrop-filter:saturate(120%) blur(6px); border-bottom:1px solid var(--border);}
  .topnav{max-width:1100px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:14px}
  .brand{font-weight:900; letter-spacing:.2px;}
  .grid{display:grid; gap:12px; grid-template-columns:1fr}
  .card{background:var(--panel); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); overflow:hidden}
  .card .inner{padding:16px}
  h1,h2,h3{margin:0 0 6px 0}
  small{color:var(--muted)}
  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
  .btn{appearance:none; border:0; border-radius:12px; cursor:pointer; padding:12px 14px; font-weight:800; color:#fff; background:linear-gradient(180deg, #1db4c7, var(--brand));}
  .btn.secondary{background:transparent; color:var(--brand-600); border:1px solid var(--border)}
  .btn.warn{background:linear-gradient(180deg, #ffbf65, var(--warn)); color:#2b1900}
  .btn:disabled{opacity:.65; cursor:not-allowed}
  select,input[type="text"]{padding:12px; border-radius:12px; border:1px solid var(--border); outline:none; background:#f7fbff}
  .cols{display:grid; grid-template-columns:1fr; gap:12px}
  @media(min-width:940px){ .cols{grid-template-columns:1.2fr .8fr} }
  .big{font-size:18px}
  .qa{display:grid; gap:10px; grid-template-columns:1fr 1fr}
  .qa button{width:100%}
  .log{white-space:pre-wrap; border-top:1px dashed var(--border); margin-top:10px; padding-top:10px; color:#3c5258}
  .score{font-weight:900; color:var(--brand-600)}
  .box{border-radius:12px; border:1px dashed var(--border); padding:10px; background:#f9fcff}
  .field{display:flex; flex-direction:column; gap:6px}
</style>

<link href="/styles/responsive.css" rel="stylesheet"/>
<link href="/styles/site-enhancements.css" rel="stylesheet"/>

<meta content="website" property="og:type"/><meta content="EMSCodeSim" property="og:site_name"/><meta content="AAOx4 Orientation Simulator | EMSCodeSim" property="og:title"/><meta content="Practice level of consciousness and orientation questions for EMS patient assessment: person, place, time, and event." property="og:description"/><meta content="https://emscodesim.com/vitals/aao.html" property="og:url"/><meta content="https://emscodesim.com/ems-logo.png" property="og:image"/>

<body data-vital-topic="aao">
<div class="top">
<div class="topnav">
<h1 class="brand tool-h1">A&amp;O×4 Orientation Simulator</h1>
</div>
</div>
<div class="wrap">
<div class="grid">
<div class="card">
<div class="inner">
<h2>Scenario</h2>
<small>Pick a case and click Start. Use the Ask buttons to practice orientation questions; the simulator will speak each prompt.</small>
<div class="row" style="margin-top:8px">
<select id="scenarioSelect">
<option value="">Select a case…</option>
<option value="basic">Basic: No complications</option>
<option value="confused">Confused: Needs redirection</option>
<option value="aphasia">Aphasia: Short responses</option>
<option value="intox">Intoxicated: Slurred speech</option>
</select>
<button class="btn" id="startBtn">Start</button>
<button class="btn secondary" id="stopBtn">Stop</button>
<button class="btn warn" id="nextBtn">Next Case</button>
</div>
<div class="box" id="status" style="margin-top:10px"></div>
</div>
</div>
<div class="cols">
<div class="card">
<div class="inner">
<h3>Ask (A&amp;O×4)</h3>
<small>Tap a question to ask it. The simulator will speak the prompt and a patient-style reply.</small>
<div class="qa" style="margin-top:10px">
<button class="btn" id="askPerson">Ask Person</button>
<button class="btn" id="askPlace">Ask Place</button>
<button class="btn" id="askTime">Ask Time</button>
<button class="btn" id="askEvent">Ask Event</button>
</div>
<div class="log" id="log"></div>
</div>
</div>
<div class="card">
<div class="inner">
<h3>Controls</h3>
<div class="field">
<label>Voice
                <select id="voiceSel"></select>
</label>
</div>
<div class="field">
<label>Rate
                <input id="rate" max="1.3" min="0.7" step="0.05" type="range" value="1.0"/>
</label>
</div>
<div class="field">
<label>Pitch
                <input id="pitch" max="1.4" min="0.6" step="0.05" type="range" value="1.0"/>
</label>
</div>
<div class="field">
<label>Volume
                <input id="vol" max="1" min="0" step="0.05" type="range" value="1"/>
</label>
</div>
</div>
</div>
</div>
<div class="card">
<div class="inner">
<h3>Transcript</h3>
<div class="box big" id="transcript"></div>
</div>
</div>
</div>
</div>
<script>
(() => {
  const $ = id => document.getElementById(id);

  const scenarioSelect = $('scenarioSelect');
  const startBtn = $('startBtn');
  const stopBtn = $('stopBtn');
  const nextBtn = $('nextBtn');

  const askPerson = $('askPerson');
  const askPlace = $('askPlace');
  const askTime = $('askTime');
  const askEvent = $('askEvent');

  const status = $('status');
  const transcript = $('transcript');
  const logEl = $('log');

  const voiceSel = $('voiceSel');
  const rate = $('rate');
  const pitch = $('pitch');
  const vol = $('vol');

  // Simple scenarios for demo
  const scenarios = {
    basic: {
      intro: "You are evaluating a cooperative patient in triage.",
      replies: {
        person: "My name is Jordan Smith.",
        place: "I'm at the county emergency department.",
        time: "It's Tuesday afternoon.",
        event: "I came in for chest tightness that started an hour ago."
      }
    },
    confused: {
      intro: "You are evaluating a confused patient requiring redirection.",
      replies: {
        person: "Uh… I think it's John. John? Not sure.",
        place: "This is the clinic? Or… is it the pharmacy?",
        time: "Evening? Morning? It's a bit blurry.",
        event: "I lost my wallet and felt dizzy on the bus."
      }
    },
    aphasia: {
      intro: "You are evaluating a patient with expressive aphasia.",
      replies: {
        person: "…Jordan.",
        place: "Hos… hospital.",
        time: "Two… two o'clock.",
        event: "Car… crash."
      }
    },
    intox: {
      intro: "You are evaluating an intoxicated patient with slurred speech.",
      replies: {
        person: "Mmm… name? Jordan… yeah.",
        place: "The ER… yeah, ER.",
        time: "Nnnot sure… late.",
        event: "Partied… too hard… feel sick."
      }
    }
  };

  // TTS helpers (Web Speech API)
  const synth = window.speechSynthesis;
  let selectedVoice = null;

  function populateVoices() {
    const voices = synth.getVoices();
    voiceSel.innerHTML = '';
    const opt = document.createElement('option');
    opt.value = ''; opt.textContent = '(System default)';
    voiceSel.appendChild(opt);

    voices.forEach(v => {
      const o = document.createElement('option');
      o.value = v.name;
      o.textContent = `${v.name} (${v.lang})`;
      voiceSel.appendChild(o);
    });
  }
  populateVoices();
  synth.addEventListener('voiceschanged', populateVoices);

  voiceSel.addEventListener('change', () => {
    const v = synth.getVoices().find(v => v.name === voiceSel.value);
    selectedVoice = v || null;
  });

  function say(text, opts={}) {
    if(!text) return;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = parseFloat(rate.value) || 1.0;
    u.pitch = parseFloat(pitch.value) || 1.0;
    u.volume = parseFloat(vol.value) || 1.0;
    if (selectedVoice) u.voice = selectedVoice;
    // Cancel any previous speech before starting a new prompt
    synth.cancel();
    synth.speak(u);
  }

  function log(line){
    const prev = logEl.textContent.trim();
    logEl.textContent = (prev ? prev + "\n" : "") + line;
  }

  function setStatus(msg){ status.textContent = msg; }
  function setTranscript(msg){ transcript.textContent = msg; }

  function newScenario(first=false){
    const key = scenarioSelect.value || 'basic';
    const sc = scenarios[key];
    setStatus(sc.intro);
    setTranscript('');
    logEl.textContent = '';
    if (first) {
      // don't autoplay on load; wait for user to hit Start
    }
  }

  // Button actions (each click triggers speech synchronously)
  startBtn.addEventListener('click', ()=>{
    const key = scenarioSelect.value || 'basic';
    const sc = scenarios[key];
    setTranscript('Scenario started.\n' + sc.intro);
    say('Scenario started. ' + sc.intro);
  });

  stopBtn.addEventListener('click', ()=>{
    window.speechSynthesis.cancel();
    setTranscript('Scenario stopped.');
  });

  askPerson.addEventListener('click', ()=>{
    const key = scenarioSelect.value || 'basic';
    const sc = scenarios[key];
    say('What is your full name?');
    log('Clinician: What is your full name?');
    setTimeout(()=>{ say(sc.replies.person); log('Patient: ' + sc.replies.person); }, 600);
  });

  askPlace.addEventListener('click', ()=>{
    const key = scenarioSelect.value || 'basic';
    const sc = scenarios[key];
    say('Can you tell me where we are right now?');
    log('Clinician: Can you tell me where we are right now?');
    setTimeout(()=>{ say(sc.replies.place); log('Patient: ' + sc.replies.place); }, 600);
  });

  askTime.addEventListener('click', ()=>{
    const key = scenarioSelect.value || 'basic';
    const sc = scenarios[key];
    say('What day and time is it?');
    log('Clinician: What day and time is it?');
    setTimeout(()=>{ say(sc.replies.time); log('Patient: ' + sc.replies.time); }, 600);
  });

  askEvent.addEventListener('click', ()=>{
    const key = scenarioSelect.value || 'basic';
    const sc = scenarios[key];
    say('What brought you in today?');
    log('Clinician: What brought you in today?');
    setTimeout(()=>{ say(sc.replies.event); log('Patient: ' + sc.replies.event); }, 600);
  });

  // Next scenario
  nextBtn.addEventListener('click', ()=>{
    window.speechSynthesis.cancel();
    newScenario(false);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  // init
  newScenario(true);
})();
</script>

</html>
