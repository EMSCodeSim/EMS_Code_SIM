<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Visual Respiratory & Chest Assessment | EMSCodeSim</title><link rel="stylesheet" href="/vitals/visual-assessment-suite.css?v=2318"></head><body>
<main class="va-shell"><header class="va-head"><div><small>VISUAL ASSESSMENT MINI SIM</small><h1>Visual Respiratory & Chest Assessment</h1></div><small>Perform → observe → document</small></header>
<section class="va-card va-stage"><div class="va-visual"><div class="va-chest"><div class="lung left"></div><div class="lung right"></div>
<button class="lung-field" style="left:52px;top:70px" data-field="LUL">LUL</button><button class="lung-field" style="left:52px;top:135px" data-field="LLL">LLL</button>
<button class="lung-field" style="right:52px;top:70px" data-field="RUL">RUL</button><button class="lung-field" style="right:52px;top:135px" data-field="RLL">RLL</button></div></div><div class="va-controls"><button class="va-btn" data-step="inspect">Inspect chest rise / work of breathing</button><button class="va-btn" data-step="palpate">Palpate chest wall</button><button class="va-btn" data-step="listen">Auscultate lung fields</button><div class="meter"><i></i></div><small>Use the lung-field buttons on the patient to compare sides.</small></div></section>
<section id="result" class="va-card va-result">Perform the assessment to reveal findings.</section></main>
<script src="/vitals/patient-record.js"></script><script src="/vitals/scenario-definitions.js?v=2219"></script><script src="/vitals/scenario-session.js?v=5"></script><script src="/vitals/scenario-runtime.js?v=2223"></script><script src="/vitals/visual-assessment-suite.js?v=2318"></script><script>let fields=new Set,steps=new Set,audio=null;
const type=String(VA.vital('breath_sound_type','normal')).toLowerCase();
const finding=String(VA.vital('breath_sounds','Clear and equal bilaterally'));
const rr=Number(VA.vital('respirations',18))||18;
document.querySelector('.va-chest')?.style.setProperty('--breath-duration',`${60/rr}s`);
document.querySelectorAll('[data-field]').forEach(b=>b.onclick=()=>{
 audio?.pause?.();fields.add(b.dataset.field);b.classList.add('active');VA.click();
 const left=b.dataset.field.startsWith('L');audio=VA.playBreath(type,(type==='diminished'&&left)?.18:.9);
 b.classList.add('listening');audio.onended=()=>b.classList.remove('listening');check()
});
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{steps.add(b.dataset.step);b.classList.add('done');VA.click();check()});
function check(){if(steps.size===3&&fields.size===4){VA.result('breathing','Breathing / Chest',finding,`RR ${rr}/min; ${finding}`);VA.result('breath_sounds','Breath Sounds',finding,finding)}}</script></body></html>
