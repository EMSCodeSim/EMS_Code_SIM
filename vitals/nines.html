<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rule of Nines Quiz</title>
<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        background: #f0f8ff;
        margin: 0;
    }
    header {
        background: #007B8A;
        color: white;
        padding: 1rem;
        font-size: 1.5rem;
    }
    svg {
        max-width: 300px;
        margin: 1rem auto;
        display: block;
    }
    .burned {
        fill: orange !important;
    }
    input[type="number"] {
        padding: 0.4rem;
        font-size: 1rem;
        width: 80px;
        text-align: center;
    }
    button {
        padding: 0.5rem 1rem;
        margin: 0.5rem;
        font-size: 1rem;
        background: #007B8A;
        color: white;
        border: none;
        cursor: pointer;
    }
    button:hover {
        background: #005f65;
    }
    #feedback {
        margin-top: 1rem;
        font-size: 1rem;
        font-weight: bold;
    }
</style>
</head>
<body>
<header id="viewType">Rule of Nines Burn Quiz</header>

<div id="svg-container"></div>
<button id="toggleViewBtn">Show Back</button>

<div id="question">Estimate the %TBSA burned:</div>
<input type="number" id="answer" min="0" max="100"> %
<br>
<button id="submitBtn">Submit</button>

<div id="feedback"></div>

<script>
const adultParts = {
    front: [
        {id:"head-front", percent:4.5, name:"Head (Front)"},
        {id:"torso-front", percent:18, name:"Torso (Front)"},
        {id:"arm-left-front", percent:4.5, name:"Left Arm (Front)"},
        {id:"arm-right-front", percent:4.5, name:"Right Arm (Front)"},
        {id:"leg-left-front", percent:9, name:"Left Leg (Front)"},
        {id:"leg-right-front", percent:9, name:"Right Leg (Front)"},
        {id:"perineum", percent:1, name:"Perineum"}
    ],
    back: [
        {id:"head-back", percent:4.5, name:"Head (Back)"},
        {id:"torso-back", percent:18, name:"Torso (Back)"},
        {id:"arm-left-back", percent:4.5, name:"Left Arm (Back)"},
        {id:"arm-right-back", percent:4.5, name:"Right Arm (Back)"},
        {id:"leg-left-back", percent:9, name:"Left Leg (Back)"},
        {id:"leg-right-back", percent:9, name:"Right Leg (Back)"}
    ]
};

const pediatricParts = {
    front: [
        {id:"head-front", percent:9, name:"Head (Front)"},
        {id:"torso-front", percent:18, name:"Torso (Front)"},
        {id:"arm-left-front", percent:4.5, name:"Left Arm (Front)"},
        {id:"arm-right-front", percent:4.5, name:"Right Arm (Front)"},
        {id:"leg-left-front", percent:7, name:"Left Leg (Front)"},
        {id:"leg-right-front", percent:7, name:"Right Leg (Front)"},
        {id:"perineum", percent:1, name:"Perineum"}
    ],
    back: [
        {id:"head-back", percent:9, name:"Head (Back)"},
        {id:"torso-back", percent:18, name:"Torso (Back)"},
        {id:"arm-left-back", percent:4.5, name:"Left Arm (Back)"},
        {id:"arm-right-back", percent:4.5, name:"Right Arm (Back)"},
        {id:"leg-left-back", percent:7, name:"Left Leg (Back)"},
        {id:"leg-right-back", percent:7, name:"Right Leg (Back)"}
    ]
};

function getSVG(view, isPediatric) {
    let scale = isPediatric ? 'scale(0.85)' : '';
    return `
    <svg viewBox="0 0 200 500">
        <g transform="${scale}">
            <rect id="head-${view}" x="80" y="10" width="40" height="40" fill="#ffe0bd" stroke="#000"/>
            <rect id="torso-${view}" x="70" y="50" width="60" height="100" fill="#ffe0bd" stroke="#000"/>
            <rect id="arm-left-${view}" x="40" y="50" width="30" height="100" fill="#ffe0bd" stroke="#000"/>
            <rect id="arm-right-${view}" x="130" y="50" width="30" height="100" fill="#ffe0bd" stroke="#000"/>
            <rect id="leg-left-${view}" x="80" y="150" width="30" height="120" fill="#ffe0bd" stroke="#000"/>
            <rect id="leg-right-${view}" x="110" y="150" width="30" height="120" fill="#ffe0bd" stroke="#000"/>
            ${view === 'front' ? '<rect id="perineum" x="95" y="270" width="10" height="10" fill="#ffe0bd" stroke="#000"/>' : ''}
        </g>
    </svg>`;
}

let scenario = {};
let currentView = 'front';
let isPediatric = false;

function startScenario() {
    isPediatric = Math.random() > 0.5;
    document.getElementById('viewType').textContent = isPediatric ? "Pediatric View" : "Adult View";
    const parts = isPediatric ? pediatricParts : adultParts;
    let selected = [];
    let total = 0;

    const allParts = [...parts.front, ...parts.back];
    const difficulty = Math.floor(Math.random() * 5) + 3;
    while (selected.length < difficulty) {
        const p = allParts[Math.floor(Math.random() * allParts.length)];
        if (!selected.includes(p.id)) {
            selected.push(p.id);
            total += p.percent;
        }
    }
    scenario = {parts, selected, total};
    renderView();
}

function renderView() {
    document.getElementById('svg-container').innerHTML = getSVG(currentView, isPediatric);
}

document.getElementById('toggleViewBtn').addEventListener('click', () => {
    currentView = currentView === 'front' ? 'back' : 'front';
    document.getElementById('toggleViewBtn').textContent = currentView === 'front' ? "Show Back" : "Show Front";
    renderView();
});

document.getElementById('submitBtn').addEventListener('click', () => {
    const userAns = parseFloat(document.getElementById('answer').value);
    let breakdown = "";
    let totalCorrect = 0;

    [...scenario.parts.front, ...scenario.parts.back].forEach(part => {
        if (scenario.selected.includes(part.id)) {
            totalCorrect += part.percent;
            const el = document.getElementById(part.id);
            if (el) el.classList.add('burned');
            breakdown += `${part.name}: ${part.percent}%<br>`;
        }
    });

    const feedback = document.getElementById('feedback');
    if (Math.abs(userAns - totalCorrect) < 0.5) {
        feedback.innerHTML = `✅ Correct! ${totalCorrect}% TBSA burned.`;
    } else {
        feedback.innerHTML = `❌ Incorrect. Correct answer: ${totalCorrect}% TBSA burned.<br><br>
        <strong>Breakdown:</strong><br>${breakdown}<br>
        Risks: Burns to the face may indicate airway involvement, burns to hands can cause long-term disability, perineal burns are high risk for infection.`;
    }
});

startScenario();
</script>
</body>
</html>
