<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Rule of Nines — TBSA Burn Quiz</title>
<style>
  :root{
    --brand:#007B8A; --bg:#f0f8ff; --ink:#123; --card:#ffffff; --muted:#6b7c85;
    --chip:#e8f4f6; --full:#d9534f; --half:#f0ad4e; --none:#c8d7df; --stroke:#233;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;display:flex;flex-direction:column}
  header{background:var(--brand);color:#fff;padding:1rem 1.25rem;text-align:center}
  header h1{margin:0;font-size:1.2rem}
  .wrap{width:min(1100px,100%);margin:0 auto;padding:1rem;display:grid;gap:1rem}
  .controls,.results,.legend,.quiz{background:var(--card);border-radius:.75rem;padding:1rem;box-shadow:0 1px 2px rgba(0,0,0,.05)}
  .row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
  .seg{display:flex;gap:.5rem;flex-wrap:wrap}
  button,input{border:1px solid #cbd5db;border-radius:.6rem;padding:.6rem .8rem;background:#fff;color:var(--ink);outline:0}
  button{background:var(--brand);color:#fff;border:none;cursor:pointer;font-weight:600}
  button.secondary{background:#fff;color:var(--brand);border:1px solid var(--brand)}
  button.danger{background:#9f2f2f}
  .chip{background:var(--chip);border:none;border-radius:.6rem;padding:.5rem .7rem;color:var(--brand);font-weight:600}

  .board{background:var(--card);border-radius:.75rem;padding:.5rem;display:grid;justify-items:center;box-shadow:0 1px 2px rgba(0,0,0,.05)}
  .svg-wrap{width:min(560px,100%);height:auto;position:relative;transition:transform .2s ease}
  .svg-wrap.peds{transform:scale(.92); transform-origin: top center;} /* pediatric slightly smaller */
  svg{width:100%;height:auto}

  /* Zones (calculation areas) */
  .zone{fill:#fdfdfd;stroke:var(--none);stroke-width:2;pointer-events:none;transition:fill .15s,stroke .15s}
  .zone[data-state="0"]{fill:#fdfdfd}
  .zone[data-state="0.5"]{fill:var(--half);stroke:var(--stroke)}
  .zone[data-state="1"]{fill:var(--full);stroke:var(--stroke)}

  /* Silhouette base (visual only) */
  .sil{fill:url(#skinGrad);stroke:#cdb09b;stroke-width:1.1}

  .label{font-size:.72rem;fill:#223;opacity:.85;user-select:none;pointer-events:none}
  .legend{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
  .legend .key{display:flex;align-items:center;gap:.4rem}
  .sw{width:18px;height:12px;border-radius:3px;border:1px solid #9cb0ba}
  .sw.none{background:#fff}
  .sw.half{background:var(--half)}
  .sw.full{background:var(--full)}

  .results{display:grid;gap:.6rem;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));align-items:center}
  .kv{background:var(--chip);padding:.8rem;border-radius:.6rem;display:flex;justify-content:space-between;gap:.5rem;align-items:center}
  .kv b{font-size:1.05rem}

  .quiz .grid{display:grid;gap:.6rem;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
  .feedback{margin-top:.6rem;border-top:1px dashed #d6e3e9;padding-top:.6rem}
  .ok{color:#116e3a}
  .bad{color:#9f2f2f}
  .hint{color:var(--muted);font-size:.9rem}

  .pct-tag{font-size:.72rem;fill:#000;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round;font-weight:700;opacity:.95}
  .risks{margin-top:.6rem;background:#fbfcfe;border:1px solid #e1ebf0;border-radius:.6rem;padding:.6rem}
  .risks h4{margin:.2rem 0 .4rem;font-size:1rem}
  .risks ul{margin:.2rem 0 .2rem 1.1rem}

  /* View toggling (zones only; silhouette stays the same outline for both) */
  .front-group{display:block}
  .back-group{display:none}
  .view-back .front-group{display:none}
  .view-back .back-group{display:block}
</style>
</head>
<body>
<header><h1 id="title">Rule of Nines — TBSA Burn Quiz</h1></header>
<div class="wrap">

  <!-- Controls -->
  <div class="controls">
    <div class="row">
      <span class="chip">Random Adult or Pediatric scenario starts on load. Burns may be on BOTH sides. Use Front/Back.</span>
      <div class="seg" style="margin-left:auto">
        <button id="frontBtn" class="secondary">Front</button>
        <button id="backBtn" class="secondary">Back</button>
        <button id="newScenarioBtn">New Scenario</button>
        <button id="resetBtn" class="danger">Reset</button>
      </div>
    </div>
  </div>

  <!-- Board -->
  <div class="board">
    <div id="svgWrap" class="svg-wrap">
      <!-- ADULT MODEL (single outline; zones swap on same footprint) -->
      <svg id="adultSVG" viewBox="0 0 320 360" role="img" aria-label="Adult Burn Map" class="view-front" style="">
        <defs>
          <linearGradient id="skinGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffe6d1"/>
            <stop offset="100%" stop-color="#f6d5bf"/>
          </linearGradient>
        </defs>

        <!-- ONE silhouette used for both views -->
        <g class="silhouette">
          <!-- head -->
          <path class="sil" d="M160 24c-20 0-36 16-36 36s16 36 36 36 36-16 36-36-16-36-36-36z"/>
          <!-- torso -->

          <!-- arms -->
          <path class="sil" d="M64 120c-10 0-18 8-18 18v190c0 10 8 18 18 18 10 0 18-8 18-18V138c0-10-8-18-18-18z"/>
          <path class="sil" d="M256 120c10 0 18 8 18 18v190c0 10-8 18-18 18-10 0-18-8-18-18V138c0-10 8-18 18-18z"/>
          <!-- pelvis -->
          <path class="sil" d="M120 324h80c14 0 24 10 24 24v12c0 10-8 18-18 18h-92c-10 0-18-8-18-18v-12c0-14 10-24 24-24z"/>
          <!-- legs -->
          <path class="sil" d="M130 378c-14 0-24 10-24 24v220c0 14 10 24 24 24s24-10 24-24V402c0-14-10-24-24-24z" transform="translate(0,-180)"/>
          <path class="sil" d="M190 378c14 0 24 10 24 24v220c0 14-10 24-24 24s-24-10-24-24V402c0-14 10-24 24-24z" transform="translate(0,-180)"/>
        </g>

        <!-- FRONT ZONES (same footprint) -->
        <g class="front-group">
          <ellipse class="zone" cx="160" cy="60" rx="38" ry="40" data-key="head-front" data-state="0"></ellipse>

          <path class="zone" data-key="chest" data-state="0"
            d="M95,115 C105,105 125,102 160,102 C195,102 215,105 225,115
               L225,205 C215,212 195,216 160,216 C125,216 105,212 95,205 Z"></path>

          <path class="zone" data-key="abdomen" data-state="0"
            d="M95,220 C105,212 125,210 160,210 C195,210 215,212 225,220
               L225,325 C210,332 190,336 160,336 C130,336 110,332 95,325 Z"></path>

          <rect class="zone" x="150" y="340" width="20" height="16" rx="6" ry="6" data-key="perineum" data-state="0"></rect>

          <path class="zone" data-key="armL-front" data-state="0"
            d="M70,130 C60,135 56,145 56,160 L56,350 C56,365 62,375 74,378
               C86,375 92,365 92,350 L92,160 C92,145 88,135 78,130 Z"></path>

          <path class="zone" data-key="armR-front" data-state="0"
            d="M248,130 C238,135 234,145 234,160 L234,350 C234,365 240,375 252,378
               C264,375 270,365 270,350 L270,160 C270,145 266,135 256,130 Z"></path>

          <path class="zone" data-key="legL-front" data-state="0"
            d="M120,180 C115,205 114,240 114,280 L114,320
               C114,345 124,380 150,390 C170,380 176,350 176,320
               L176,280 C176,240 175,205 170,180 Z"></path>

          <path class="zone" data-key="legR-front" data-state="0"
            d="M144,180 C139,205 138,240 138,280 L138,320
               C138,345 148,380 174,390 C194,380 200,350 200,320
               L200,280 C200,240 199,205 194,180 Z"></path>

          <text class="label" x="160" y="100" text-anchor="middle">Front</text>
        </g>

        <!-- BACK ZONES (same footprint as front) -->
        <g class="back-group">
          <ellipse class="zone" cx="160" cy="60" rx="38" ry="40" data-key="head-back" data-state="0"></ellipse>

          <path class="zone" data-key="upper-back" data-state="0"
            d="M95,115 C110,105 133,102 160,102 C187,102 210,105 225,115
               L225,205 C210,212 187,216 160,216 C133,216 110,212 95,205 Z"></path>

          <path class="zone" data-key="lower-back" data-state="0"
            d="M95,220 C110,228 133,232 160,232 C187,232 210,228 225,220
               L225,325 C210,330 187,334 160,334 C133,334 110,330 95,325 Z"></path>

          <path class="zone" data-key="armL-back" data-state="0"
            d="M70,130 C60,135 56,145 56,160 L56,350 C56,365 62,375 74,378
               C86,375 92,365 92,350 L92,160 C92,145 88,135 78,130 Z"></path>

          <path class="zone" data-key="armR-back" data-state="0"
            d="M248,130 C238,135 234,145 234,160 L234,350 C234,365 240,375 252,378
               C264,375 270,365 270,350 L270,160 C270,145 266,135 256,130 Z"></path>

          <path class="zone" data-key="legL-back" data-state="0"
            d="M120,180 C115,205 114,240 114,280 L114,320
               C114,345 124,380 150,390 C170,380 176,350 176,320
               L176,280 C176,240 175,205 170,180 Z"></path>

          <path class="zone" data-key="legR-back" data-state="0"
            d="M144,180 C139,205 138,240 138,280 L138,320
               C138,345 148,380 174,390 C194,380 200,350 200,320
               L200,280 C200,240 199,205 194,180 Z"></path>

          <text class="label" x="160" y="100" text-anchor="middle">Back</text>
        </g>
      </svg>

      <!-- PEDIATRIC MODEL (single outline; same footprint for both views) -->
      <svg id="pedsSVG" viewBox="0 0
