<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rule of Nines Burn Area Quiz</title>
<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin: 0;
        padding: 0;
        background: #f0f8ff;
    }
    header {
        background: #007B8A;
        color: white;
        padding: 1rem;
        font-size: 1.5rem;
    }
    svg {
        max-width: 300px;
        height: auto;
        margin: 1rem auto;
        display: block;
    }
    .selected {
        fill: red !important;
    }
    #pediatric {
        transform: scale(0.8);
        transform-origin: center;
    }
    .burned {
        fill: orange !important;
    }
    #question {
        font-size: 1.2rem;
        margin-top: 1rem;
    }
    input[type="number"] {
        padding: 0.5rem;
        font-size: 1rem;
        width: 80px;
        text-align: center;
    }
    button {
        padding: 0.5rem 1rem;
        font-size: 1rem;
        margin-top: 1rem;
        background: #007B8A;
        color: white;
        border: none;
        cursor: pointer;
    }
    button:hover {
        background: #005f65;
    }
    #feedback {
        margin-top: 1rem;
        font-size: 1rem;
        font-weight: bold;
    }
</style>
</head>
<body>
<header>Rule of Nines Burn Area Quiz</header>

<div id="svg-container"></div>

<div id="question">Estimate the %TBSA burned:</div>
<input type="number" id="answer" min="0" max="100"> %
<br>
<button id="submitBtn">Submit</button>

<div id="feedback"></div>

<script>
const adultParts = [
    {id:"head-front", percent:4.5}, {id:"head-back", percent:4.5},
    {id:"arm-left-front", percent:4.5}, {id:"arm-left-back", percent:4.5},
    {id:"arm-right-front", percent:4.5}, {id:"arm-right-back", percent:4.5},
    {id:"leg-left-front", percent:9}, {id:"leg-left-back", percent:9},
    {id:"leg-right-front", percent:9}, {id:"leg-right-back", percent:9},
    {id:"torso-front", percent:18}, {id:"torso-back", percent:18},
    {id:"perineum", percent:1}
];

const pediatricParts = [
    {id:"head-front", percent:9}, {id:"head-back", percent:9},
    {id:"arm-left-front", percent:4.5}, {id:"arm-left-back", percent:4.5},
    {id:"arm-right-front", percent:4.5}, {id:"arm-right-back", percent:4.5},
    {id:"leg-left-front", percent:7}, {id:"leg-left-back", percent:7},
    {id:"leg-right-front", percent:7}, {id:"leg-right-back", percent:7},
    {id:"torso-front", percent:18}, {id:"torso-back", percent:18},
    {id:"perineum", percent:1}
];

function getSVG(isPediatric) {
    return `
    <svg id="${isPediatric ? 'pediatric' : 'adult'}" viewBox="0 0 200 500">
        <rect id="head-front" x="80" y="10" width="40" height="40" fill="#ffe0bd" stroke="#000"/>
        <rect id="torso-front" x="70" y="50" width="60" height="100" fill="#ffe0bd" stroke="#000"/>
        <rect id="arm-left-front" x="40" y="50" width="30" height="100" fill="#ffe0bd" stroke="#000"/>
        <rect id="arm-right-front" x="130" y="50" width="30" height="100" fill="#ffe0bd" stroke="#000"/>
        <rect id="leg-left-front" x="80" y="150" width="30" height="120" fill="#ffe0bd" stroke="#000"/>
        <rect id="leg-right-front" x="110" y="150" width="30" height="120" fill="#ffe0bd" stroke="#000"/>
        <rect id="perineum" x="95" y="270" width="10" height="10" fill="#ffe0bd" stroke="#000"/>
        <rect id="head-back" x="80" y="290" width="40" height="40" fill="#ffe0bd" stroke="#000"/>
        <rect id="torso-back" x="70" y="330" width="60" height="100" fill="#ffe0bd" stroke="#000"/>
        <rect id="arm-left-back" x="40" y="330" width="30" height="100" fill="#ffe0bd" stroke="#000"/>
        <rect id="arm-right-back" x="130" y="330" width="30" height="100" fill="#ffe0bd" stroke="#000"/>
        <rect id="leg-left-back" x="80" y="430" width="30" height="120" fill="#ffe0bd" stroke="#000"/>
        <rect id="leg-right-back" x="110" y="430" width="30" height="120" fill="#ffe0bd" stroke="#000"/>
    </svg>
    `;
}

function randomScenario() {
    const isPediatric = Math.random() > 0.5;
    const parts = isPediatric ? pediatricParts : adultParts;
    document.getElementById('svg-container').innerHTML = getSVG(isPediatric);
    let selected = [];
    let total = 0;
    const difficulty = Math.floor(Math.random() * 5) + 3; // 3-7 parts
    while (selected.length < difficulty) {
        const part = parts[Math.floor(Math.random() * parts.length)];
        if (!selected.includes(part.id)) {
            selected.push(part.id);
            total += part.percent;
        }
    }
    return {parts, selected, total, isPediatric};
}

let scenario = randomScenario();

document.getElementById('submitBtn').addEventListener('click', () => {
    const userAns = parseFloat(document.getElementById('answer').value);
    const feedback = document.getElementById('feedback');
    const svgEl = document.querySelector('svg');
    scenario.selected.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.classList.add('burned');
    });
    if (Math.abs(userAns - scenario.total) < 0.5) {
        feedback.innerHTML = `✅ Correct! ${scenario.total}% TBSA burned.`;
    } else {
        feedback.innerHTML = `❌ Incorrect. Correct answer: ${scenario.total}% TBSA burned.<br>
        Risks: Burns to the face may indicate airway involvement, burns to hands can cause long-term disability, 
        perineal burns are high risk for infection.`;
    }
});
</script>

</body>
</html>
