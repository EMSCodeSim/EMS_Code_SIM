<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Visual Neuro & Stroke Assessment | EMSCodeSim</title><link rel="stylesheet" href="/vitals/visual-assessment-suite.css?v=2318"></head><body>
<main class="va-shell"><header class="va-head"><div><small>VISUAL ASSESSMENT MINI SIM</small><h1>Visual Neuro & Stroke Assessment</h1></div><small>Perform → observe → document</small></header>
<section class="va-card va-stage"><div class="va-visual"><div style="text-align:center"><div class="va-stroke-face">🙂</div><div class="arms"><span>💪</span><span id="arm2">💪</span></div><div class="sound-chip" id="speechSample">“The sky is blue in Cincinnati.”</div><p id="neuroObservation" style="max-width:350px;margin:10px auto 0;text-align:center;font-weight:750;color:#36566a">Perform each neurologic check and compare both sides.</p></div></div><div class="va-controls"><button class="va-btn" data-n="face">Assess facial symmetry</button><button class="va-btn" data-n="arms">Check arm drift / strength</button><button class="va-btn" data-n="speech">Assess speech</button><button class="va-btn" data-n="sensation">Compare sensation</button><button class="va-btn" data-n="lkw">Determine last known well</button></div></section>
<section id="result" class="va-card va-result">Complete the neurologic checks before documenting your impression.</section></main>
<script src="/vitals/patient-record.js"></script><script src="/vitals/scenario-definitions.js?v=2219"></script><script src="/vitals/scenario-session.js?v=5"></script><script src="/vitals/scenario-runtime.js?v=2223"></script><script src="/vitals/visual-assessment-suite.js?v=2026.08.11.3"></script><script>let s=new Set,interpreting=false;const finding=String(VA.vital('motor_sensory','No focal neurologic deficit')),lower=finding.toLowerCase(),abnormal=/drift|weak|deficit|slur|droop|numb|unequal|aphasia/.test(lower),correct=abnormal?'focal':'normal';const observation=document.querySelector('#neuroObservation');
function clue(kind){if(kind==='face')return /droop|facial/.test(lower)?'One side of the face does not move symmetrically.':'Facial movement appears symmetric.';if(kind==='arms')return /drift|weak/.test(lower)?'One arm drifts or demonstrates reduced strength compared with the other.':'Both arms remain elevated with similar strength.';if(kind==='speech')return /slur|aphasia|speech/.test(lower)?'The patient’s speech is abnormal during the phrase.':'The patient repeats the phrase clearly without obvious language difficulty.';if(kind==='sensation')return /numb|sensation|sensory/.test(lower)&&!/intact|normal/.test(lower)?'Sensation differs from side to side.':'Sensation is reported as similar on both sides.';return 'Last-known-well information is obtained and should be included with any suspected stroke finding.'}
document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{s.add(b.dataset.n);b.classList.add('done');VA.click();if(b.dataset.n==='arms'&&/drift|weak/.test(lower))document.querySelector('#arm2').classList.add('drift');if(b.dataset.n==='face'&&/droop/.test(lower))document.querySelector('.va-stroke-face')?.classList.add('face-droop');if(b.dataset.n==='speech'&&/slur|aphasia/.test(lower)){const speech=document.querySelector('#speechSample');if(speech)speech.textContent='Speech is difficult to understand during the test phrase.'}if(observation)observation.textContent=clue(b.dataset.n);if(!interpreting&&s.size===5){interpreting=true;VA.interpret({key:'motor_sensory',label:'Neuro / Stroke',prompt:'How would you document this neurologic exam?',help:'Base your finding on facial symmetry, arm drift/strength, speech, and sensation.',expectedFinding:finding,correctValue:correct,choices:[{value:'normal',label:'No focal neurologic deficit identified'},{value:'focal',label:'Focal neurologic deficit / positive stroke finding present'},{value:'uncertain',label:'Unable to determine from this examination'}]})}});</script></body></html>
