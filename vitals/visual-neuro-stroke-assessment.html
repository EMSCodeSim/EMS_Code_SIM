<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Visual Neuro & Stroke Assessment | EMSCodeSim</title><link rel="stylesheet" href="/vitals/visual-assessment-suite.css?v=2318"></head><body>
<main class="va-shell"><header class="va-head"><div><small>VISUAL ASSESSMENT MINI SIM</small><h1>Visual Neuro & Stroke Assessment</h1></div><small>Perform → observe → document</small></header>
<section class="va-card va-stage"><div class="va-visual"><div style="text-align:center"><div class="va-stroke-face">🙂</div><div class="arms"><span>💪</span><span id="arm2">💪</span></div><div class="sound-chip">“The sky is blue in Cincinnati.”</div></div></div><div class="va-controls"><button class="va-btn" data-n="face">Assess facial symmetry</button><button class="va-btn" data-n="arms">Check arm drift / strength</button><button class="va-btn" data-n="speech">Assess speech</button><button class="va-btn" data-n="sensation">Compare sensation</button><button class="va-btn" data-n="lkw">Determine last known well</button></div></section>
<section id="result" class="va-card va-result">Perform the assessment to reveal findings.</section></main>
<script src="/vitals/patient-record.js"></script><script src="/vitals/scenario-definitions.js?v=2219"></script><script src="/vitals/scenario-session.js?v=5"></script><script src="/vitals/scenario-runtime.js?v=2223"></script><script src="/vitals/visual-assessment-suite.js?v=2318"></script><script>let s=new Set;const finding=String(VA.vital('motor_sensory','No focal neurologic deficit')),abnormal=/drift|weak|deficit|slur|droop/i.test(finding);
document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{s.add(b.dataset.n);b.classList.add('done');VA.click();if(b.dataset.n==='arms'&&abnormal)document.querySelector('#arm2').classList.add('drift');if(b.dataset.n==='face'&&/droop/i.test(finding))document.querySelector('.va-stroke-face')?.classList.add('face-droop');if(s.size===5)VA.result('motor_sensory','Neuro / Stroke',finding,finding)});</script></body></html>
