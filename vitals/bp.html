<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Blood Pressure Simulator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <style>
    :root{
      --bg:#e2e8f0; /* lighter background for readability */
      --card:#111827; --muted:#94a3b8; --text:#e5e7eb;
      --accent:#22d3ee; --accent-2:#ef4444; --ring: rgba(34, 211, 238, .35);
    }
    *{box-sizing:border-box}
    html,body{height:100%; touch-action: manipulation;}
    body{
      margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background:var(--bg); color:var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    .app{max-width:480px;margin:0 auto;padding:env(safe-area-inset-top)16px env(safe-area-inset-bottom);
      display:flex;flex-direction:column;min-height:100dvh;gap:16px;}
    .header{text-align:center;padding-top:8px;color:#1e293b;}
    .title{margin:6px 0 0;font-weight:700;font-size:1.15rem;letter-spacing:.2px;}
    .subtitle{margin-top:4px;color:#334155;font-size:.9rem;}
    .card{background:linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.01));
      border:1px solid rgba(255,255,255,.06);border-radius:18px;padding:14px;
      box-shadow:0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.04);}
    #gauge-container{position:relative;width:min(92vw,360px);height:min(92vw,360px);margin:0 auto;}
    #dial{width:100%;height:100%;display:block;filter:drop-shadow(0 4px 16px rgba(0,0,0,.35));
      border-radius:50%;user-select:none;-webkit-user-drag:none;}
    #needle{position:absolute;width:4px;height:44%;top:50%;left:50%;
      background:linear-gradient(180deg,#fecaca 0%,#ef4444 60%,#7f1d1d 100%);
      transform-origin:bottom center;transform:rotate(-180deg);transition:transform .08s linear;
      z-index:2;margin-left:-2px;margin-top:calc(-44%);}
    .hub{position:absolute;width:18px;height:18px;border-radius:50%;
      background:radial-gradient(circle at 35% 35%, #fff, #c7c7c7 45%, #444 65%, #111 100%);
      top:50%;left:50%;transform:translate(-50%,-50%);box-shadow:0 2px 6px rgba(0,0,0,.5);z-index:3;}
    .readouts{display:flex;justify-content:space-between;gap:10px;margin-top:10px;color:var(--muted);font-size:.95rem;}
    .readouts b{color:var(--text);}
    .controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:12px;}
    .btn{
      appearance:none;border:1px solid rgba(255,255,255,.08);
      background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.02));
      color:var(--text);border-radius:14px;padding:12px 12px;font-weight:700;font-size:1rem;letter-spacing:.2px;
      box-shadow:0 8px 18px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.06);
      transition:transform .04s ease;
      touch-action: manipulation; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color: transparent;
    }
    .btn:active{transform:translateY(1px) scale(.99);}
    .btn-primary{border-color:rgba(34,211,238,.5);}
    .btn-danger{border-color:rgba(239,68,68,.45);}
    .btn-ghost{border-color:rgba(255,255,255,.12);}
    .slider-wrap{margin-top:10px;}
    .slider-label{display:flex;justify-content:space-between;align-items:center;font-size:.92rem;color:var(--muted);margin-bottom:8px;}
    input[type="range"]{width:100%;appearance:none;height:14px;
      background:linear-gradient(90deg, rgba(34,211,238,.35), rgba(34,211,238,.15));
      border-radius:999px;outline:none;border:1px solid rgba(255,255,255,.08);}
    input[type="range"]::-webkit-slider-thumb{appearance:none;width:28px;height:28px;border-radius:50%;
      background:radial-gradient(circle at 35% 35%, #fff, #e5e7eb 55%, #94a3b8 100%);
      border:1px solid rgba(0,0,0,.25);box-shadow:0 6px 14px rgba(0,0,0,.45);margin-top:-7px;}
    .footer{margin-top:auto;text-align:center;color:#334155;font-size:.8rem;opacity:.8;padding-bottom:4px;}
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="title">Blood Pressure Simulator</div>
      <div class="subtitle">Pump to inflate • Toggle release • Beat plays between SYS→DIA</div>
    </div>

    <div class="card">
      <div id="gauge-container">
        <img id="dial" src="bp_dial.png" alt="Gauge Dial" />
        <div id="needle"></div>
        <div class="hub"></div>
      </div>

      <div class="readouts">
        <div>Pressure: <b id="pressureDisplay">0</b> mmHg</div>
        <div>BP: <b id="bpReading">—/—</b></div>
      </div>

      <div class="controls">
        <button class="btn btn-primary" id="pumpBtn">Pump +10</button>
        <button class="btn btn-danger" id="releaseBtn">Release</button>
        <button class="btn btn-ghost" id="resetBtn">Reset</button>
      </div>

      <div class="slider-wrap">
        <div class="slider-label">
          <span>Deflation speed</span>
          <span><b id="speedValue">0.5</b> mmHg/step</span>
        </div>
        <input type="range" id="speedSlider" min="0.2" max="5" step="0.1" value="0.5">
      </div>
    </div>

    <div class="footer">v1.3 • Mid-pump beats • High contrast background</div>
  </div>

  <script>
    let currentPressure = 0, systolic = 120, diastolic = 80;
    let scenarioActive = false, releasing = false, beatStarted = false;
    const needle = document.getElementById("needle");
    const pressureDisplay = document.getElementById("pressureDisplay");
    const bpReading = document.getElementById("bpReading");
    const speedSlider = document.getElementById("speedSlider");
    const speedValueText = document.getElementById("speedValue");
    const pumpBtn = document.getElementById("pumpBtn");
    const releaseBtn = document.getElementById("releaseBtn");
    const resetBtn = document.getElementById("resetBtn");
    let audioCtx = null, beatBuffer = null, beatTimer = null;

    function ensureAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      if (!beatBuffer) {
        const duration = 0.18, sr = audioCtx.sampleRate;
        const length = Math.floor(duration * sr);
        beatBuffer = audioCtx.createBuffer(1, length, sr);
        const ch = beatBuffer.getChannelData(0), freq = 1000;
        const attack = Math.floor(0.01 * sr), release = Math.floor(0.16 * sr);
        for (let i = 0; i < length; i++) {
          const t = i / sr;
          let env = i < attack ? i / attack : Math.exp(-4 * (i - attack) / release);
          ch[i] = Math.sin(2 * Math.PI * freq * t) * 0.9 * env;
        }
      }
    }
    function playBeat() {
      if (!audioCtx || !beatBuffer) return;
      const src = audioCtx.createBufferSource();
      src.buffer = beatBuffer;
      src.connect(audioCtx.destination);
      src.start();
    }
    function startHeartbeat() {
      if (beatStarted) return;
      beatStarted = true;
      playBeat();
      beatTimer = setInterval(playBeat, 666);
    }
    function stopHeartbeat() {
      beatStarted = false;
      clearInterval(beatTimer);
      beatTimer = null;
    }
    function pressureToAngle(p) {
      return (p / 280) * 360 - 180;
    }
    function updateNeedle() {
      const angle = pressureToAngle(currentPressure);
      needle.style.transform = `rotate(${angle}deg)`;
      pressureDisplay.textContent = Math.round(currentPressure);
    }
    function updateSpeedDisplay(val) { speedValueText.textContent = val; }
    speedSlider.addEventListener("input", e => updateSpeedDisplay(e.target.value));

    pumpBtn.addEventListener("click", () => {
      ensureAudio();
      currentPressure = Math.min(280, currentPressure + 10);
      updateNeedle();
      if (scenarioActive) {
        // New logic: play beat if within range even while pumping
        if (currentPressure <= systolic && currentPressure >= diastolic) {
          startHeartbeat();
        } else {
          stopHeartbeat();
        }
      }
    });

    releaseBtn.addEventListener("click", () => {
      ensureAudio();
      if (!scenarioActive) {
        scenarioActive = true;
        systolic = Math.floor(Math.random() * (222 - 100 + 1)) + 100;
        diastolic = Math.max(40, Math.floor(systolic * 0.6));
        if (diastolic >= systolic) diastolic = systolic - 10;
        bpReading.textContent = `${systolic}/${diastolic}`;
        releasing = true;
        releaseBtn.textContent = "Pause Release";
        return;
      }
      releasing = !releasing;
      releaseBtn.textContent = releasing ? "Pause Release" : "Resume Release";
    });

    resetBtn.addEventListener("click", () => {
      stopHeartbeat();
      scenarioActive = false; releasing = false; currentPressure = 0;
      updateNeedle(); bpReading.textContent = "—/—";
      releaseBtn.textContent = "Release";
    });

    const TICK_MS = 90;
    setInterval(() => {
      if (!releasing) return;
      if (currentPressure <= 0) {
        currentPressure = 0; updateNeedle();
        releasing = false; scenarioActive = false;
        stopHeartbeat(); bpReading.textContent = "—/—";
        releaseBtn.textContent = "Release"; return;
      }
      const step = parseFloat(speedSlider.value) || 0.5;
      const prev = currentPressure;
      currentPressure = Math.max(0, currentPressure - step);
      updateNeedle();
      if (scenarioActive) {
        if (!beatStarted && prev >= systolic && currentPressure <= systolic) {
          startHeartbeat();
        }
        if (beatStarted && currentPressure <= diastolic) {
          stopHeartbeat();
        }
      }
    }, TICK_MS);

    updateNeedle();
    updateSpeedDisplay(speedSlider.value);
    ["touchstart","mousedown"].forEach(evt=>{
      pumpBtn.addEventListener(evt, ensureAudio, {passive:true, once:true});
      releaseBtn.addEventListener(evt, ensureAudio, {passive:true, once:true});
      resetBtn.addEventListener(evt, ensureAudio, {passive:true, once:true});
    });
  </script>
</body>
</html>
