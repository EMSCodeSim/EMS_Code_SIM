<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Blood Pressure Simulator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <style>
    :root{
      /* High-contrast, easy-to-read theme */
      --bg:#f7fafc;           /* very light page background */
      --card:#ffffff;         /* white card */
      --text:#0f172a;         /* slate-900 for headings/labels */
      --muted:#334155;        /* slate-700 for secondary text */
      --accent:#0284c7;       /* sky-700 for actions */
      --accent-2:#dc2626;     /* red-600 for release */
      --ring: rgba(2,132,199,.35);
      --shadow: 0 10px 28px rgba(15,23,42,.12);
    }
    *{box-sizing:border-box}
    html,body{height:100%; touch-action: manipulation;}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background:var(--bg);
      color:var(--text);
      -webkit-tap-highlight-color: transparent;
    }

    .app{
      max-width:540px;
      margin:0 auto;
      padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom);
      display:flex; flex-direction:column; min-height:100dvh; gap:18px;
    }
    .header{text-align:center; padding-top:6px;}
    .title{margin:4px 0 0; font-weight:800; font-size:1.35rem; letter-spacing:.2px;}
    .subtitle{margin-top:6px; color:var(--muted); font-size:1rem;}

    .card{
      background:var(--card);
      border:1px solid rgba(15,23,42,.08);
      border-radius:18px;
      padding:16px;
      box-shadow: var(--shadow);
    }

    /* Gauge */
    #gauge-container{
      position:relative;
      width:min(94vw, 420px);
      height:min(94vw, 420px);
      margin: 4px auto 0;
    }
    #dial{
      width:100%; height:100%; display:block; border-radius:50%;
      user-select:none; -webkit-user-drag:none;
      filter: drop-shadow(0 6px 20px rgba(0,0,0,.18));
    }
    /* clearer needle: thicker, high-contrast gradient, subtle glow */
    #needle{
      position:absolute;
      width:5px;                       /* thicker for readability */
      height:44%;
      top:50%; left:50%;
      background: linear-gradient(180deg, #fee2e2 0%, #ef4444 55%, #7f1d1d 100%);
      box-shadow: 0 0 12px rgba(239,68,68,.35);
      transform-origin: bottom center;
      transform: rotate(-180deg);       /* 0 mmHg at bottom */
      transition: transform .075s linear;
      z-index:2;
      margin-left:-2.5px;
      margin-top: calc(-44%);
    }
    .hub{
      position:absolute; width:22px; height:22px; border-radius:50%;
      background: radial-gradient(circle at 35% 35%, #f8fafc, #cbd5e1 55%, #64748b 72%, #111827 100%);
      top:50%; left:50%; transform:translate(-50%,-50%);
      box-shadow: 0 2px 10px rgba(0,0,0,.3); z-index:3;
    }

    /* Readouts */
    .readouts{
      display:flex; justify-content:space-between; gap:12px; margin-top:14px;
      color:var(--muted); font-size:1.05rem;
    }
    .readouts b{ color:var(--text); font-size:1.35rem; font-weight:800; }

    /* Controls */
    .controls{
      display:grid; grid-template-columns: 1fr 1fr 1fr; gap:12px; margin-top:14px;
    }
    .btn{
      appearance:none; border:1px solid rgba(15,23,42,.14);
      background:linear-gradient(180deg, #f8fafc 0%, #eef2f7 100%);
      color:var(--text);
      border-radius:14px; padding:14px 16px;
      font-weight:800; font-size:1.05rem; letter-spacing:.2px;
      box-shadow: 0 6px 16px rgba(15,23,42,.08), inset 0 1px 0 rgba(255,255,255,.8);
      transition: transform .04s ease, box-shadow .2s ease, border-color .2s ease, background .2s ease;
      touch-action: manipulation; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color: transparent;
    }
    .btn:active{ transform: translateY(1px) scale(.99); }
    .btn:focus-visible{ outline:2px solid var(--ring); outline-offset:2px; }
    .btn-primary{
      background: linear-gradient(180deg, #06b6d4 0%, #0284c7 100%);
      border-color: rgba(2,132,199,.6);
      color: #ffffff;
    }
    .btn-danger{
      background: linear-gradient(180deg, #ef4444 0%, #b91c1c 100%);
      border-color: rgba(220,38,38,.6);
      color:#ffffff;
    }
    .btn-ghost{
      background: linear-gradient(180deg, #f8fafc 0%, #eef2f7 100%);
    }

    /* Slider */
    .slider-wrap{ margin-top:12px; }
    .slider-label{
      display:flex; justify-content:space-between; align-items:center;
      font-size:1rem; color:var(--muted); margin-bottom:10px;
    }
    .slider-label b{ color:var(--text); font-size:1.1rem; }
    input[type="range"]{
      width:100%; appearance:none; height:16px;
      background:linear-gradient(90deg, rgba(2,132,199,.25), rgba(2,132,199,.12));
      border-radius:999px; outline:none; border:1px solid rgba(15,23,42,.14);
    }
    input[type="range"]::-webkit-slider-thumb{
      appearance:none; width:32px; height:32px; border-radius:50%;
      background: radial-gradient(circle at 35% 35%, #ffffff, #e5e7eb 55%, #94a3b8 100%);
      border:1px solid rgba(0,0,0,.2); box-shadow: 0 8px 18px rgba(0,0,0,.18); margin-top:-8px;
    }

    .footer{ margin-top:auto; text-align:center; color:var(--muted); font-size:.85rem; opacity:.9; padding-bottom:6px; }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="title">Blood Pressure Simulator</div>
      <div class="subtitle">Pump to inflate • Toggle release • Beat plays between SYS→DIA</div>
    </div>

    <div class="card">
      <div id="gauge-container">
        <img id="dial" src="bp_dial.png" alt="Gauge Dial" />
        <div id="needle"></div>
        <div class="hub"></div>
      </div>

      <div class="readouts">
        <div>Pressure: <b id="pressureDisplay">0</b> mmHg</div>
        <div>BP: <b id="bpReading">—/—</b></div>
      </div>

      <div class="controls">
        <button class="btn btn-primary" id="pumpBtn">Pump +10</button>
        <button class="btn btn-danger" id="releaseBtn">Release</button>
        <button class="btn btn-ghost"  id="resetBtn">Reset</button>
      </div>

      <div class="slider-wrap">
        <div class="slider-label">
          <span>Deflation speed</span>
          <span><b id="speedValue">0.5</b> mmHg/step</span>
        </div>
        <input type="range" id="speedSlider" min="0.2" max="5" step="0.1" value="0.5">
      </div>
    </div>

    <div class="footer">v1.4 • Readability pass • Scenario persists • Low-latency beat</div>
  </div>

  <script>
    // --- State ---
    let currentPressure = 0;
    let systolic = 120;
    let diastolic = 80;
    let scenarioActive = false;  // set on first Release
    let releasing = false;       // valve open/close toggle
    let beatStarted = false;

    // --- Elements ---
    const needle = document.getElementById("needle");
    const pressureDisplay = document.getElementById("pressureDisplay");
    const bpReading = document.getElementById("bpReading");
    const speedSlider = document.getElementById("speedSlider");
    const speedValueText = document.getElementById("speedValue");
    const pumpBtn = document.getElementById("pumpBtn");
    const releaseBtn = document.getElementById("releaseBtn");
    const resetBtn = document.getElementById("resetBtn");

    // --- Audio (prebuilt buffer for instant playback) ---
    let audioCtx = null, beatBuffer = null, beatTimer = null;

    function ensureAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      if (!beatBuffer) {
        const duration = 0.18, sr = audioCtx.sampleRate;
        const length = Math.floor(duration * sr);
        beatBuffer = audioCtx.createBuffer(1, length, sr);
        const ch = beatBuffer.getChannelData(0), freq = 1000;
        const attack = Math.floor(0.01 * sr), release = Math.floor(0.16 * sr);
        for (let i = 0; i < length; i++) {
          const t = i / sr;
          let env = i < attack ? i / attack : Math.exp(-4 * (i - attack) / release);
          ch[i] = Math.sin(2 * Math.PI * freq * t) * 0.9 * env;
        }
      }
    }
    function playBeat() {
      if (!audioCtx || !beatBuffer) return;
      const src = audioCtx.createBufferSource();
      src.buffer = beatBuffer;
      src.connect(audioCtx.destination);
      src.start();
    }
    function startHeartbeat() {
      if (beatStarted) return;
      beatStarted = true;
      playBeat();                   // immediate first beat
      beatTimer = setInterval(playBeat, 666); // ~90 bpm
    }
    function stopHeartbeat() {
      beatStarted = false;
      clearInterval(beatTimer);
      beatTimer = null;
    }

    // --- Dial math (clockwise full circle, 0–280 mmHg) ---
    // 0→-180° (bottom), 140→0° (top), 280→180° (bottom again)
    function pressureToAngle(p) { return (p / 280) * 360 - 180; }

    function updateNeedle() {
      const angle = pressureToAngle(currentPressure);
      needle.style.transform = `rotate(${angle}deg)`;
      pressureDisplay.textContent = Math.round(currentPressure);
    }

    function updateSpeedDisplay(val) { speedValueText.textContent = val; }
    speedSlider.addEventListener("input", e => updateSpeedDisplay(e.target.value));

    // --- Controls ---
    pumpBtn.addEventListener("click", () => {
      ensureAudio();
      currentPressure = Math.min(280, currentPressure + 10);
      updateNeedle();

      // If a scenario is active, heartbeat should play while pumping if inside SYS..DIA
      if (scenarioActive) {
        if (currentPressure <= systolic && currentPressure >= diastolic) startHeartbeat();
        else stopHeartbeat();
      }
    });

    releaseBtn.addEventListener("click", () => {
      ensureAudio();

      // First time: start a scenario and open valve
      if (!scenarioActive) {
        scenarioActive = true;
        systolic = Math.floor(Math.random() * (222 - 100 + 1)) + 100;  // 100–222
        diastolic = Math.max(40, Math.floor(systolic * 0.6));          // ~60–70% of SYS
        if (diastolic >= systolic) diastolic = systolic - 10;
        bpReading.textContent = `${systolic}/${diastolic}`;
        releasing = true;
        releaseBtn.textContent = "Pause Release";
        return;
      }

      // Toggle valve open/closed without resetting the scenario
      releasing = !releasing;
      releaseBtn.textContent = releasing ? "Pause Release" : "Resume Release";
    });

    resetBtn.addEventListener("click", () => {
      stopHeartbeat();
      scenarioActive = false; releasing = false;
      currentPressure = 0; updateNeedle();
      bpReading.textContent = "—/—";
      releaseBtn.textContent = "Release";
    });

    // --- Single loop to deflate and manage heartbeat windows ---
    const TICK_MS = 90;
    setInterval(() => {
      if (!releasing) return;

      if (currentPressure <= 0) {
        currentPressure = 0; updateNeedle();
        // End scenario cleanly
        releasing = false; scenarioActive = false;
        stopHeartbeat(); bpReading.textContent = "—/—";
        releaseBtn.textContent = "Release";
        return;
      }

      const step = parseFloat(speedSlider.value) || 0.5;
      const prev = currentPressure;

      currentPressure = Math.max(0, currentPressure - step);
      updateNeedle();

      if (!scenarioActive) return;

      // On deflation, start when crossing SYS downward; stop when <= DIA
      if (!beatStarted && prev >= systolic && currentPressure <= systolic) startHeartbeat();
      if (beatStarted && currentPressure <= diastolic) stopHeartbeat();
    }, TICK_MS);

    // Init
    updateNeedle();
    updateSpeedDisplay(speedSlider.value);

    // Prime audio on first touch/click (iOS/Android policies)
    ["touchstart","mousedown"].forEach(evt=>{
      pumpBtn.addEventListener(evt, ensureAudio, {passive:true, once:true});
      releaseBtn.addEventListener(evt, ensureAudio, {passive:true, once:true});
      resetBtn.addEventListener(evt, ensureAudio, {passive:true, once:true});
    });
  </script>
</body>
</html>
