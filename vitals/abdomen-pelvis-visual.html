<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Abdomen & Pelvis Assessment | EMSCodeSim</title><link rel="stylesheet" href="/vitals/visual-assessment-suite.css?v=2318"></head><body>
<main class="va-shell"><header class="va-head"><div><small>VISUAL ASSESSMENT MINI SIM</small><h1>Abdomen & Pelvis Assessment</h1></div><small>Perform → observe → document</small></header>
<section class="va-card va-stage"><div class="va-visual"><div class="va-abdomen"><button class="quad" data-q="RUQ">RUQ</button><button class="quad" data-q="LUQ">LUQ</button><button class="quad" data-q="RLQ">RLQ</button><button class="quad" data-q="LLQ">LLQ</button></div></div><div class="va-controls"><button class="va-btn" data-step="inspect">Inspect abdomen</button><button class="va-btn" data-step="palpate">Palpate all four quadrants</button><button class="va-btn" data-step="pelvis">Assess pelvis/hip visually and by appropriate gentle exam</button><small>Do not repeatedly compress an unstable pelvis.</small></div></section>
<section id="result" class="va-card va-result">Perform the assessment to reveal findings.</section></main>
<script src="/vitals/patient-record.js"></script><script src="/vitals/scenario-definitions.js?v=2219"></script><script src="/vitals/scenario-session.js?v=5"></script><script src="/vitals/scenario-runtime.js?v=2223"></script><script src="/vitals/visual-assessment-suite.js?v=2318"></script><script>let q=new Set,s=new Set;const finding=String(VA.vital('abdominal_assessment',VA.vital('abdomen','Soft, non-tender'))),pelvis=String(VA.vital('pelvis_hip','Stable without tenderness'));
document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{q.add(b.dataset.q);b.classList.add('active');VA.click();if(/tender/i.test(finding)&&!/^non.?tender/i.test(finding))b.classList.add('tender');check()});
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{s.add(b.dataset.step);b.classList.add('done');VA.click();if(b.dataset.step==='pelvis'&&/pain|tender|unstable/i.test(pelvis))document.querySelector('.va-abdomen')?.classList.add('pelvic-alert');check()});
function check(){if(q.size===4&&s.size===3)VA.result('abdominal_assessment','Abdomen / Pelvis',`${finding}; ${pelvis}`,`${finding}; ${pelvis}`)}</script></body></html>
