<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Abdomen & Pelvis Assessment | EMSCodeSim</title><link rel="stylesheet" href="/vitals/visual-assessment-suite.css?v=2318"></head><body>
<main class="va-shell"><header class="va-head"><div><small>VISUAL ASSESSMENT MINI SIM</small><h1>Abdomen & Pelvis Assessment</h1></div><small>Perform → observe → document</small></header>
<section class="va-card va-stage"><div class="va-visual"><div class="va-abdomen"><button class="quad" data-q="RUQ">RUQ</button><button class="quad" data-q="LUQ">LUQ</button><button class="quad" data-q="RLQ">RLQ</button><button class="quad" data-q="LLQ">LLQ</button></div><p id="abdObservation" style="max-width:360px;margin:10px auto 0;text-align:center;font-weight:750;color:#36566a">Inspect, palpate each quadrant, then assess the pelvis/hip only as clinically appropriate.</p></div><div class="va-controls"><button class="va-btn" data-step="inspect">Inspect abdomen</button><button class="va-btn" data-step="palpate">Palpate all four quadrants</button><button class="va-btn" data-step="pelvis">Assess pelvis/hip visually and by appropriate gentle exam</button><small>Do not repeatedly compress an unstable pelvis.</small></div></section>
<section id="result" class="va-card va-result">Complete the abdominal and pelvis/hip assessment before documenting.</section></main>
<script src="/vitals/patient-record.js"></script><script src="/vitals/scenario-definitions.js?v=2219"></script><script src="/vitals/scenario-session.js?v=5"></script><script src="/vitals/scenario-runtime.js?v=2223"></script><script src="/vitals/visual-assessment-suite.js?v=2026.08.18.23"></script><script>let q=new Set,s=new Set;const finding=String(VA.vital('abdominal_assessment',VA.vital('abdomen','Soft, non-tender'))),pelvis=String(VA.vital('pelvis_hip','Stable without tenderness')),abdLower=finding.toLowerCase(),pelvisLower=pelvis.toLowerCase();
const abdAbnormal=/tender|guard|rigid|distend|pain|bruis/.test(abdLower)&&!/non.?tender|no tenderness/.test(abdLower),pelvisAbnormal=/pain|tender|unstable|deform/.test(pelvisLower)&&!/without tenderness|non.?tender/.test(pelvisLower);const correct=abdAbnormal&&pelvisAbnormal?'both':abdAbnormal?'abdomen':pelvisAbnormal?'pelvis':'normal';const observation=document.querySelector('#abdObservation');
function updateObservation(text){if(observation)observation.textContent=text}
document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{q.add(b.dataset.q);b.classList.add('active');VA.click();if(abdAbnormal)b.classList.add('tender');updateObservation(abdAbnormal?'The patient reacts with focal tenderness during quadrant palpation.':'The quadrant is soft without guarding or a pain response.');check()});
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{s.add(b.dataset.step);b.classList.add('done');VA.click();if(b.dataset.step==='inspect')updateObservation(/distend|bruis/.test(abdLower)?'Inspection shows an abnormal abdominal contour or external clue.':'No distention or obvious external abdominal injury is seen.');if(b.dataset.step==='palpate')updateObservation(abdAbnormal?'Palpation produces tenderness, guarding, or another abnormal response.':'The abdomen remains soft without a pain response to gentle palpation.');if(b.dataset.step==='pelvis'){if(pelvisAbnormal)document.querySelector('.va-abdomen')?.classList.add('pelvic-alert');updateObservation(pelvisAbnormal?'Gentle pelvis/hip assessment produces focal pain, tenderness, or instability.':'The pelvis/hip exam does not produce tenderness or instability.')}check()});
function check(){if(q.size===4&&s.size===3)VA.interpret({key:'abdominal_assessment',label:'Abdomen / Pelvis',prompt:'What did your abdomen and pelvis/hip exam show?',help:'Document the pattern you observed; do not repeat pelvic compression.',expectedFinding:`${finding}; ${pelvis}`,correctValue:correct,choices:[{value:'normal',label:'Abdomen soft/non-tender; pelvis/hip without concerning finding'},{value:'abdomen',label:'Abnormal abdominal tenderness, guarding, rigidity, distention, or injury clue'},{value:'pelvis',label:'Abdomen without major finding; abnormal pelvis/hip pain, tenderness, or instability'},{value:'both',label:'Both abdominal and pelvis/hip findings are abnormal'},{value:'uncertain',label:'Unable to determine from the assessment'}]})}</script></body></html>
