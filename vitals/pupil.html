<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Pupil Simulator</title>
<style>
  :root{
    --brand:#007B8A; --brand-600:#066371;
    --bg:#f0f8ff; --panel:#ffffff; --ink:#0f2b33; --muted:#46636a;
    --border:#e2e8f0; --shadow:0 10px 28px rgba(2,8,23,.08);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  html,body{overflow-x:hidden}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; line-height:1.45;
    -webkit-text-size-adjust:100%;
  }
  header{background:var(--brand); color:#fff; padding:14px 16px; font-weight:800; letter-spacing:.2px; position:sticky; top:0; z-index:10}
  main{max-width:980px; margin:0 auto; padding:12px}
  h2{margin:.25rem 0 .75rem}
  .card{background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:14px; box-shadow:var(--shadow); margin-bottom:12px}

  .face{
    display:grid; gap:16px; grid-template-columns:1fr; place-items:center; padding:6px;
  }
  @media(min-width:700px){ .face{ grid-template-columns:1fr 1fr; } }

  .eye{
    width:220px; height:220px; background:#fdebd0;
    border-radius:50%; border:2px solid #d7ccc8; position:relative;
    box-shadow:inset 0 8px 24px rgba(0,0,0,.12);
  }
  .sclera{
    position:absolute; inset:22px; background:#fff; border-radius:50%;
    box-shadow:inset 0 0 0 1px #e5e7eb;
  }
  .iris{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:120px; height:120px; border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #88b1c5, #3d6a7a 70%, #1f3c46 100%);
    box-shadow:inset 0 0 18px rgba(0,0,0,.35);
  }
  .pupil{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:40px; height:40px; border-radius:50%; background:#000;
    box-shadow:0 0 10px rgba(0,0,0,.35);
  }
  .corneal-gloss{
    position:absolute; top:38%; left:42%;
    width:26px; height:16px; border-radius:50%; background:rgba(255,255,255,.6);
    filter:blur(1px);
  }

  .controls{display:grid; gap:10px; grid-template-columns:1fr}
  @media(min-width:760px){ .controls{grid-template-columns:1fr 1fr} }
  .row{display:grid; gap:10px; grid-template-columns:1fr}
  label{font-weight:700}
  select{
    width:100%; padding:.6rem .7rem; border-radius:10px; border:1px solid var(--border);
    background:#fff;
  }

  .btn{
    appearance:none; border:0; background:var(--brand); color:#fff;
    padding:.7rem 1rem; border-radius:12px; font-weight:800; cursor:pointer;
  }
  .btn:hover{background:var(--brand-600)}
  .btn.ghost{background:#fff; color:var(--brand); border:2px solid var(--brand)}
  .btn.warn{background:#c77b00}

  .resp{margin:.5rem 0 0 0; padding:.6rem .7rem; border-radius:10px; background:#f8fafc; border:1px solid var(--border)}
  .results-list{margin:.5rem 0 0 1rem}
  .results-list li{margin:.2rem 0}
</style>
</head>
<body>
<header>Pupil Simulator</header>

<main>
  <!-- Visual exam -->
  <section class="card">
    <h2>Examine Pupils</h2>
    <p class="muted" style="margin-top:-4px">Use the <strong>Light</strong> toggle to check reactivity. Then select the condition for each eye.</p>

    <div class="face" aria-label="Eyes">
      <!-- Left eye -->
      <div>
        <div class="eye" id="eyeL" aria-label="Left eye">
          <div class="sclera"></div>
          <div class="iris"></div>
          <div class="pupil" id="pupilL"></div>
          <div class="corneal-gloss"></div>
        </div>
        <p style="text-align:center;margin:.5rem 0 0"><strong>Left</strong></p>
      </div>

      <!-- Right eye -->
      <div>
        <div class="eye" id="eyeR" aria-label="Right eye">
          <div class="sclera"></div>
          <div class="iris"></div>
          <div class="pupil" id="pupilR"></div>
          <div class="corneal-gloss"></div>
        </div>
        <p style="text-align:center;margin:.5rem 0 0"><strong>Right</strong></p>
      </div>
    </div>

    <div class="row" style="margin-top:10px">
      <button class="btn" id="toggleLight">🔦 Light: OFF</button>
      <div style="display:flex; gap:10px; flex-wrap:wrap">
        <button class="btn warn" id="newCase">Next Case</button>
        <button class="btn ghost" id="resetChoices">Reset Choices</button>
      </div>
    </div>
  </section>

  <!-- Choose answers -->
  <section class="card">
    <h2>Your Assessment</h2>
    <div class="controls">
      <div>
        <label for="selL">Left eye</label>
        <select id="selL">
          <option value="" selected>Select condition…</option>
          <option value="normal">Normal / reactive</option>
          <option value="pinpoint">Pinpoint</option>
          <option value="dilatedReactive">Dilated (reactive)</option>
          <option value="fixedDilated">Fixed dilated</option>
          <option value="sluggish">Sluggish</option>
          <option value="fixedMid">Fixed mid-position</option>
        </select>
      </div>
      <div>
        <label for="selR">Right eye</label>
        <select id="selR">
          <option value="" selected>Select condition…</option>
          <option value="normal">Normal / reactive</option>
          <option value="pinpoint">Pinpoint</option>
          <option value="dilatedReactive">Dilated (reactive)</option>
          <option value="fixedDilated">Fixed dilated</option>
          <option value="sluggish">Sluggish</option>
          <option value="fixedMid">Fixed mid-position</option>
        </select>
      </div>
    </div>

    <div class="row" style="margin-top:10px">
      <button class="btn" id="check">Show Results</button>
    </div>

    <div id="results" class="resp" hidden>
      <div id="summary"><strong>Results:</strong> —</div>
      <ul class="results-list" id="detailList"></ul>
      <div id="reasons" style="margin-top:.5rem"></div>
    </div>
  </section>
</main>

<script>
(function(){
  // --- DOM
  const pupilL = document.getElementById('pupilL');
  const pupilR = document.getElementById('pupilR');
  const toggleLightBtn = document.getElementById('toggleLight');
  const newCaseBtn = document.getElementById('newCase');
  const resetChoicesBtn = document.getElementById('resetChoices');
  const selL = document.getElementById('selL');
  const selR = document.getElementById('selR');
  const checkBtn = document.getElementById('check');
  const resultsWrap = document.getElementById('results');
  const summary = document.getElementById('summary');
  const detailList = document.getElementById('detailList');
  const reasonsBox = document.getElementById('reasons');

  // --- Condition model
  // Visual sizes (px) and behavior flags by condition.
  // We don't display these values; they just drive the visuals.
  const CONDITIONS = {
    normal:         { label:"Normal / reactive",        base:38, constrict:22, reactive:true,  sluggish:false },
    pinpoint:       { label:"Pinpoint",                 base:16, constrict:12, reactive:true,  sluggish:false },
    dilatedReactive:{ label:"Dilated (reactive)",       base:58, constrict:28, reactive:true,  sluggish:false },
    fixedDilated:   { label:"Fixed dilated",            base:64, constrict:64, reactive:false, sluggish:false },
    sluggish:       { label:"Sluggish",                 base:44, constrict:24, reactive:true,  sluggish:true  },
    fixedMid:       { label:"Fixed mid-position",       base:38, constrict:38, reactive:false, sluggish:false }
  };

  // Reasons mapped to the true condition (examples; not diagnostic)
  const REASONS = {
    normal: [
      "Normal finding in an awake, well-perfused patient",
      "Mild sympathetic tone (anxiety) can appear slightly larger yet reactive"
    ],
    pinpoint: [
      "Opioid effect (e.g., heroin, fentanyl, oxycodone)",
      "Pontine hemorrhage/lesion",
      "Organophosphate or cholinergic toxicity",
      "Miotic eye drops (e.g., pilocarpine)"
    ],
    dilatedReactive: [
      "Sympathomimetic stimulation (caffeine, amphetamines, cocaine)",
      "Anticholinergic drugs (e.g., atropine, ipratropium, antihistamines)",
      "Dark environment / fight-or-flight",
      "Postictal state (may be reactive but larger)"
    ],
    fixedDilated: [
      "Uncal herniation with CN III compression (“blown pupil”)",
      "Severe anoxia/hypoxia or brain death (often bilateral)",
      "Topical/mydriatic agent to that eye (e.g., atropine drop)",
      "Severe ocular trauma"
    ],
    sluggish: [
      "Raised intracranial pressure (ICP)",
      "Hypoxia, hypothermia, or shock",
      "Sedatives/brain injury affecting pupillary reflex arc",
      "Early compression of CN III"
    ],
    fixedMid: [
      "Severe midbrain/brainstem injury",
      "Deep anesthesia or central herniation",
      "Brain death (often with other absent brainstem reflexes)"
    ]
  };

  // Weighted random pick of conditions (favor normal/learners’ variety)
  const WEIGHTED = [
    "normal","normal","normal",
    "pinpoint","pinpoint",
    "dilatedReactive","dilatedReactive",
    "sluggish",
    "fixedDilated",
    "fixedMid"
  ];

  // State
  let truth = { L:null, R:null };
  let lightOn = false;

  function rand(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

  function applyPupil(el, cond, toLight){
    const c = CONDITIONS[cond];
    const size = (c.reactive && toLight) ? c.constrict : c.base;
    // Animate if sluggish; instant for fixed; quick for reactive
    el.style.transition = c.reactive ? (c.sluggish ? 'width 1.2s ease, height 1.2s ease' : 'width .18s ease, height .18s ease') : 'none';
    el.style.width = size + 'px';
    el.style.height = size + 'px';
  }

  function render(){
    applyPupil(pupilL, truth.L, lightOn);
    applyPupil(pupilR, truth.R, lightOn);
    toggleLightBtn.textContent = lightOn ? "🔦 Light: ON" : "🔦 Light: OFF";
  }

  function newCase(){
    lightOn = false;
    // Ensure a realistic mix; sometimes symmetric, sometimes anisocoria
    const left = rand(WEIGHTED);
    let right = rand(WEIGHTED);

    // Small chance to intentionally generate anisocoria patterns that make sense
    // e.g., one fixed dilated + contralateral normal
    if(Math.random()<0.35){
      const pattern = rand(["anisocoria1","anisocoria2","symmetric"]);
      if(pattern==="anisocoria1"){ // fixed dilated on one side
        const side = Math.random()<0.5 ? 'L' : 'R';
        truth[side] = "fixedDilated";
        truth[side==='L'?'R':'L'] = rand(["normal","sluggish","dilatedReactive"]);
      }else if(pattern==="anisocoria2"){ // pinpoint one side (rare pharmacologic)
        const side = Math.random()<0.5 ? 'L' : 'R';
        truth[side] = "pinpoint";
        truth[side==='L'?'R':'L'] = rand(["normal","sluggish"]);
      }else{
        truth.L = left; truth.R = left;
      }
    }else{
      truth.L = left; truth.R = right;
    }

    // Reset UI selections/results
    selL.value = ""; selR.value = "";
    resultsWrap.hidden = true;
    detailList.innerHTML = "";
    summary.innerHTML = "<strong>Results:</strong> —";
    reasonsBox.innerHTML = "";

    render();
  }

  toggleLightBtn.addEventListener('click', ()=>{
    lightOn = !lightOn;
    render();
  });

  newCaseBtn.addEventListener('click', newCase);

  resetChoicesBtn.addEventListener('click', ()=>{
    selL.value = ""; selR.value = "";
    resultsWrap.hidden = true;
  });

  function conditionLabel(key){ return CONDITIONS[key].label; }

  checkBtn.addEventListener('click', ()=>{
    if(!selL.value || !selR.value){
      resultsWrap.hidden = false;
      summary.innerHTML = "<strong>Results:</strong> Select a condition for both eyes.";
      detailList.innerHTML = "";
      reasonsBox.innerHTML = "";
      return;
    }

    const correctL = selL.value === truth.L;
    const correctR = selR.value === truth.R;

    summary.innerHTML =
      `<strong>Results:</strong> Left: ${correctL?'✅ Correct':'❌ Incorrect'} • Right: ${correctR?'✅ Correct':'❌ Incorrect'}`;

    detailList.innerHTML = "";
    const liL = document.createElement('li');
    liL.innerHTML = `<strong>Left:</strong> You chose <em>${conditionLabel(selL.value)}</em>. Actual: <em>${conditionLabel(truth.L)}</em>.`;
    const liR = document.createElement('li');
    liR.innerHTML = `<strong>Right:</strong> You chose <em>${conditionLabel(selR.value)}</em>. Actual: <em>${conditionLabel(truth.R)}</em>.`;
    detailList.appendChild(liL);
    detailList.appendChild(liR);

    // Reasons for the actual conditions
    function listReasons(side, cond){
      const title = side + " eye – " + conditionLabel(cond);
      const items = (REASONS[cond]||[]).map(r=>`<li>${r}</li>`).join('');
      return `<p><strong>${title}</strong></p><ul>${items}</ul>`;
    }
    reasonsBox.innerHTML = listReasons("Left", truth.L) + listReasons("Right", truth.R);

    resultsWrap.hidden = false;
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  });

  // Init
  newCase();
})();
</script>
</body>
</html>
