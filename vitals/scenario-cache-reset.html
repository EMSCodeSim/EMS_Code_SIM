<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Refresh Scenario Files | EMSCodeSim</title><style>body{font-family:system-ui,sans-serif;background:#eef3f6;margin:0;padding:24px;color:#173042}.card{max-width:650px;margin:10vh auto;background:white;padding:28px;border-radius:18px;box-shadow:0 12px 36px #17304222}a{display:inline-block;background:#0b6477;color:white;text-decoration:none;padding:12px 16px;border-radius:10px}#status{font-weight:700}</style></head><body><main class="card"><h1>Refreshing scenario files</h1><p id="status">Clearing the older cached scenario pages…</p><p><a id="continue" href="/vitals/scenario-launcher.html?picturefix=3" hidden>Open scenarios</a></p></main><script>
(async()=>{const status=document.getElementById('status'),link=document.getElementById('continue');try{if('caches'in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('ems-reference-')).map(k=>caches.delete(k)));}if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.filter(r=>r.active&&r.active.scriptURL.includes('offline-reference-sw.js')).map(r=>r.update()));await navigator.serviceWorker.register('/offline-reference-sw.js',{updateViaCache:'none'});}status.textContent='The old scenario cache has been cleared. Open the scenario launcher below.';}catch(e){status.textContent='Refresh completed as far as this browser allows. Open the scenario launcher below.';}link.hidden=false;})();
</script></body></html>
